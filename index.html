<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Worldsim</title>
<link rel="stylesheet" href="css/main.css?v=20260904-build1">
</head>
<body>
  <div id="app">
    <canvas id="map-canvas"></canvas>
    <div id="hud">
      <div id="hud-date">—</div>
      <div id="hud-controls">
        <button id="btn-council" class="hud-btn council-btn" aria-label="Open royal council">Council</button>
        <button id="btn-menu" class="hud-btn menu-btn" aria-label="Open menu">☰</button>
        <button id="btn-pause" class="hud-btn" aria-label="Pause">II</button>
        <button id="btn-speed-half" class="hud-btn speed-btn adaptive-speed hidden" data-speed="0.5">0.5x</button>
        <button id="btn-speed-1" class="hud-btn speed-btn active" data-speed="1">1x</button>
        <button id="btn-speed-2" class="hud-btn speed-btn" data-speed="2">2x</button>
        <button id="btn-speed-4" class="hud-btn speed-btn" data-speed="4">4x</button>
      </div>
    </div>
    <section id="council-panel" class="council-panel hidden" aria-label="Royal council">
      <header class="council-header">
        <div><small>Royal council</small><h2 id="council-title">Your advisors</h2></div>
        <button id="btn-close-council" aria-label="Close council">&times;</button>
      </header>
      <nav id="advisor-tabs" class="advisor-tabs" aria-label="Choose an advisor"></nav>
      <div id="advisor-content" class="advisor-content"></div>
    </section>
    <div id="performance-notice" class="performance-notice hidden" role="status" aria-live="polite"></div>
    <div id="legend" class="legend hidden">
      <div class="layer-toggle">
        <button class="layer-btn active" data-layer="density">Pop</button>
        <button class="layer-btn" data-layer="stability">Stability</button>
        <button class="layer-btn" data-layer="wealth">Wealth</button>
        <button class="layer-btn" data-layer="political">Political</button>
      </div>
      <div id="legend-label"></div>
      <div id="legend-gradient">
        <div id="legend-bar"></div>
        <div id="legend-scale"><span id="legend-min"></span><span id="legend-max"></span></div>
      </div>
      <div id="legend-categorical"></div>
    </div>
    <div id="region-sheet" class="sheet hidden">
      <div id="region-sheet-handle"></div>
      <button id="btn-close-sheet" aria-label="Close">&times;</button>
      <h2 id="region-name">—</h2>
      <div id="region-controls"></div>
      <div id="region-details"></div>
    </div>
    <div id="menu-modal" class="modal hidden">
      <div class="modal-card menu-card">
        <button id="btn-close-menu" class="menu-close" aria-label="Close menu">&times;</button>
        <h2>Menu</h2>
        <div class="menu-section">
          <h3>Game</h3>
          <div class="save-actions">
            <button id="btn-save-game">Save game</button>
            <button id="btn-load-game" disabled>Load game</button>
          </div>
          <div id="save-status" class="save-status" role="status" aria-live="polite">No saved game on this device.</div>
        </div>
        <div class="menu-section">
          <h3>Development</h3>
          <label class="menu-toggle-row">
            <span>
              <strong>Dev mode</strong>
              <small>Reveal the whole world and all region information.</small>
            </span>
            <input id="toggle-dev-mode" type="checkbox">
          </label>
        </div>
      </div>
    </div>
    <div id="picker-modal" class="modal">
      <div class="modal-card picker-card">
        <h2 id="picker-title">Choose your region</h2>
        <p id="picker-help">Choose where in the world you want to begin.</p>
        <button id="btn-load-start" class="picker-load hidden">Continue saved game</button>
        <div id="picker-list"></div>
      </div>
    </div>
    <div id="event-modal" class="modal hidden">
      <div class="modal-card">
        <h2 id="event-title">—</h2>
        <p id="event-body"></p>
        <div id="event-options"></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script type="module" src="js/main.js?v=20260905-siege1"></script>
</body>
</html>
