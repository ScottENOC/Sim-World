<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>World Simulator</title>
  <link rel="stylesheet" href="styles.css?v=20260922-modern-startup1" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
  <main id="app">
    <canvas id="map-canvas"></canvas>

    <header id="hud">
      <div id="hud-date">1300 BCE</div>
      <div id="hud-controls">
        <button id="btn-pause">Pause</button>
        <button id="btn-slower">−</button>
        <span id="speed-label">1×</span>
        <button id="btn-faster">+</button>
        <button id="btn-menu">☰</button>
      </div>
    </header>

    <div id="layer-controls">
      <button class="layer-btn active" data-layer="density">Population</button>
      <button class="layer-btn" data-layer="wealth">Wealth</button>
      <button class="layer-btn" data-layer="stability">Stability</button>
      <button class="layer-btn" data-layer="political">Political</button>
      <button class="layer-btn" data-layer="culture">Culture</button>
      <button class="layer-btn" data-layer="religion">Religion</button>
      <button class="layer-btn" data-layer="trade">Trade</button>
      <button class="layer-btn" data-layer="military">Military</button>
    </div>

    <section id="legend"></section>

    <section id="region-sheet" class="sheet hidden">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2 id="region-name">Region</h2>
        <button id="btn-close-sheet">×</button>
      </div>
      <div id="region-stats"></div>
      <div id="region-controls"></div>
    </section>

    <section id="advisor-panel" class="sheet hidden">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2 id="advisor-title">Advisor</h2>
        <button id="btn-close-advisor">×</button>
      </div>
      <div id="advisor-content"></div>
    </section>

    <div id="advisor-tabs">
      <button data-advisor="steward">Steward</button>
      <button data-advisor="quartermaster">Quartermaster</button>
      <button data-advisor="marshal">Marshal</button>
      <button data-advisor="diplomat">Diplomat</button>
      <button data-advisor="spymaster">Spymaster</button>
    </div>

    <section id="event-modal" class="modal hidden">
      <div class="modal-card">
        <h2 id="event-title">Event</h2>
        <p id="event-body"></p>
        <div id="event-actions"></div>
      </div>
    </section>

    <section id="picker-modal" class="modal">
      <div class="modal-card picker-card">
        <h2 id="picker-title">Choose your starting region</h2>
        <p id="picker-help">Start small. You know your home and its neighbours.</p>
        <div id="picker-list"></div>
      </div>
    </section>

    <section id="menu-modal" class="modal hidden">
      <div class="modal-card menu-card">
        <h2>Menu</h2>
        <button id="btn-save">Save game</button>
        <button id="btn-load">Load game</button>
        <label class="toggle-row">
          <input type="checkbox" id="toggle-dev-mode" />
          Reveal all map (dev)
        </label>
        <button id="btn-close-menu">Close</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/ui/startupPicker.js?v=20260922-picker-deadlock1"></script>
  <script type="module">
    import { waitForScenarioSelection } from './js/core/scenarios.js?v=20260922-picker-deadlock1';
    let started = false;
    const refreshTechnologyModules = async () => {
      const urls = [
        './js/core/performanceProfiler.js?v=20260912-deep-profiler1',
        './js/core/fogOfWar.js?v=20260904-weather1',
        './js/technology/breakthroughs.js?v=20260912-medieval1',
        './js/technology/classicalTransition.js?v=20260907-classical1',
        './js/technology/electrification.js?v=20260917-electric1',
        './js/technology/modernEnergy.js?v=20260920-modern-energy1',
        './js/technology/petroleum.js?v=20260917-oil1',
        './js/technology/spaceLaunchGeography.js?v=20260920-modern-energy1',
        './js/technology/telephone.js?v=20260918-telephone1',
        './js/diplomacy/nuclearDeterrence.js?v=20260920-nuclear-deterrence1',
        './js/military/nuclearWarRisk.js?v=20260921-nuclear-risk1',
        './js/military/nuclearExchange.js?v=20260921-nuclear-exchange1',
        './js/society/warSociety.js?v=20260922-war-society1',
      ];
      await Promise.all(urls.map((url) => fetch(url, { cache: 'reload' }).catch(() => null)));
    };
    const startMain = async () => {
      if (started || !window.__worldsimScenario) return;
      started = true;
      const status = document.querySelector('.startup-picker-status');
      if (status) status.textContent = 'Loading world…';
      window.__reportWorldStartup = () => {};
      try {
        await refreshTechnologyModules();
        await import('./js/main.js?v=20260923-modern-visibility1');
      } catch (error) {
        const message = error?.stack || error?.message || String(error);
        if (status) status.textContent = `Simulation module failed: ${message}`;
        console.error('Could not load simulation module graph', error);
      }
    };
    const poll = () => {
      startMain();
      if (!started) setTimeout(poll, 25);
    };
    poll();
  </script>
  <script type="module" src="js/ui/spymasterContestedClaimsUi.js?v=20260922-contested-claims1"></script>
  <script type="module" src="js/ui/scenarioRuntimeAuto.js?v=20260923-black-map5"></script>
  <script type="module" src="js/ui/electricGridAutoUi.js?v=20260921-grid-ui1"></script>
  <script type="module" src="js/ui/institutionalCouncilUi.js?v=20260916-institution-ui1"></script>
  <script type="module" src="js/ui/institutionalCouncilSpendingUi.js?v=20260916-institution-ui2"></script>
  <script type="module" src="js/ui/economicRegulationUi.js?v=20260917-regulation1"></script>
  <script type="module" src="js/ui/institutionalRegionControlsUi.js?v=20260916-region-controls1"></script>
  <script type="module" src="js/ui/useOfForceUi.js?v=20260916-force1"></script>
  <script type="module" src="js/ui/currencyUi.js?v=20260912-forex1"></script>
  <script type="module" src="js/ui/nonStateOrganisationsUi.js?v=20260912-pmc1"></script>
  <script type="module" src="js/ui/medievalSystemsUi.js?v=20260912-medieval2"></script>
  <script type="module" src="js/ui/fleetUi.js?v=20260908-fleets1"></script>
  <script type="module" src="js/ui/navalDesignUi.js?v=20260919-naval-light-metals1"></script>
  <script>
    (() => {
      const monumentalIds = new Set(['monumental_tomb', 'great_temple', 'ceremonial_complex', 'monumental_statue']);
      const defaultWorkers = { monumental_tomb: 420, great_temple: 380, ceremonial_complex: 300, monumental_statue: 240 };
      const refresh = () => {
        const typeSelect = document.getElementById('construction-type');
        const slider = document.getElementById('new-construction-workers');
        const count = document.getElementById('new-builder-count-label');
        const estimate = document.getElementById('construction-estimate');
        if (!typeSelect || !slider || !count || !estimate) return;
        const label = slider.closest('label')?.querySelector('span');
        const id = typeSelect.value;
        if (!monumentalIds.has(id)) {
          if (label) label.childNodes[0].textContent = 'Assigned builders ';
          return;
        }
        const baseline = defaultWorkers[id] || Number(slider.value) || 1;
        const scale = Math.max(0.5, Math.min(4, (Number(slider.value) || baseline) / baseline));
        if (label) label.childNodes[0].textContent = 'Commissioned ambition ';
        count.textContent = `${Math.round(Number(slider.value) || baseline).toLocaleString()} builders · ${scale.toFixed(2)}× scale`;
        const old = estimate.textContent || '';
        const split = old.indexOf(' Doubling labour halves time');
        const base = split >= 0 ? old.slice(0, split) : old;
        estimate.textContent = `${base} For monumental projects this initial commitment sets physical scope: more ambition means a larger structure, more materials, more worker-weeks and greater upkeep. Once commissioned, changing the active workforce changes construction speed, not the monument's planned size.`;
      };
      const observer = new MutationObserver(refresh);
      const council = document.getElementById('advisor-content');
      if (council) observer.observe(council, { childList: true, subtree: true });
      document.addEventListener('input', (event) => {
        if (event.target?.id === 'new-construction-workers') queueMicrotask(refresh);
      });
      document.addEventListener('change', (event) => {
        if (event.target?.id === 'construction-type') queueMicrotask(refresh);
      });
    })();
  </script>
</body>
</html>
