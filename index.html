<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Worldsim</title>
<link rel="stylesheet" href="css/main.css?v=20260904-build1">
</head>
<body>
  <div id="app">
    <canvas id="map-canvas"></canvas>
    <div id="hud">
      <div id="hud-date">—</div>
      <div id="hud-controls">
        <button id="btn-council" class="hud-btn council-btn" aria-label="Open royal council">Council</button>
        <button id="btn-menu" class="hud-btn menu-btn" aria-label="Open menu">☰</button>
        <button id="btn-pause" class="hud-btn" aria-label="Pause">II</button>
        <button id="btn-speed-half" class="hud-btn speed-btn adaptive-speed hidden" data-speed="0.5">0.5x</button>
        <button id="btn-speed-1" class="hud-btn speed-btn active" data-speed="1">1x</button>
        <button id="btn-speed-2" class="hud-btn speed-btn" data-speed="2">2x</button>
        <button id="btn-speed-4" class="hud-btn speed-btn" data-speed="4">4x</button>
      </div>
    </div>
    <section id="council-panel" class="council-panel hidden" aria-label="Royal council">
      <header class="council-header">
        <div><small>Royal council</small><h2 id="council-title">Your advisors</h2></div>
        <button id="btn-close-council" aria-label="Close council">&times;</button>
      </header>
      <nav id="advisor-tabs" class="advisor-tabs" aria-label="Choose an advisor"></nav>
      <div id="advisor-content" class="advisor-content"></div>
    </section>
    <div id="performance-notice" class="performance-notice hidden" role="status" aria-live="polite"></div>
    <div id="legend" class="legend hidden">
      <div class="layer-toggle">
        <button class="layer-btn active" data-layer="density">Pop</button>
        <button class="layer-btn" data-layer="stability">Stability</button>
        <button class="layer-btn" data-layer="wealth">Wealth</button>
        <button class="layer-btn" data-layer="political">Political</button>
      </div>
      <div id="legend-label"></div>
      <div id="legend-gradient">
        <div id="legend-bar"></div>
        <div id="legend-scale"><span id="legend-min"></span><span id="legend-max"></span></div>
      </div>
      <div id="legend-categorical"></div>
    </div>
    <div id="region-sheet" class="sheet hidden">
      <div id="region-sheet-handle"></div>
      <button id="btn-close-sheet" aria-label="Close">&times;</button>
      <h2 id="region-name">—</h2>
      <div id="region-controls"></div>
      <div id="region-details"></div>
    </div>
    <div id="menu-modal" class="modal hidden">
      <div class="modal-card menu-card">
        <button id="btn-close-menu" class="menu-close" aria-label="Close menu">&times;</button>
        <h2>Menu</h2>
        <div class="menu-section">
          <h3>Game</h3>
          <div class="save-actions">
            <button id="btn-save-game">Save game</button>
            <button id="btn-load-game" disabled>Load game</button>
          </div>
          <div id="save-status" class="save-status" role="status" aria-live="polite">No saved game on this device.</div>
        </div>
        <div class="menu-section">
          <h3>Development</h3>
          <label class="menu-toggle-row">
            <span>
              <strong>Dev mode</strong>
              <small>Reveal the whole world and all region information.</small>
            </span>
            <input id="toggle-dev-mode" type="checkbox">
          </label>
        </div>
      </div>
    </div>
    <div id="picker-modal" class="modal">
      <div class="modal-card picker-card">
        <h2 id="picker-title">Choose your region</h2>
        <p id="picker-help">Choose where in the world you want to begin.</p>
        <button id="btn-load-start" class="picker-load hidden">Continue saved game</button>
        <div id="picker-list"></div>
      </div>
    </div>
    <div id="event-modal" class="modal hidden">
      <div class="modal-card">
        <h2 id="event-title">—</h2>
        <p id="event-body"></p>
        <div id="event-options"></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script type="module" src="js/main.js?v=20260906-prestige2"></script>
  <script>
    // The Steward's existing construction control uses builder count to set a
    // monumental project's physical scope when it is commissioned. Keep that
    // distinction visible without changing the active-project workforce control.
    (() => {
      const monumentalIds = new Set(['monumental_tomb', 'great_temple', 'ceremonial_complex', 'monumental_statue']);
      const defaultWorkers = { monumental_tomb: 420, great_temple: 380, ceremonial_complex: 300, monumental_statue: 240 };
      const refresh = () => {
        const typeSelect = document.getElementById('construction-type');
        const slider = document.getElementById('new-construction-workers');
        const count = document.getElementById('new-builder-count-label');
        const estimate = document.getElementById('construction-estimate');
        if (!typeSelect || !slider || !count || !estimate) return;
        const label = slider.closest('label')?.querySelector('span');
        const id = typeSelect.value;
        if (!monumentalIds.has(id)) {
          if (label) label.childNodes[0].textContent = 'Assigned builders ';
          return;
        }
        const baseline = defaultWorkers[id] || Number(slider.value) || 1;
        const scale = Math.max(0.5, Math.min(4, (Number(slider.value) || baseline) / baseline));
        if (label) label.childNodes[0].textContent = 'Commissioned ambition ';
        count.textContent = `${Math.round(Number(slider.value) || baseline).toLocaleString()} builders · ${scale.toFixed(2)}× scale`;
        const old = estimate.textContent || '';
        const split = old.indexOf(' Doubling labour halves time');
        const base = split >= 0 ? old.slice(0, split) : old;
        estimate.textContent = `${base} For monumental projects this initial commitment sets physical scope: more ambition means a larger structure, more materials, more worker-weeks and greater upkeep. Once commissioned, changing the active workforce changes construction speed, not the monument's planned size.`;
      };
      const observer = new MutationObserver(refresh);
      const council = document.getElementById('advisor-content');
      if (council) observer.observe(council, { childList: true, subtree: true });
      document.addEventListener('input', (event) => {
        if (event.target?.id === 'new-construction-workers') queueMicrotask(refresh);
      });
      document.addEventListener('change', (event) => {
        if (event.target?.id === 'construction-type') queueMicrotask(refresh);
      });
    })();
  </script>
  <script type="module">
    import { ensureEducation, setScribalStudentTarget, educatedSpecialists } from './js/society/education.js?v=20260906-education1';

    const renderEducationControls = () => {
      const sim = window.__worldsim;
      const controls = document.getElementById('region-controls');
      if (!sim || !controls) return;
      const selectedId = sim.map?.selectedId;
      const playerId = sim.fogOfWar?.playerRegionId;
      if (!selectedId || selectedId !== playerId) return;
      const region = sim.regions.find((candidate) => candidate.id === selectedId);
      if (!region) return;
      document.getElementById('education-controls')?.remove();
      const education = ensureEducation(region);
      const section = document.createElement('div');
      section.id = 'education-controls';
      section.className = 'raid-section';
      const literate = Boolean(education.writingSystem);
      const specialists = educatedSpecialists(region);
      const recordedActivities = Object.keys(education.recordedExperience || {}).filter((key) => education.recordedExperience[key] > 1);
      const adminCoverage = Math.round((education.administrativeCoverage || 0) * 100);
      const adminDemand = Math.round(education.administrativeDemand || 0);
      const infoQuality = Math.max(0, Math.round(((education.informationQuality || 1) - 1) * 100));
      section.innerHTML = `
        <strong>Scribes, writing and archives</strong>
        <div class="raid-status">
          ${literate ? `Writing tradition: ${education.writingSystem}` : 'No local writing tradition'}<br>
          Students ${Math.round(education.students).toLocaleString()} · junior scribes ${Math.round(education.juniorScribes).toLocaleString()} · experienced ${Math.round(education.experiencedScribes).toLocaleString()} · masters ${Math.round(education.masterScribes).toLocaleString()}<br>
          Archive maturity ${(education.archiveLevel * 100).toFixed(0)}% · educated specialists ${Math.round(specialists).toLocaleString()}<br>
          Government scribal coverage ${adminCoverage}%${adminDemand ? ` · demand equivalent to ${adminDemand} trained officials` : ''}${infoQuality ? `<br>Recorded reports gain about ${infoQuality}% information quality from scribal processing` : ''}${recordedActivities.length ? `<br>Recorded practical fields: ${recordedActivities.join(', ')}` : ''}
          ${!literate && education.adoptionProgress > 0 ? `<br>Foreign writing exposure: ${(education.adoptionProgress * 100).toFixed(0)}% toward local adoption` : ''}
        </div>
        <label class="control-row">Target scribal students
          <input id="input-scribal-students" type="number" min="0" step="1" value="${Math.round(education.targetStudents)}" ${literate ? '' : 'disabled'}>
        </label>
        <div class="raid-status">${literate
          ? 'Training takes years. More students only become useful administrators, commercial record-keepers and scholars as cohorts mature; temples and merchants also compete for their labour.'
          : 'An oral society cannot train local scribes yet. Writing is normally adopted through sustained contact with literate neighbours or trading partners.'}</div>
      `;
      controls.appendChild(section);
      const input = section.querySelector('#input-scribal-students');
      input?.addEventListener('change', () => setScribalStudentTarget(region, input.value));
    };

    const regionControls = document.getElementById('region-controls');
    if (regionControls) new MutationObserver(() => {
      if (!document.getElementById('education-controls')) queueMicrotask(renderEducationControls);
    }).observe(regionControls, { childList: true, subtree: false });
    document.getElementById('region-sheet')?.addEventListener('click', () => queueMicrotask(renderEducationControls));
    setInterval(() => {
      if (!document.getElementById('region-sheet')?.classList.contains('hidden')) renderEducationControls();
    }, 1500);
  </script>
</body>
</html>
