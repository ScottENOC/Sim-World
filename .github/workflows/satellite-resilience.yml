name: Satellite resilience

on:
  pull_request:
    paths:
      - 'js/technology/satelliteResilience.js'
      - 'js/technology/orbitalSatellites.js'
      - 'js/military/spaceWarfare.js'
      - 'js/technology/modernEnergy.js'
      - 'tools/test-satellite-resilience.mjs'
      - '.github/workflows/satellite-resilience.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check resilience modules
        run: |
          node --check js/technology/satelliteResilience.js
          node --check js/technology/orbitalSatellites.js
          node --check js/military/spaceWarfare.js
          node --check js/technology/modernEnergy.js
      - name: Run satellite resilience regressions
        run: node tools/test-satellite-resilience.mjs
