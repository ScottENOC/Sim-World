name: Optimise polity indexing
on:
  push:
    paths:
      - '.github/workflows/optimise-polities.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and test
        run: |
          python3 tools/optimise-polities.py
          node --check js/politics/polities.js
          node -e "import('./js/politics/polities.js')"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/politics/polities.js
          git commit -m "Index polity territories once per tick"
          git push
