name: Covert leadership shocks

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check js/military/specialOperations.js
      - run: node --check js/politics/leadershipShocks.js
      - run: node --check js/politics/continuity.js
      - run: node --check js/politics/useOfForce.js
      - run: node tools/test-covert-leadership-shocks.mjs
      - run: node tools/test-rotary-special-ops.mjs
      - run: node tools/test-regime-change.mjs
