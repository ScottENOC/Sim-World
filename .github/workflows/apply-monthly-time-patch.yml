name: Apply monthly time patch
on:
  push:
    paths:
      - '.github/workflows/apply-monthly-time-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch and test
        run: |
          python3 tools/apply-monthly-time-patch.py
          find js tools -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/main.js js/economy/laborCore.js js/economy/trade.js tools/calibrate.mjs
          git commit -m "Move early simulation to monthly day-based ticks"
          git push
