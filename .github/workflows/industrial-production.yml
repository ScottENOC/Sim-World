name: Industrial production validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/technology/industrialProduction.js'
      - 'js/technology/breakthroughs.js'
      - 'js/economy/industrialSupply.js'
      - 'tools/test-industrial-production.mjs'
      - '.github/workflows/industrial-production.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax checks
        run: |
          node --check js/technology/industrialProduction.js
          node --check js/technology/breakthroughs.js
          node --check js/economy/industrialSupply.js
      - name: Industrial production regression
        run: node tools/test-industrial-production.mjs
      - name: Railway compatibility regression
        run: node tools/test-industrial-railways.mjs
      - name: Petroleum compatibility regression
        run: node tools/test-oil-resource.mjs
      - name: Structural transformation compatibility
        run: node tools/test-structural-transformation.mjs
