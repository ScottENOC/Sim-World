name: Tariffs and labour integration

on:
  pull_request:
    paths:
      - 'js/economy/trade.js'
      - 'js/economy/tradePolicy.js'
      - 'js/society/labourRelations.js'
      - 'js/ui/advisors.js'
      - 'js/ai/nationAi.js'
      - 'tools/test-tariffs-and-labour.mjs'
      - '.github/workflows/tariffs-labour.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check js/economy/trade.js
      - run: node --check js/economy/tradePolicy.js
      - run: node --check js/society/labourRelations.js
      - run: node --check js/ui/advisors.js
      - run: node --check js/ai/nationAi.js
      - run: node tools/test-tariffs-and-labour.mjs
      - run: node tools/test-labour-relations.mjs
