name: Instant map gesture feedback

on:
  push:
    branches: [fix-instant-map-gesture-feedback]
    paths:
      - 'tools/apply-instant-map-gesture-feedback.py'
      - '.github/workflows/instant-map-gesture-feedback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/apply-instant-map-gesture-feedback.py
      - name: Validate renderer and UI priority
        run: |
          node --check js/ui/mapRenderer.js
          node tools/test-ui-priority.mjs
          grep -q '_applyGesturePreview(event.transform)' js/ui/mapRenderer.js
          grep -q "translate3d" js/ui/mapRenderer.js
          grep -q '_clearGesturePreview()' js/ui/mapRenderer.js
          git diff --check
      - name: Commit materialised renderer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/ui/mapRenderer.js
          if git diff --cached --quiet; then
            echo 'Renderer already current'
          else
            git commit -m 'Make map pan and pinch respond instantly'
            git pull --rebase
            git push
          fi
