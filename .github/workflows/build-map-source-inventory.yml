name: Build map source inventory
on:
  push:
    paths:
      - '.github/workflows/build-map-source-inventory.yml'
      - 'tools/map-source-manifest.json'
      - 'tools/fetch-map-source-inventory.py'
      - 'tools/map-region-plan.json'
      - 'tools/validate-map-region-plan.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch subdivision inventory
        run: |
          python tools/fetch-map-source-inventory.py
          python -m json.tool tools/map-source-inventory.json >/dev/null
          python -m json.tool tools/map-region-plan.json >/dev/null
          python tools/validate-map-region-plan.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/map-source-inventory.json
          if git diff --cached --quiet; then
            echo "Inventory already current"
          else
            git commit -m "Inventory eastern Mediterranean map sources"
            git pull --rebase
            git push
          fi
