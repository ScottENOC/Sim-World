name: Rebalance France and Germany

on:
  push:
    branches: [rebalance-france-germany]
    paths:
      - 'tools/rebalance-france-germany.py'
      - '.github/workflows/rebalance-france-germany.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check shapely==2.1.1 pyproj==3.7.2
      - name: Rebalance regions
        run: |
          python tools/rebalance-france-germany.py | tee /tmp/rebalance.log
          python tools/build-sea-expansion-v2.py --land-geo data/world/regions.geo.json --output-dir /tmp/rebalance-sea
          cp /tmp/rebalance-sea/seaRegions.geo.json data/world/seaRegions.geo.json
          cp /tmp/rebalance-sea/seaRegions.meta.json data/world/seaRegions.meta.json
          python tools/build-terrain.py
          node tools/generate-world-spatial-base.mjs
      - name: Validate region scale and runtime data
        run: |
          python - <<'PY'
          import json
          geo=json.load(open('data/world/regions.geo.json'))['features']
          meta=json.load(open('data/world/regions.meta.json'))['regions']
          res=json.load(open('data/world/resources.initial.json'))
          terrain=json.load(open('data/world/terrain.initial.json'))
          ids={f['properties']['id'] for f in geo}
          assert ids=={m['id'] for m in meta}==set(res)==set(terrain)
          rows={iso:[m for m in meta if next(f for f in geo if f['properties']['id']==m['id'])['properties'].get('sourceGroup')==iso] for iso in ('FRA','DEU')}
          assert len(rows['FRA'])==40, len(rows['FRA'])
          assert len(rows['DEU'])==26, len(rows['DEU'])
          avg={iso:sum(m['areaSqKm'] for m in group)/len(group) for iso,group in rows.items()}
          print('AVERAGE_REGION_AREA', avg)
          assert abs(avg['FRA']-avg['DEU'])/((avg['FRA']+avg['DEU'])/2) < 0.12, avg
          assert min(m['areaSqKm'] for m in rows['FRA']) > 1000
          assert min(m['areaSqKm'] for m in rows['DEU']) > 1000
          PY
          grep -q 'FRA_REBALANCED regions=40' /tmp/rebalance.log
          grep -q 'DEU_REBALANCED regions=26' /tmp/rebalance.log
          node tools/test-world-spatial-skeleton.mjs
          node tools/test-world-spatial-real-map.mjs
          node tools/calibrate.mjs --years 1 --seeds 1 --snapshot-years 1 --days-per-tick 30 --scale 1 --output /tmp/rebalance-smoke.json
          git diff --check
      - name: Commit generated world
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/world/regions.geo.json data/world/regions.meta.json data/world/resources.initial.json data/world/seaRegions.geo.json data/world/seaRegions.meta.json data/world/terrain.initial.json data/world/spatial.base.json
          git commit -m 'Rebalance France and Germany region scale'
          git pull --rebase
          git push
