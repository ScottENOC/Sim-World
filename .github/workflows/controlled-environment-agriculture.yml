name: Controlled-environment agriculture

on:
  pull_request:
  push:
    branches:
      - feature/controlled-environment-agriculture

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check CEA integration
        run: |
          node --check js/economy/controlledEnvironmentAgriculture.js
          node --check js/economy/electricity.js
          node --check js/technology/industrialProduction.js
      - name: Run CEA regression
        run: node tools/test-controlled-environment-agriculture.mjs
      - name: Re-run food diversity regression
        run: node tools/test-food-diversity.mjs
      - name: Re-run synthetic fertiliser regression
        run: node tools/test-synthetic-fertiliser.mjs
