name: Computing industry supply chain

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/economy/computingIndustry.js
      - run: node --check js/economy/tradeGoods.js
      - run: node tools/test-computing-industry.mjs
