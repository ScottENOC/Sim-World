name: Agricultural genetics and seed banks

on:
  pull_request:
    paths:
      - 'js/economy/agriculturalGenetics.js'
      - 'js/economy/agriculturalPests.js'
      - 'js/economy/foodDiversity.js'
      - 'js/economy/labor.js'
      - 'tools/test-agricultural-genetics.mjs'
      - '.github/workflows/agricultural-genetics.yml'
  push:
    branches: [main]
    paths:
      - 'js/economy/agriculturalGenetics.js'
      - 'js/economy/agriculturalPests.js'
      - 'js/economy/foodDiversity.js'
      - 'js/economy/labor.js'
      - 'tools/test-agricultural-genetics.mjs'
      - '.github/workflows/agricultural-genetics.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check genetics integration
        run: |
          node --check js/economy/agriculturalGenetics.js
          node --check js/economy/agriculturalPests.js
          node --check js/economy/foodDiversity.js
          node --check js/economy/labor.js
          node --check tools/test-agricultural-genetics.mjs
      - name: Run agricultural genetics regression
        run: node tools/test-agricultural-genetics.mjs
      - name: Re-run pest regression
        run: node tools/test-agricultural-pests.mjs
      - name: Re-run food diversity regression
        run: node tools/test-food-diversity.mjs
