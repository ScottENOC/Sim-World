name: Crop biotechnology

on:
  pull_request:
    paths:
      - 'js/economy/cropBiotechnology.js'
      - 'js/economy/agriculturalPests.js'
      - 'js/economy/foodDiversity.js'
      - 'js/economy/electricity.js'
      - 'js/economy/labor.js'
      - 'tools/test-crop-biotechnology.mjs'
      - '.github/workflows/crop-biotechnology.yml'
  push:
    branches: [ main ]
    paths:
      - 'js/economy/cropBiotechnology.js'
      - 'js/economy/agriculturalPests.js'
      - 'js/economy/foodDiversity.js'
      - 'js/economy/electricity.js'
      - 'js/economy/labor.js'
      - 'tools/test-crop-biotechnology.mjs'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check crop biotechnology integration
        run: |
          node --check js/economy/cropBiotechnology.js
          node --check js/economy/agriculturalPests.js
          node --check js/economy/foodDiversity.js
          node --check js/economy/electricity.js
          node --check js/economy/labor.js
          node --check tools/test-crop-biotechnology.mjs
      - name: Run crop biotechnology regression
        run: node tools/test-crop-biotechnology.mjs
      - name: Re-run selective breeding regression
        run: node tools/test-crop-breeding.mjs
      - name: Re-run agricultural pest regression
        run: node tools/test-agricultural-pests.mjs
      - name: Re-run food diversity regression
        run: node tools/test-food-diversity.mjs
      - name: Re-run electricity regression
        run: node tools/test-electricity.mjs
