name: Diplomatic service UI validation

on:
  push:
    branches: [diplomatic-service-ui-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integration
        run: python tools/apply-diplomatic-service-ui.py
      - name: Syntax checks
        run: |
          python -m py_compile tools/apply-diplomatic-service-ui.py
          node --check js/ui/diplomaticServicePanel.js
          node --check js/main.js
      - name: Diplomatic service UI regressions
        run: node tools/test-diplomatic-service-ui.mjs
      - name: Diplomacy and language regressions
        run: |
          node tools/test-diplomat-personalities.mjs
          node tools/test-diplomats-counterintelligence.mjs
          node tools/test-joint-operations-command.mjs
          node tools/test-population-language-networks.mjs
      - name: Campaign and military regressions
        run: |
          node tools/test-campaign-command-advisor.mjs
          node tools/test-allied-battle-coordination.mjs
          node tools/test-subregional-army-battles.mjs
          node tools/test-supply-corridors-ai.mjs
      - name: Headless world smoke test
        run: node tools/calibrate.mjs --years 1 --seeds 1 --snapshot-years 1 --days-per-tick 30 --scale 1 --output /tmp/diplomatic-ui-smoke.json
      - name: Diff sanity
        run: git diff --check
      - name: Commit integrated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Diplomatic service UI integration already materialised'
          else
            git commit -m 'Integrate diplomatic service player UI'
            git pull --rebase --autostash
            git push
          fi
