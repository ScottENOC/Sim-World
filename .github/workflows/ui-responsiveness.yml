name: UI responsiveness

on:
  pull_request:
    paths:
      - 'js/main.js'
      - 'js/ui/mapRenderer.js'
      - 'js/core/clock.js'
      - 'data/world/**'
      - 'tools/map-region-plan-v2.json'
      - 'tools/build-map-expansion-v2-fast.py'
      - 'tools/test-ui-priority.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check js/main.js
          node --check js/ui/mapRenderer.js
          node --check js/core/clock.js
          node --check tools/test-ui-priority.mjs
      - name: UI-priority regression
        run: node tools/test-ui-priority.mjs
      - name: Verify Chukotka absent and map counts aligned
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const meta=JSON.parse(fs.readFileSync('data/world/regions.meta.json','utf8'));
          const geo=JSON.parse(fs.readFileSync('data/world/regions.geo.json','utf8'));
          if (meta.regions.some(r => /chukot/i.test(r.name||''))) throw new Error('Chukotka still in metadata');
          if (geo.features.some(f => /chukot/i.test(f.properties?.name||''))) throw new Error('Chukotka still in geometry');
          if (meta.regions.length !== geo.features.length) throw new Error('metadata/geometry count mismatch');
          console.log('REGIONS='+meta.regions.length);
          NODE
      - name: Spatial and world regressions
        run: |
          node tools/test-world-spatial-skeleton.mjs
          node tools/test-world-spatial-real-map.mjs
          node tools/calibrate.mjs --years 1 --seeds 1 --snapshot-years 1 --days-per-tick 30 --scale 1 --output /tmp/ui-smoke.json
      - name: Diff sanity
        run: git diff --check
