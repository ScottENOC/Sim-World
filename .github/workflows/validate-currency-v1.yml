name: Validate currency v1

on:
  push:
    branches: [medieval-currency-v1]
    paths:
      - 'tools/test-currency.mjs'
      - '.github/workflows/validate-currency-v1.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run currency regression and core checks
        run: |
          node tools/test-currency.mjs
          node tools/test-ui-priority.mjs
          node tools/test-world-spatial-skeleton.mjs
          node tools/test-diplomacy-readonly.mjs
          git diff --check
      - name: Remove temporary validation workflow
        run: |
          rm .github/workflows/validate-currency-v1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Remove temporary currency validation workflow'
          git pull --rebase
          git push
