name: Apply UI yield accounting patch

on:
  push:
    branches: [performance-ui-priority-v1]
    paths:
      - '.github/workflows/performance-yield-accounting-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate
        run: |
          python3 tools/apply-yield-accounting-patch.py
          node --check js/main.js
          node --check js/core/clock.js
          node tools/test-ui-priority.mjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep UI idle time out of speed throttling'
          git push
