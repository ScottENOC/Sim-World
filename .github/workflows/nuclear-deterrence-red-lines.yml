name: Nuclear deterrence and red lines

on:
  push:
    branches: [feature/nuclear-deterrence-red-lines]
    paths:
      - 'js/diplomacy/nuclearDeterrence.js'
      - 'js/military/aviation.js'
      - 'js/military/qualifiedPersonnel.js'
      - 'js/technology/breakthroughs.js'
      - 'tools/apply-nuclear-deterrence-red-lines.py'
      - 'tools/test-nuclear-deterrence.mjs'
      - '.github/workflows/nuclear-deterrence-red-lines.yml'
  pull_request:
    paths:
      - 'js/diplomacy/nuclearDeterrence.js'
      - 'js/military/aviation.js'
      - 'js/military/qualifiedPersonnel.js'
      - 'js/technology/breakthroughs.js'
      - 'tools/test-nuclear-deterrence.mjs'
      - '.github/workflows/nuclear-deterrence-red-lines.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'feature/nuclear-deterrence-red-lines' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integration on feature branch
        if: github.event_name == 'push'
        run: python tools/apply-nuclear-deterrence-red-lines.py
      - name: Syntax checks
        run: |
          node --check js/diplomacy/nuclearDeterrence.js
          node --check js/military/aviation.js
          node --check js/military/qualifiedPersonnel.js
          node --check js/technology/breakthroughs.js
      - name: Deterrence and compatibility regressions
        run: |
          node tools/test-nuclear-deterrence.mjs
          node tools/test-nuclear-weaponisation.mjs
          node tools/test-strategic-nuclear.mjs
          node tools/test-nuclear-power.mjs
          node tools/test-aircraft-industry.mjs
          node tools/test-early-aviation.mjs
      - name: Commit integrated source
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/military/aviation.js js/military/qualifiedPersonnel.js js/technology/breakthroughs.js
          if ! git diff --cached --quiet; then
            git commit -m "Integrate nuclear deterrence and aerial refuelling"
            git push origin HEAD:feature/nuclear-deterrence-red-lines
          fi
