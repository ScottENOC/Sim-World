name: Region geometry compactness audit

on:
  push:
    branches:
      - audit-region-geometry-compactness
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install map dependencies
        run: python -m pip install --disable-pip-version-check shapely==2.1.1 pyproj==3.7.2 pyshp==2.3.1
      - name: Apply component-splitting repair
        run: python tools/apply-map-component-splitting.py
      - name: Syntax check
        run: python -m py_compile tools/audit-region-geometry.py tools/audit-inland-region-components.py tools/apply-map-component-splitting.py tools/test-map-component-splitting.py tools/build-old-world-asia-pacific.py tools/build-old-world-map-batch.py
      - name: Component splitting regression
        run: python tools/test-map-component-splitting.py
      - name: Audit every land-region geometry
        run: python tools/audit-region-geometry.py --focus Kursk --top 100 --json region-geometry-audit.json
      - name: Prioritise inland geometry defects
        run: python tools/audit-inland-region-components.py
      - name: Diff sanity
        run: git diff --check
      - name: Upload full audit
        uses: actions/upload-artifact@v4
        with:
          name: region-geometry-audit
          path: region-geometry-audit.json
          retention-days: 14
      - name: Commit generated builder repair
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/build-old-world-asia-pacific.py tools/build-old-world-map-batch.py
          if ! git diff --cached --quiet; then
            git commit -m 'Split disconnected map source components before clustering'
            git push
          fi
