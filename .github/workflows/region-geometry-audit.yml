name: Region geometry compactness audit

on:
  push:
    branches:
      - audit-region-geometry-compactness
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile tools/audit-region-geometry.py tools/audit-inland-region-components.py
      - name: Audit every land-region geometry
        run: python tools/audit-region-geometry.py --focus Kursk --top 100 --json region-geometry-audit.json
      - name: Prioritise inland geometry defects
        run: python tools/audit-inland-region-components.py
      - name: Upload full audit
        uses: actions/upload-artifact@v4
        with:
          name: region-geometry-audit
          path: region-geometry-audit.json
          retention-days: 14
