name: Military professionalisation validation

on:
  push:
    branches: [military-professionalisation-v1]
    paths:
      - '.github/workflows/military-professionalisation.yml'
      - 'tools/apply-military-professionalisation.py'
      - 'tools/test-military-professionalisation.mjs'
      - 'tools/test-battlefield-terrain.mjs'
      - 'js/military/professionalisation.js'
      - 'js/military/formations.js'
      - 'js/military/terrain.js'
      - 'js/military/policies.js'
      - 'js/military/campaigns.js'
      - 'js/world/region.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply campaign integration patch
        run: python tools/apply-military-professionalisation.py
      - name: Syntax checks
        run: |
          python -m py_compile tools/apply-military-professionalisation.py
          node --check js/military/professionalisation.js
          node --check js/military/formations.js
          node --check js/military/terrain.js
          node --check js/military/policies.js
          node --check js/military/campaigns.js
          node --check js/world/region.js
      - name: Terrain behaviour regression
        run: node tools/test-battlefield-terrain.mjs
      - name: Professionalisation regression
        run: node tools/test-military-professionalisation.mjs
      - name: Headless current-world smoke test
        run: node tools/calibrate.mjs --years 1 --seeds 1 --snapshot-years 1 --days-per-tick 30 --scale 1 --output /tmp/military-prof-smoke.json
      - name: Commit integrated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/military/campaigns.js js/world/region.js
          if git diff --cached --quiet; then
            echo 'Professionalisation integration already materialised'
          else
            git commit -m 'Integrate military professionalisation into campaigns'
            git pull --rebase
            git push
          fi
