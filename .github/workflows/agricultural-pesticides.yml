name: Agricultural pesticides

on:
  pull_request:
  push:
    branches:
      - feature/agricultural-pesticides

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check pesticide integration
        run: |
          node --check js/economy/agriculturalPesticides.js
          node --check js/economy/agriculturalPests.js
          node --check js/technology/industrialProduction.js
      - name: Run pesticide regression
        run: node tools/test-agricultural-pesticides.mjs
      - name: Re-run pest regression
        run: node tools/test-agricultural-pests.mjs
      - name: Re-run synthetic fertiliser regression
        run: node tools/test-synthetic-fertiliser.mjs
