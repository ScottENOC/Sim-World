name: Scenario router singleton patch

on:
  push:
    branches: [fix/scenario-router-singleton]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scenario-router-singleton
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python tools/scenario-router-singleton-temp.py
      - run: node --check js/core/scenarios.js
      - run: git diff --check
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/core/scenarios.js
          git commit -m 'Share scenario router state across module instances'
          git push origin HEAD:fix/scenario-router-singleton
