name: Verify Crimea source classification

on:
  push:
    branches: [expand-germany-low-countries-fix-pinch]
    paths:
      - '.github/workflows/check-crimea-western-names.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check shapely==2.1.1
      - name: Inspect admin source around Crimea
        run: |
          python - <<'PY'
          import json, urllib.request
          from shapely.geometry import shape, Point, box
          url='https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_1_states_provinces.geojson'
          req=urllib.request.Request(url,headers={'User-Agent':'Sim-World Crimea source diagnostic'})
          with urllib.request.urlopen(req,timeout=120) as r: world=json.load(r)
          p=Point(34.10,44.95)
          window=box(32.0,44.0,37.0,46.5)
          matches=[]
          for f in world['features']:
              g=shape(f['geometry'])
              if g.contains(p) or g.intersects(window):
                  props=f.get('properties',{})
                  matches.append({k:props.get(k) for k in ('name','name_en','adm0_a3','admin','iso_3166_2','type_en')})
          print('CRIMEA_ADMIN1_MATCHES='+json.dumps(matches,ensure_ascii=False))
          print('CONTAINS_SIMFEROPOL='+json.dumps([m for m,f in zip(matches,[])],ensure_ascii=False))
          for f in world['features']:
              g=shape(f['geometry'])
              if g.contains(p):
                  props=f.get('properties',{})
                  print('SIMFEROPOL_SOURCE_FEATURE='+json.dumps({k:props.get(k) for k in props if k in ('name','name_en','adm0_a3','admin','iso_3166_2','type_en','geonunit','gu_a3')},ensure_ascii=False))
          PY
