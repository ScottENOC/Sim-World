name: Military drones

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check drone integration
        run: |
          node --check js/military/drones.js
          node --check js/technology/modernEnergy.js
      - name: Run drone regressions
        run: node tools/test-drones.mjs
