name: Land loader diagnostics temp

on:
  push:
    branches: [fix/land-loader-cache-timeout]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/land-loader-cache-timeout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python tools/patch-land-loader-diagnostics-temp.py
      - run: node --check js/world/region.js
      - run: node --check js/main.js
      - run: git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html js/main.js js/world/region.js
          git commit -m 'Force fresh land loader and timeout stalled assets'
          git push origin HEAD:fix/land-loader-cache-timeout
