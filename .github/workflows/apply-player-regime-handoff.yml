name: Apply player regime handoff patch
on:
  push:
    branches: [feature/player-regime-handoff-v1]
    paths:
      - 'tools/apply-player-regime-handoff.mjs'
      - '.github/workflows/apply-player-regime-handoff.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/player-regime-handoff-v1
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply surgical main/runtime patch
        run: node tools/apply-player-regime-handoff.mjs
      - name: Commit resulting source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply-player-regime-handoff.mjs .github/workflows/apply-player-regime-handoff.yml
          git add js/main.js js/politics/regimeChange.js js/politics/continuity.js
          git diff --cached --check
          git commit -m "Wire player overthrow into exile and civil-war handoff"
          git push origin HEAD:feature/player-regime-handoff-v1
