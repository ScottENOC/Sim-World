name: Subsystem profile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/subsystem-profile.yml'

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare subsystem timings
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$GITHUB_SHA"
          BASE_SHA="43be79b6461a2be5676fd1e8713c321c3eb214dd"

          instrument() {
            node <<'NODE'
          const fs = require('fs');
          const path = 'tools/calibrate.mjs';
          let s = fs.readFileSync(path, 'utf8');
          const marker = "function run(seed) {";
          s = s.replace(marker, `const subsystemTimings = Object.create(null);\nfunction timed(name, fn) {\n  const started = performance.now();\n  const result = fn();\n  subsystemTimings[name] = (subsystemTimings[name] || 0) + performance.now() - started;\n  return result;\n}\n\n${marker}`);
          const reps = [
            ["    campaigns = tickCampaigns(campaigns, regionsById, polities, tick, toolTypes, rng).remaining;", "    campaigns = timed('campaigns', () => tickCampaigns(campaigns, regionsById, polities, tick, toolTypes, rng)).remaining;"],
            ["    prepareConstructionLabor(regions);", "    timed('constructionPrep', () => prepareConstructionLabor(regions));"],
            ["    prepareSiegeWorkforce(regions);", "    timed('siegePrep', () => prepareSiegeWorkforce(regions));"],
            ["    tickEconomy(regions, seas, toolTypes, rng, tick);", "    timed('economy', () => tickEconomy(regions, seas, toolTypes, rng, tick));"],
            ["    tickFishingKnowledge(fishingPairs, tick);", "    timed('fishingKnowledge', () => tickFishingKnowledge(fishingPairs, tick));"],
            ["    tickTrade(regions, tick);", "    timed('trade', () => tickTrade(regions, tick));"],
            ["    tickStateFinance(regions);", "    timed('stateFinance', () => tickStateFinance(regions));"],
            ["    tickInfrastructureMaintenance(regions);", "    timed('infraMaintenance', () => tickInfrastructureMaintenance(regions));"],
            ["    tickConstruction(regions, tick);", "    timed('construction', () => tickConstruction(regions, tick));"],
            ["    tickSiegeEquipment(regions);", "    timed('siegeEquipment', () => tickSiegeEquipment(regions));"],
            ["    tickBreakthroughs(regions, tick, rng);", "    timed('breakthroughs', () => tickBreakthroughs(regions, tick, rng));"],
            ["    tickReligion(regions, religiousWorld, tick, raids, campaigns, rng);", "    timed('religion', () => tickReligion(regions, religiousWorld, tick, raids, campaigns, rng));"],
            ["    tickDemographics(regions, religiousWorld);", "    timed('demographics', () => tickDemographics(regions, religiousWorld));"],
            ["    tickDiplomacy(regions, agreements, toolTypes, tick);", "    timed('diplomacy', () => tickDiplomacy(regions, agreements, toolTypes, tick));"],
            ["    tickPolities(polities, regions, tick);", "    timed('polities', () => tickPolities(polities, regions, tick));"],
            ["    tickBanditry(regions, toolTypes, agreements);", "    timed('banditry', () => tickBanditry(regions, toolTypes, agreements));"],
            ["    const raidResult = tickRaids(raids, regionsById, tick, toolTypes, rng);", "    const raidResult = timed('raids', () => tickRaids(raids, regionsById, tick, toolTypes, rng));"],
            ["    pruneKnowledge(regions, tick);", "    timed('knowledgePrune', () => pruneKnowledge(regions, tick));"]
          ];
          for (const [a,b] of reps) {
            if (!s.includes(a)) throw new Error('missing target: ' + a);
            s = s.replace(a,b);
          }
          const aiOld = "    tickNationAi(regions, '__calibration__', raids, campaigns, agreements, polities,\n      religiousWorld, tick, toolTypes, rng);";
          const aiNew = "    timed('nationAi', () => tickNationAi(regions, '__calibration__', raids, campaigns, agreements, polities,\n      religiousWorld, tick, toolTypes, rng));";
          if (!s.includes(aiOld)) throw new Error('missing nationAi target');
          s = s.replace(aiOld, aiNew);
          s = s.replace("  elapsedSeconds: +((performance.now() - started) / 1000).toFixed(1),", "  elapsedSeconds: +((performance.now() - started) / 1000).toFixed(1),\n  subsystemTimingsMs: Object.fromEntries(Object.entries(subsystemTimings).map(([k,v]) => [k, +v.toFixed(2)])),");
          fs.writeFileSync(path, s);
          NODE
          }

          run_ref() {
            local label="$1"
            local ref="$2"
            git checkout --force "$ref"
            instrument
            node tools/calibrate.mjs --years 2 --seeds 1 --snapshot-years 1 --output "/tmp/${label}.json" >/dev/null
            LABEL="$label" node -e "const r=require('/tmp/'+process.env.LABEL+'.json'); const p=process.env.LABEL.toUpperCase(); const s=r.runs[0].timeline.at(-1); console.log(p+'_TOTAL_SECONDS='+r.elapsedSeconds); console.log(p+'_TIMINGS='+JSON.stringify(r.subsystemTimingsMs)); console.log(p+'_TRADE='+s.weeklyTrade); console.log(p+'_FOOD_IMPORTS='+s.weeklyFoodImports)"
          }

          run_ref baseline "$BASE_SHA"
          run_ref current "$CURRENT_SHA"
