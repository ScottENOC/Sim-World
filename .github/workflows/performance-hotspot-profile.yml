name: Performance hotspot profile

on:
  push:
    branches: [performance-ui-priority-v1]

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V8 hotspot profile
        shell: bash
        run: |
          rm -f *simworld-v8.log isolate-*.log v8-profile.txt
          node --prof --logfile=simworld-v8.log tools/calibrate.mjs --years 1 --seeds 1 --snapshot-years 1 --days-per-tick 30 --scale 1 --output /tmp/profile.json >/dev/null
          profile_file=$(find . -maxdepth 1 -type f \( -name '*simworld-v8.log' -o -name 'isolate-*.log' \) | head -n 1)
          node --prof-process "$profile_file" > v8-profile.txt
          sed -n '1,180p' v8-profile.txt
