name: Apply calibration target/history support
on:
  push:
    paths:
      - '.github/workflows/apply-calibration-target-history.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and validate
        run: |
          python tools/patch-calibration-target-history.py
          node --check tools/calibrate.mjs
          node tools/calibrate.mjs --years 1 --seeds 1 --snapshot-years 1 --target-regions 300 --regional-detail true --output /tmp/calibration-test.json
          node -e "const r=require('/tmp/calibration-test.json'); if(r.configuration.actualRegions!==300) process.exit(1); if(!r.runs[0].timeline.at(-1).regional) process.exit(1);"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/calibrate.mjs
          git commit -m "Support fixed-size and regional calibration runs"
          git pull --rebase
          git push
