name: Industrial investment and procurement
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/economy/industrialInvestment.js'
      - 'js/economy/industrialPlant.js'
      - 'js/economy/industrialSupply.js'
      - 'js/economy/tradeGoods.js'
      - 'js/economy/tradePolicy.js'
      - 'js/technology/industrialProduction.js'
      - 'js/ui/industrialInvestmentUi.js'
      - 'tools/test-industrial-investment.mjs'
      - '.github/workflows/industrial-investment.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax checks
        run: |
          node --check js/economy/industrialInvestment.js
          node --check js/economy/industrialPlant.js
          node --check js/technology/industrialProduction.js
          node --check js/ui/industrialInvestmentUi.js
      - name: Industrial investment regression
        run: node tools/test-industrial-investment.mjs
      - name: Component industrial base regression
        run: node tools/test-component-industrial-base.mjs
      - name: Industrial production regression
        run: node tools/test-industrial-production.mjs
      - name: Tariff and labour compatibility
        run: node tools/test-labour-relations.mjs
