name: Renaissance networks validation

on:
  push:
    branches:
      - renaissance-information-universities-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply integration if needed
        run: python tools/apply-renaissance-networks.py

      - name: Syntax checks
        run: |
          python -m py_compile tools/apply-renaissance-networks.py
          node --check js/society/renaissanceNetworks.js
          node --check js/main.js
          node --check tools/test-renaissance-networks.mjs
          node --check tools/benchmark-renaissance-networks.mjs

      - name: Renaissance regression
        run: node tools/test-renaissance-networks.mjs

      - name: 2300-region Renaissance performance guardrail
        run: node tools/benchmark-renaissance-networks.mjs

      - name: Existing learning politics and diplomacy regressions
        run: |
          node tools/test-medieval-completion.mjs
          node tools/test-medieval-learning.mjs
          node tools/test-state-administration-elite-politics-v2.mjs
          node tools/test-finance-corporate-capital-v2.mjs
          node tools/test-ui-priority.mjs

      - name: Diff sanity
        run: git diff --check

      - name: Commit runtime integration
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/main.js
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate Renaissance information and university networks'
            git push
          fi
