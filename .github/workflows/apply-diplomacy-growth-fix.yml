name: Apply diplomacy relationship growth fix

on:
  push:
    branches: [fix-diplomacy-relationship-growth]
    paths: ['.github/workflows/apply-diplomacy-growth-fix.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply fix
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('js/diplomacy/relations.js')
          s=p.read_text()
          old="""export function attitudeToward(region, otherId) {
  return relationToward(region, otherId).attitude;
}
"""
          new="""export function attitudeToward(region, otherId) {
  const relations = ensureDiplomacy(region);
  return relations.get(otherId)?.attitude || 0;
}
"""
          assert old in s
          s=s.replace(old,new,1)

          old="""  for (const region of regions) {
    ensureDiplomacy(region);
    region.diplomacyReport = { paid: 0, received: 0, woodTaken: 0, support: 0 };
    for (const [otherId, relation] of region.relations.entries()) {
      relation.attitude *= attitudeRetention;
      const other = regionsById.get(otherId);
      if (other) {
        const bias = cultureDiplomaticBias(region, other);
        relation.attitude += (bias - relation.attitude) * cultureAdjustment;
        relation.attitude = clamp(relation.attitude, -1, 1);
      }
    }
  }
"""
          new="""  for (const region of regions) {
    ensureDiplomacy(region);
    region.diplomacyReport = { paid: 0, received: 0, woodTaken: 0, support: 0 };
    for (const [otherId, relation] of region.relations.entries()) {
      // Older builds created neutral relationship records merely by reading an
      // attitude during trade-route evaluation. They carry no simulation state
      // and make diplomacy maintenance trend toward an all-to-all graph.
      if (!relation.lastCause && Math.abs(Number(relation.attitude) || 0) < 1e-12) {
        region.relations.delete(otherId);
        continue;
      }
      relation.attitude *= attitudeRetention;
      const other = regionsById.get(otherId);
      if (other) {
        const bias = cultureDiplomaticBias(region, other);
        relation.attitude += (bias - relation.attitude) * cultureAdjustment;
        relation.attitude = clamp(relation.attitude, -1, 1);
      }
    }
  }
"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('tools/test-diplomacy-readonly.mjs')
          p.write_text("""import { attitudeToward, changeAttitude, ensureDiplomacy } from '../js/diplomacy/relations.js';\n\nconst a={id:'a'};\nif (attitudeToward(a,'b') !== 0) throw new Error('neutral attitude should read as zero');\nif (ensureDiplomacy(a).size !== 0) throw new Error('attitude read created a relationship entry');\nchangeAttitude(a,'b',0.2,'test',1);\nif (ensureDiplomacy(a).size !== 1) throw new Error('real attitude change did not create relationship');\nif (Math.abs(attitudeToward(a,'b')-0.2)>1e-9) throw new Error('stored attitude read failed');\nconsole.log('diplomacy read-only regression passed');\n""")
          PY
      - name: Validate
        run: |
          node --check js/diplomacy/relations.js
          node tools/test-diplomacy-readonly.mjs
          node tools/test-ui-priority.mjs
          node tools/test-world-spatial-skeleton.mjs
          git diff --check
      - name: Commit source and remove temporary workflow
        run: |
          rm .github/workflows/apply-diplomacy-growth-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Stop read-only diplomacy checks growing relationship graph'
          git pull --rebase
          git push
