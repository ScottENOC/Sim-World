name: Patch AI optimisation generator

on:
  push:
    branches: [performance-ui-priority-v1]
    paths:
      - '.github/workflows/patch-ai-optimisation-generator.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate generator
        run: |
          python3 tools/patch-ai-optimisation-generator.py
          python3 tools/apply-ai-performance-optimisations.py
          node --check js/military/strategicPlanning.js
          node tools/test-ai-performance-optimisations.mjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make AI performance generator preserve indexed no-allies fast path'
          git push
