name: Apply modern land warfare integration
on:
  push:
    branches: [feature/modern-land-war-v1]
    paths:
      - 'tools/apply-modern-land-war-v1.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/modern-land-war-v1
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python tools/apply-modern-land-war-v1.py
      - run: |
          node --check js/military/modernLandWarfare.js
          node --check js/military/campaigns.js
          node --check js/technology/breakthroughs.js
          node tools/test-modern-land-warfare.mjs
          node tools/test-early-modern-military-transition.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/military/modernLandWarfare.js js/military/campaigns.js js/technology/breakthroughs.js
          git commit -m 'Integrate modern land warfare into campaigns'
          git push origin HEAD:feature/modern-land-war-v1
