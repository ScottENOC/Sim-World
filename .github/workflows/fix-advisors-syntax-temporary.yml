name: Temporary advisors syntax repair

on:
  push:
    branches:
      - fix/advisors-syntax

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/advisors-syntax
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace fragile education warning templates
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'js/ui/advisors.js';
          const before = fs.readFileSync(path, 'utf8');
          const lines = before.split('\n').map((line) => {
            if (line.includes('const educationWarnings =')) {
              return `    const educationWarnings = education.warnings.map((text) => '<p class="advisor-note warning">' + text + '</p>').join('');`;
            }
            if (line.includes('const educationBenefits =')) {
              return `    const educationBenefits = education.benefits.map((text) => '<p class="advisor-note">' + text + '</p>').join('');`;
            }
            return line;
          });
          const after = lines.join('\n');
          if (after === before) {
            console.log('No repair needed.');
            process.exit(0);
          }
          fs.writeFileSync(path, after);
          NODE
      - name: Verify repaired module parses
        run: node --check js/ui/advisors.js
      - name: Commit repair
        run: |
          if git diff --quiet -- js/ui/advisors.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/ui/advisors.js
          git commit -m 'Fix advisors education template syntax'
          git push origin HEAD:fix/advisors-syntax
