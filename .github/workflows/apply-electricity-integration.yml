name: Apply electricity integration
on:
  push:
    branches: [feature/electricity-local-grid-v1]
    paths:
      - 'tools/apply-electricity-integration.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/electricity-local-grid-v1
      - run: python tools/apply-electricity-integration.py
      - run: node --check js/economy/electricity.js
      - run: node --check js/technology/electrification.js
      - run: node --check js/economy/construction.js
      - run: node --check js/economy/industrialSupply.js
      - run: node --check js/politics/popularWellbeing.js
      - run: node --check js/main.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/economy/construction.js js/technology/breakthroughs.js js/main.js js/economy/industrialSupply.js js/politics/popularWellbeing.js
          git commit -m "Integrate local electricity generation and distribution"
          git push origin HEAD:feature/electricity-local-grid-v1
