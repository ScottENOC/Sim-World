name: Apply tariffs labour v1

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/apply-tariffs-labour-v1.py'
      - '.github/workflows/apply-tariffs-labour-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply-tariffs-labour-v1.py
      - run: |
          node --check js/economy/trade.js
          node --check js/society/labourRelations.js
          node --check js/ui/advisors.js
          node --check js/ai/nationAi.js
          node tools/test-tariffs-and-labour.mjs
      - name: Remove one-shot migration files
        run: rm tools/apply-tariffs-labour-v1.py .github/workflows/apply-tariffs-labour-v1.yml
      - name: Commit applied implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Activate tariffs and labour-policy integration"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
