name: Corporate infrastructure rollout
on:
  push:
    branches: [corporate-infrastructure-catalogue-v1, foreign-investment-ui-v1, foreign-investment-nationalisation-v1, foreign-investment-procurement-v1]
  pull_request:
    paths:
      - 'js/economy/corporateInfrastructure.js'
      - 'js/economy/corporateInfrastructureAi.js'
      - 'js/economy/infrastructureOwnership.js'
      - 'js/economy/industrialSupply.js'
      - 'js/economy/governmentEconomicPolicy.js'
      - 'js/economy/railways.js'
      - 'js/ui/foreignInvestmentUi.js'
      - 'js/ui/mapFirstUi.js'
      - 'tools/test-corporate-infrastructure.mjs'
      - 'tools/test-foreign-investment-ui.mjs'
      - 'tools/test-infrastructure-ownership.mjs'
      - 'tools/test-procurement-policy.mjs'
      - 'tools/test-industrial-railways.mjs'
      - '.github/workflows/corporate-infrastructure.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/test-corporate-infrastructure.mjs
      - run: node tools/test-foreign-investment-ui.mjs
      - run: node tools/test-infrastructure-ownership.mjs
      - run: node tools/test-procurement-policy.mjs
      - run: node tools/test-infrastructure-investment-damage.mjs
      - run: node tools/test-industrial-railways.mjs
