name: Corporate infrastructure rollout
on:
  push:
    branches: [corporate-infrastructure-catalogue-v1]
  pull_request:
    paths:
      - 'js/economy/corporateInfrastructure.js'
      - 'js/economy/corporateInfrastructureAi.js'
      - 'tools/test-corporate-infrastructure.mjs'
      - '.github/workflows/corporate-infrastructure.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/test-corporate-infrastructure.mjs
      - run: node tools/test-infrastructure-investment-damage.mjs
      - run: node tools/test-industrial-railways.mjs
