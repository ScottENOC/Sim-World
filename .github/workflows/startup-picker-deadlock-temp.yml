name: Startup picker deadlock repair

on:
  push:
    branches: [fix/startup-picker-deadlock]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/startup-picker-deadlock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/patch-startup-picker-deadlock.py
      - run: node --check js/core/scenarios.js
      - run: node --check js/ui/startupPicker.js
      - run: node tools/test-country-picker.mjs
      - run: git diff --check
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/core/scenarios.js js/ui/startupPicker.js
          git commit -m 'Allow startup picker to bypass scenario fetch gate'
          git push origin HEAD:fix/startup-picker-deadlock
