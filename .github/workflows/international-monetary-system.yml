name: International monetary system
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/economy/internationalMoney.js'
      - 'js/economy/currency.js'
      - 'js/economy/forex.js'
      - 'js/economy/trade.js'
      - 'js/economy/monetaryModernisation.js'
      - 'js/politics/polities.js'
      - 'js/main.js'
      - 'tools/test-international-money.mjs'
      - '.github/workflows/international-monetary-system.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check js/economy/internationalMoney.js
          node --check js/economy/currency.js
          node --check js/economy/forex.js
          node --check js/economy/trade.js
          node --check js/politics/polities.js
          node --check js/main.js
          node tools/test-international-money.mjs
          node tools/test-monetary-modernisation.mjs
          node tools/test-currency.mjs
          node tools/test-forex.mjs
