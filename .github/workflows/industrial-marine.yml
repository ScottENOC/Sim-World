name: Industrial marine progression
on:
  push:
    branches: [industrial-marine-steam-v1]
  pull_request:
    paths:
      - 'js/technology/industrialMarine.js'
      - 'js/military/firearms.js'
      - 'js/military/earlyModernWarfare.js'
      - 'js/military/fleets.js'
      - 'tools/test-industrial-marine.mjs'
      - '.github/workflows/industrial-marine.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/test-industrial-marine.mjs
      - run: node tools/test-industrial-railways.mjs
