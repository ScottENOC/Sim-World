name: International AI governance and statecraft

on:
  pull_request:
    paths:
      - 'js/diplomacy/aiStatecraft.js'
      - 'js/diplomacy/aiStatecraftRuntime.js'
      - 'js/diplomacy/cryptographyProgression.js'
      - 'js/diplomacy/internationalCrisisBodies.js'
      - 'tests/aiInternationalStatecraft.test.mjs'
      - '.github/workflows/ai-international-statecraft.yml'
  push:
    branches: [main]
    paths:
      - 'js/diplomacy/aiStatecraft.js'
      - 'js/diplomacy/aiStatecraftRuntime.js'
      - 'js/diplomacy/cryptographyProgression.js'
      - 'js/diplomacy/internationalCrisisBodies.js'
      - 'tests/aiInternationalStatecraft.test.mjs'
      - '.github/workflows/ai-international-statecraft.yml'

jobs:
  ai-statecraft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check js/diplomacy/aiStatecraft.js
          node --check js/diplomacy/aiStatecraftRuntime.js
          node --check js/diplomacy/cryptographyProgression.js
          node --check js/diplomacy/internationalCrisisBodies.js
      - name: International AI governance regressions
        run: node tests/aiInternationalStatecraft.test.mjs
      - name: Information-integrity compatibility
        run: node tests/informationIntegrity.test.mjs
      - name: Strategic-warning compatibility
        run: node tests/strategicWarning.test.mjs
