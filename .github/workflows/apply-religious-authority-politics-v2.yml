name: Apply religious authority politics v2
on:
  push:
    branches: [religious-authority-politics-v2]
permissions:
  contents: write
jobs:
  integrate-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: religious-authority-politics-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integration patch
        run: python3 tools/apply-religious-authority-politics-v2.py
      - name: Validate syntax and regressions
        run: |
          node --check js/society/medievalReligiousPolitics.js
          node --check js/ui/religiousPoliticsEventUi.js
          node --check js/main.js
          node tools/test-religious-authority-politics-v2.mjs
          node tools/test-medieval-systems-v2.mjs
          node tools/test-medieval-politics.mjs
          node tools/test-ui-priority.mjs
          node tools/test-world-spatial-skeleton.mjs
          git diff --check
      - name: Commit integration and remove temporary workflow
        run: |
          rm .github/workflows/apply-religious-authority-politics-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/main.js index.html .github/workflows/apply-religious-authority-politics-v2.yml
          git commit -m 'Integrate religious authority politics into simulation' || true
          git push origin HEAD:religious-authority-politics-v2
