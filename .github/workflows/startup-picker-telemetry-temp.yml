name: Startup picker telemetry patch

on:
  push:
    branches: [fix/startup-picker-telemetry]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/startup-picker-telemetry
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/patch-startup-telemetry.py
      - run: node --check js/ui/startupPicker.js
      - run: node --check js/core/scenarios.js
      - run: node tools/test-country-picker.mjs
      - run: git diff --check
      - name: Commit patched picker
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/ui/startupPicker.js
          git commit -m 'Report startup picker loading stages'
          git push origin HEAD:fix/startup-picker-telemetry
