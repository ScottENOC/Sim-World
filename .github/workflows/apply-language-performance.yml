name: Apply language performance optimisation

on:
  push:
    branches: [optimize-language-performance]
    paths: ['.github/workflows/apply-language-performance.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted language optimisations
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('js/diplomacy/languageChange.js')
          s=p.read_text()
          old="""export function languageShiftPressure(region, fromLanguageId, toLanguageId) {
  const n = ensureLanguageNetwork(region);
  if (fromLanguageId === toLanguageId) return 0;
  const toShare = nativeShare(region, toLanguageId);
  const fromShare = nativeShare(region, fromLanguageId);
  const policyPressure = Math.max(0, Number(n.languagePolicyPressure?.[toLanguageId] || 0));
  const attraction = clamp(toShare * 0.28 + institutionalWeight(n, toLanguageId) * 0.32 + prestigeWeight(n, toLanguageId) * 0.22 + secondLanguagePressure(n, toLanguageId) * 0.28 + policyPressure * 0.35);
  const retention = minorityRetention(region, n, fromLanguageId, fromShare);
  return clamp(attraction * (1 - retention));
}
"""
          new="""export function languageShiftPressure(region, fromLanguageId, toLanguageId, network = null, shares = null) {
  const n = network || ensureLanguageNetwork(region);
  if (fromLanguageId === toLanguageId) return 0;
  const currentShares = shares || n.communityShares || {};
  const toShare = Number(currentShares[toLanguageId] || 0);
  const fromShare = Number(currentShares[fromLanguageId] || 0);
  const policyPressure = Math.max(0, Number(n.languagePolicyPressure?.[toLanguageId] || 0));
  const attraction = clamp(toShare * 0.28 + institutionalWeight(n, toLanguageId) * 0.32 + prestigeWeight(n, toLanguageId) * 0.22 + secondLanguagePressure(n, toLanguageId) * 0.28 + policyPressure * 0.35);
  const retention = minorityRetention(region, n, fromLanguageId, fromShare);
  return clamp(attraction * (1 - retention));
}
"""
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace("const pressure = languageShiftPressure(region, from, to);", "const pressure = languageShiftPressure(region, from, to, n, shares);")
          p.write_text(s)

          p=Path('js/diplomacy/languageNetworks.js')
          s=p.read_text()
          anchor="""export function dominantLanguageId(region) {
  const c = refreshNativeLanguageCommunities(region);
  return Object.entries(c).sort((a,b) => b[1].share - a[1].share)[0]?.[0] || `lang:culture:${region?.id || 'unknown'}`;
}
"""
          replacement="""export function dominantLanguageIdFromNetwork(region) {
  const n = ensureLanguageNetwork(region);
  const communities = n.communities || {};
  let dominant = null;
  let bestShare = -1;
  for (const [id, entry] of Object.entries(communities)) {
    const share = Number(entry?.share || 0);
    if (share > bestShare) { bestShare = share; dominant = id; }
  }
  return dominant || `lang:culture:${region?.id || 'unknown'}`;
}

export function dominantLanguageId(region) {
  refreshNativeLanguageCommunities(region);
  return dominantLanguageIdFromNetwork(region);
}
"""
          assert anchor in s
          s=s.replace(anchor,replacement,1)
          p.write_text(s)

          p=Path('js/diplomacy/languageCommunication.js')
          s=p.read_text()
          s=s.replace("  dominantLanguageId,\n", "  dominantLanguageId,\n  dominantLanguageIdFromNetwork,\n")
          old="""export function tickCommunicationPractices(regions, polities = [], agreements = [], campaigns = [], currentTick = 0, elapsedDays = 7) {
  const polityById = new Map(polities.map((p) => [p.id, p]));
  const byId = new Map(regions.map((r) => [r.id, r]));
  const weekScale = Math.max(0.01, elapsedDays / 7);

  for (const region of regions) {
    const state = ensureCommunicationState(region);
"""
          new="""export function tickCommunicationPractices(regions, polities = [], agreements = [], campaigns = [], currentTick = 0, elapsedDays = 7) {
  const polityById = new Map(polities.map((p) => [p.id, p]));
  const byId = new Map(regions.map((r) => [r.id, r]));
  const weekScale = Math.max(0.01, elapsedDays / 7);

  for (const region of regions) refreshNativeLanguageCommunities(region);

  for (const region of regions) {
    const state = region.communicationState || ensureCommunicationState(region);
    const network = ensureLanguageNetwork(region);
    state.languageId = dominantLanguageIdFromNetwork(region);
"""
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace("    const specialistCount = Object.values(ensureLanguageNetwork(region).specialists).reduce", "    const specialistCount = Object.values(network.specialists).reduce")
          p.write_text(s)

          p=Path('js/core/performanceProfiler.js')
          s=p.read_text()
          s=s.replace("          <button id=\"perf-profiler-copy\" type=\"button\">Copy report</button>\n          <button id=\"perf-profiler-select\" type=\"button\">Select text</button>", "          <button id=\"perf-profiler-copy\" type=\"button\">Copy report</button>\n          <button id=\"perf-profiler-share\" type=\"button\">Share report</button>\n          <button id=\"perf-profiler-select\" type=\"button\">Select text</button>")
          old="""    modal.querySelector('#perf-profiler-copy')?.addEventListener('click', copyReport);
    modal.querySelector('#perf-profiler-select')?.addEventListener('click', () => {
"""
          new="""    modal.querySelector('#perf-profiler-copy')?.addEventListener('click', copyReport);
    const shareButton = modal.querySelector('#perf-profiler-share');
    if (shareButton) {
      if (navigator.share) {
        shareButton.addEventListener('click', async () => {
          try {
            await navigator.share({ title: 'Sim-World performance profile', text: buildReport() });
            status.textContent = `Shared report · ${samples.length} ticks sampled`;
          } catch (error) {
            if (error?.name !== 'AbortError') status.textContent = 'Could not open share sheet; use Select text instead.';
          }
        });
      } else {
        shareButton.disabled = true;
        shareButton.title = 'Web Share is not available in this browser';
      }
    }
    modal.querySelector('#perf-profiler-select')?.addEventListener('click', () => {
"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check js/diplomacy/languageChange.js
          node --check js/diplomacy/languageNetworks.js
          node --check js/diplomacy/languageCommunication.js
          node --check js/core/performanceProfiler.js
          node --check js/main.js
          node tools/test-ui-priority.mjs
          node tools/test-world-spatial-skeleton.mjs
          git diff --check
      - name: Commit optimised source
        run: |
          rm .github/workflows/apply-language-performance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Reduce repeated language-state rebuilding'
          git pull --rebase
          git push
