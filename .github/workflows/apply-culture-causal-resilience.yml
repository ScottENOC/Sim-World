name: Apply causal culture resilience
on:
  push:
    branches: [culture-causal-resilience-v1]
    paths: ['tools/apply-culture-causal-resilience.mjs', '.github/workflows/apply-culture-causal-resilience.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/apply-culture-causal-resilience.mjs
      - run: node --check js/society/culture.js
      - run: node tools/test-culture.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/society/culture.js tools/test-culture.mjs
          git commit -m 'Make cultural resilience causal rather than date-driven'
          git push
