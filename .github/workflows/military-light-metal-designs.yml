name: Military light-metal equipment designs

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  military-material-designs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check equipment design
        run: node --check js/military/equipmentGenerations.js
      - name: Syntax check player design UI
        run: node --check js/ui/militaryDesignUi.js
      - name: Syntax check industrial integration
        run: node --check js/technology/industrialProduction.js
      - name: Military material design regression
        run: node tools/test-military-light-metal-designs.mjs
      - name: Existing aircraft industry regression
        run: node tools/test-aircraft-industry.mjs
      - name: Existing light metals regression
        run: node tools/test-light-metals.mjs
      - name: Whitespace check
        run: git diff --check
