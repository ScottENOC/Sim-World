name: Reconstruct world geography from 598 baseline

on:
  push:
    branches: [reconstruct-world-geography-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install map dependencies
        run: |
          python -m pip install --disable-pip-version-check shapely==2.1.1 pyproj==3.7.2 pyshp==2.3.1
          npm install --no-save d3-geo@3

      - name: Apply generator hardening
        run: |
          python tools/apply-map-component-splitting.py
          python tools/apply-broad-map-component-splitting.py
          python tools/apply-reconstruction-dynamic-baselines.py

      - name: Preflight reconstruction tooling
        run: |
          python -m py_compile tools/reconstruct-world-from-598.py tools/repair-region-component-ownership.py tools/test-region-component-ownership.py tools/apply-broad-map-component-splitting.py tools/apply-reconstruction-dynamic-baselines.py tools/build-map-expansion-v2-fast.py tools/build-silk-road-expansion.py tools/build-east-africa-expansion.py tools/build-old-world-asia-pacific.py tools/build-old-world-map-batch.py
          python tools/test-region-component-ownership.py

      - name: Capture pre-reconstruction audit
        run: python tools/audit-region-geometry.py --focus Kursk --top 100 --json /tmp/geometry-before.json > /tmp/geometry-before.txt

      - name: Restore known-good 598-region baseline
        if: github.event_name == 'push'
        run: |
          git show 382e62eed6222bb30fad46287b94252b5f5ee5ab:data/world/regions.geo.json > data/world/regions.geo.json
          git show 382e62eed6222bb30fad46287b94252b5f5ee5ab:data/world/regions.meta.json > data/world/regions.meta.json
          git show 382e62eed6222bb30fad46287b94252b5f5ee5ab:data/world/resources.initial.json > data/world/resources.initial.json
          python - <<'PY'
          import json
          geo=json.load(open('data/world/regions.geo.json'))
          assert len(geo['features'])==598, len(geo['features'])
          print('BASELINE_REGIONS=598')
          PY

      - name: Reconstruct all generated land geography
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -o pipefail
          python tools/reconstruct-world-from-598.py | tee /tmp/reconstruction.log

      - name: Audit reconstructed geography
        run: |
          python tools/audit-region-geometry.py --focus Kursk --top 100 --json /tmp/geometry-after.json | tee /tmp/geometry-after.txt
          python tools/audit-inland-region-components.py | tee /tmp/inland-after.txt

      - name: Compare geometry quality
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          before=json.load(open('/tmp/geometry-before.json'))
          after=json.load(open('/tmp/geometry-after.json'))
          def flagged(doc): return sum(bool(r.get('flag')) for r in doc['regions'])
          def focus(doc):
              rows=doc.get('focus') or []
              return rows[0] if rows else None
          b=focus(before); a=focus(after)
          print('BEFORE_FEATURES='+str(before['feature_count']))
          print('AFTER_FEATURES='+str(after['feature_count']))
          print('BEFORE_FLAGGED='+str(flagged(before)))
          print('AFTER_FLAGGED='+str(flagged(after)))
          if b: print('BEFORE_KURSK_COMPONENTS='+str(b['components']))
          if a:
              print('AFTER_KURSK_COMPONENTS='+str(a['components']))
              print('AFTER_KURSK_LARGEST_FRACTION='+str(a['largest_component_fraction']))
          assert after['feature_count'] >= 1200, after['feature_count']
          assert flagged(after) < flagged(before), (flagged(before), flagged(after))
          if a and b:
              assert a['components'] < b['components'], (b['components'], a['components'])
          PY

      - name: Map and runtime regressions
        run: |
          python tools/test-old-world-asia-pacific-map.py
          python tools/test-map-component-splitting.py
          python tools/test-region-component-ownership.py
          node tools/test-country-picker.mjs
          node tools/test-world-spatial-skeleton.mjs
          node tools/test-world-spatial-real-map.mjs
          node tools/test-persistent-settlements-v2.mjs
          node tools/test-persistent-infrastructure-sites.mjs
          node tools/test-ui-priority.mjs
          node tools/test-east-africa-coffee.mjs
          node tools/test-food-luxuries-v1.mjs
          node tools/test-finance-corporate-capital-v2.mjs
          node tools/test-oceanic-provisioning-scurvy.mjs
          node tools/test-early-modern-military-transition.mjs
          node tools/benchmark-medieval-completion.mjs
          git diff --check

      - name: Upload reconstruction audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconstructed-world-geometry-audits
          path: |
            /tmp/geometry-before.json
            /tmp/geometry-after.json
            /tmp/geometry-before.txt
            /tmp/geometry-after.txt
            /tmp/inland-after.txt
            /tmp/reconstruction.log
          retention-days: 14

      - name: Commit reconstructed geography
        if: github.event_name == 'push' && success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/world tools/build-map-expansion-v2-fast.py tools/build-silk-road-expansion.py tools/build-east-africa-expansion.py
          if ! git diff --cached --quiet; then
            git commit -m 'Reconstruct generated world geography'
            git pull --rebase
            git push
          fi
