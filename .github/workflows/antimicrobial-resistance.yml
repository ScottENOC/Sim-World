name: Antimicrobial resistance

on:
  pull_request:
  push:
    branches:
      - feature/antimicrobial-resistance

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check AMR model
        run: node --check js/society/antimicrobialResistance.js
      - name: Run AMR regressions
        run: node tests/antimicrobialResistance.test.mjs
