name: Optimise trade route calculations
on:
  push:
    paths:
      - '.github/workflows/optimise-trade-routes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and test
        run: |
          python3 tools/optimise-trade-routes.py
          node --check js/economy/trade.js
          node -e "import('./js/economy/trade.js')"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/economy/trade.js
          git commit -m "Reuse trade route cost and security calculations"
          git push
