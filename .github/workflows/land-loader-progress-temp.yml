name: Land loader progress patch
on:
  push:
    branches: [fix/land-loader-progress]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/land-loader-progress
      - run: python tools/patch-land-loader-progress-temp.py
      - run: node --check js/world/region.js
      - run: git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/world/region.js
          git commit -m 'Instrument and yield land region loading'
          git push origin HEAD:fix/land-loader-progress
