name: Counter-logistics relief validation

on:
  push:
    branches: [counter-logistics-relief-v1]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check js/military/counterLogisticsAi.js
          node --check js/military/expeditionReliefAi.js
          node --check js/military/campaigns.js
          node --check js/ai/nationAi.js
          node --check js/main.js
      - name: Counter-logistics regressions
        run: node tools/test-counter-logistics-relief.mjs
      - name: Existing military regressions
        run: |
          node tools/test-supply-corridors-ai.mjs
          node tools/test-expeditionary-logistics.mjs
          node tools/test-subregional-movement.mjs
          node tools/test-subregional-control.mjs
          node tools/test-multi-party-war.mjs
          node tools/test-strategic-military-planning.mjs
          node tools/test-battlefield-terrain.mjs
          node tools/test-military-professionalisation.mjs
          node tools/test-persistent-fleets.mjs
      - name: Headless world smoke test
        run: node tools/calibrate.mjs --years 1 --seeds 1 --snapshot-years 1 --days-per-tick 30 --scale 1 --output /tmp/counter-logistics-relief-smoke.json
      - name: Diff sanity
        run: git diff --check
