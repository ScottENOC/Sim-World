name: Apply historical resource integration
on:
  push:
    paths:
      - '.github/workflows/apply-historical-resources.yml'
      - 'tools/patch-historical-resources.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and validate
        run: |
          python tools/patch-historical-resources.py
          python -m json.tool tools/map-resource-plan.json >/dev/null
          python -m py_compile tools/build-map-expansion.py
          node --check js/world/resources/extraction.js
          grep -q "SURFACE_TIN_STOCK_MULTIPLIER = 1" js/world/resources/extraction.js
          grep -q "historical_resource_endowment" tools/build-map-expansion.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/build-map-expansion.py js/world/resources/extraction.js
          git commit -m "Use historical resources for map expansion"
          git pull --rebase
          git push
