name: Agricultural pests

on:
  pull_request:
  push:
    branches:
      - feature/agricultural-pests-v1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check pest integration
        run: |
          node --check js/economy/agriculturalPests.js
          node --check js/economy/agriculturalWater.js
          node --check js/economy/foodDiversity.js
          node --check js/economy/labor.js
      - name: Run agricultural pest regression
        run: node tools/test-agricultural-pests.mjs
      - name: Re-run food diversity regression
        run: node tools/test-food-diversity.mjs
      - name: Re-run arable land regression
        run: node tools/test-arable-land.mjs
