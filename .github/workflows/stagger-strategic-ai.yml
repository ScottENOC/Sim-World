name: Stagger strategic AI
on:
  push:
    paths:
      - '.github/workflows/stagger-strategic-ai.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and test
        run: |
          python3 tools/stagger-strategic-ai.py
          node --check js/ai/nationAi.js
          node -e "import('./js/ai/nationAi.js')"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/ai/nationAi.js
          git commit -m "Stagger strategic AI reviews"
          git push
