name: Apply map picker patch
on:
  push:
    paths:
      - '.github/workflows/apply-map-picker-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and verify
        run: |
          python tools/patch-map-picker.py
          node --check js/main.js
          grep -q "Simulation map loaded" js/main.js
          grep -q "country: 'Anatolia'" js/main.js
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/main.js
          git commit -m "Add eastern map picker groupings"
          git pull --rebase
          git push
