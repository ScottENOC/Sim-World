name: Component industrial migration
on:
  push:
    branches: [feature/component-industrial-base-v1]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python tools/apply-component-industrial-base.py
      - run: |
          node --check js/economy/industrialPlant.js
          node --check js/technology/industrialProduction.js
          node --check js/economy/industrialSupply.js
          node --check js/military/equipmentGenerations.js
      - run: node tools/test-component-industrial-base.mjs
      - run: node tools/test-industrial-production.mjs
      - run: node tools/test-industrial-railways.mjs
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/technology/industrialProduction.js js/economy/construction.js js/economy/industrialSupply.js js/military/equipmentGenerations.js
          if git diff --cached --quiet; then echo current; else git commit -m 'Integrate component production and factory capacity'; git pull --rebase; git push; fi
