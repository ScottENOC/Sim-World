name: Apply Balkan map regions
on:
  push:
    paths:
      - '.github/workflows/apply-balkan-map-regions.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and validate
        run: |
          python tools/add-balkan-map-regions.py
          python tools/validate-map-region-plan.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/map-region-plan.json
          git commit -m "Add southern Balkan corridor to map plan"
          git pull --rebase
          git push
