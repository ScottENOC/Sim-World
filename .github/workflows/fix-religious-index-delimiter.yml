name: Fix religious index delimiter
on:
  push:
    branches: [ios-hotspot-no-regrets-v1]
    paths:
      - 'tools/fix-religious-index-delimiter.py'
      - '.github/workflows/fix-religious-index-delimiter.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fix-religious-index-delimiter.py
      - run: node --check js/society/medievalReligiousPolitics.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/society/medievalReligiousPolitics.js
          git commit -m 'Keep religious politics index source text-safe'
          git push
