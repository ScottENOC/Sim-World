name: Apply physical rocket artillery

on:
  push:
    branches: [feature/early-rocket-artillery]
    paths:
      - 'tools/apply-physical-rocket-artillery.py'
      - 'tools/test-rocket-artillery-campaign.mjs'
      - '.github/workflows/apply-physical-rocket-artillery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/early-rocket-artillery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply physical rocket artillery integration
        run: python tools/apply-physical-rocket-artillery.py
      - name: Syntax checks
        run: |
          node --check js/military/earlyRocketry.js
          node --check js/military/earlyModernWarfare.js
          node --check js/military/campaigns.js
          node --check js/economy/industrialWarEconomy.js
          node --check js/economy/tradeGoods.js
      - name: Regressions
        run: |
          node tools/test-early-rocketry.mjs
          node tools/test-rocket-artillery-campaign.mjs
          node tools/test-artillery-fire-control.mjs
          node tools/test-modern-land-warfare.mjs
          node tools/test-industrial-war-economics.mjs
          node tools/test-early-modern-military-transition.mjs
      - name: Commit integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/military/earlyRocketry.js js/military/earlyModernWarfare.js js/military/campaigns.js js/economy/industrialWarEconomy.js js/economy/tradeGoods.js
          if ! git diff --cached --quiet; then
            git commit -m "Integrate physical rocket artillery"
            git push origin HEAD:feature/early-rocket-artillery
          fi
