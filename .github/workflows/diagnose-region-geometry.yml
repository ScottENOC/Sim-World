name: Repair land geometry and country navigation

on:
  push:
    branches:
      - fix-region-geometry-western-sahara-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install geometry dependencies
        run: |
          pip install shapely==2.1.1
          npm install --no-save d3-geo@3
      - name: Canonicalize planar land geometry
        run: python tools/normalize-land-geojson.py --input data/world/regions.geo.json --output /tmp/regions.geo.normalized.json
      - name: Repair D3 spherical complement polygons
        run: node tools/repair-d3-region-geometry.mjs --input /tmp/regions.geo.normalized.json --output /tmp/regions.geo.repaired.json
      - name: Validate repaired geometry
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { geoArea, geoBounds } from 'd3-geo';
          const fc = JSON.parse(fs.readFileSync('/tmp/regions.geo.repaired.json', 'utf8'));
          const bad = [];
          for (const feature of fc.features) {
            const area = geoArea(feature);
            const bounds = geoBounds(feature);
            if (area > Math.PI || ((bounds[1][0] - bounds[0][0]) > 300 && area > 0.1)) {
              bad.push({ id: feature.id || feature.properties?.id, name: feature.properties?.name, area, bounds });
            }
          }
          console.log('FEATURES', fc.features.length);
          console.log('D3_COMPLEMENT_OR_GLOBAL_COUNT', bad.length);
          if (bad.length) throw new Error(`Malformed spherical land geometry remains: ${JSON.stringify(bad.slice(0, 20))}`);
          NODE
      - name: Install repaired map and rebuild player navigation
        run: |
          cp /tmp/regions.geo.repaired.json data/world/regions.geo.json
          python tools/build-region-navigation.py
      - name: Validate country picker
        run: node tools/test-country-picker.mjs
      - name: Validate map regressions
        run: |
          python tools/test-old-world-asia-pacific-map.py
          node tools/test-world-spatial-real-map.mjs
      - name: Confirm Western Sahara route and no Other/Other fallback for its region
        run: |
          python - <<'PY'
          import json
          nav = json.load(open('data/world/region-navigation.json'))
          ws = nav.get('manualNavigationExceptions', {}).get('Western Sahara', {}).get('regions', [])
          assert ws, 'Western Sahara navigation exception has no regions'
          for item in ws:
              memberships = nav['regions'][item['id']]
              assert {'continent':'Africa','country':'Western Sahara'} in memberships, (item, memberships)
              assert {'continent':'Other','country':'Other'} not in memberships, (item, memberships)
          print('WESTERN_SAHARA_NAVIGATION_OK', len(ws))
          PY
      - name: Commit repaired generated data
        run: |
          if git diff --quiet -- data/world/regions.geo.json data/world/region-navigation.json; then
            echo 'No generated map changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/world/regions.geo.json data/world/region-navigation.json
          git commit -m 'Repair land geometry and Western Sahara navigation'
          git push origin HEAD:fix-region-geometry-western-sahara-v2
