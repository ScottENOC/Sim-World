name: Strategic military planning validation

on:
  push:
    branches: [strategic-military-planning-v1]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check js/military/strategicPlanning.js
          node --check js/diplomacy/couriers.js
          node --check js/ai/nationAi.js
          node --check js/main.js
          node --check js/world/region.js
      - name: Strategic planning regressions
        run: node tools/test-strategic-military-planning.mjs
      - name: Existing military regressions
        run: |
          node tools/test-battlefield-terrain.mjs
          node tools/test-military-professionalisation.mjs
          node tools/test-persistent-fleets.mjs
      - name: Headless current-world smoke test
        run: node tools/calibrate.mjs --years 1 --seeds 1 --snapshot-years 1 --days-per-tick 30 --scale 1 --output /tmp/strategy-smoke.json
      - name: Diff sanity
        run: git diff --check
