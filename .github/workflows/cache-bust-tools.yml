name: Cache bust tools import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-tools.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update tools import version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/economy/laborCore.js')
          s = p.read_text()
          old = "./tools.js?v=20260904-weather1"
          new = "./tools.js?v=20260905-goods1"
          if old not in s:
              raise SystemExit('tools import target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check js/economy/laborCore.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/economy/laborCore.js
          git commit -m "Bust cache for manufactured tool flow"
          git push origin HEAD:main
