name: Regenerate Crimea and Finland map outputs

on:
  push:
    branches: [fix/crimea-finland-borders]
    paths:
      - 'tools/repair-crimea-finland-geography.py'
      - 'tools/reconstruct-world-from-598.py'
      - '.github/workflows/crimea-finland-regenerate.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/crimea-finland-borders
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install map dependencies
        run: |
          python -m pip install --disable-pip-version-check shapely==2.1.1 pyproj==3.7.2 pyshp==2.3.1
          npm install --no-save d3-geo@3
      - name: Repair base physical geography
        run: python tools/repair-crimea-finland-geography.py --world-dir data/world
      - name: Rebuild derived base-map contracts
        run: |
          python tools/build-region-navigation.py
          python tools/build-terrain.py --geo data/world/regions.geo.json --resources data/world/resources.initial.json --output data/world/terrain.initial.json
          python - <<'PY'
          import importlib.util
          import pathlib
          import sys
          root=pathlib.Path('.').resolve()
          p=root/'tools'/'build-sea-expansion-v2.py'
          spec=importlib.util.spec_from_file_location('sea_rebuild',p)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          mod.PLAN=root/'tools'/'sea-region-plan-old-world-pacific.json'
          sys.argv=[str(p),'--land-geo','data/world/regions.geo.json','--output-dir','/tmp/simworld-crimea-finland-seas']
          mod.main()
          PY
          cp /tmp/simworld-crimea-finland-seas/seaRegions.geo.json data/world/seaRegions.geo.json
          cp /tmp/simworld-crimea-finland-seas/seaRegions.meta.json data/world/seaRegions.meta.json
          node tools/generate-world-spatial-base.mjs
          python tools/finalize-old-world-map-report.py
      - name: Repair and sync Fractured 2027 physical snapshot
        run: |
          python tools/repair-crimea-finland-geography.py --world-dir data/scenarios/fractured-2027/world
          cp data/world/region-navigation.json data/scenarios/fractured-2027/world/region-navigation.json
          cp data/world/terrain.initial.json data/scenarios/fractured-2027/world/terrain.initial.json
          cp data/world/seaRegions.geo.json data/scenarios/fractured-2027/world/seaRegions.geo.json
          cp data/world/seaRegions.meta.json data/scenarios/fractured-2027/world/seaRegions.meta.json
          cp data/world/spatial.base.json data/scenarios/fractured-2027/world/spatial.base.json
      - name: Validate repaired geography
        run: |
          node tests/crimeaFinlandMapAudit.mjs
          python tools/test-old-world-asia-pacific-map.py
          node tools/test-country-picker.mjs
          node tools/test-world-spatial-real-map.mjs
          git diff --check
      - name: Commit regenerated map outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            data/world/regions.geo.json \
            data/world/regions.meta.json \
            data/world/resources.initial.json \
            data/world/region-navigation.json \
            data/world/terrain.initial.json \
            data/world/seaRegions.geo.json \
            data/world/seaRegions.meta.json \
            data/world/spatial.base.json \
            data/world/old-world-pacific-coverage.json \
            data/world/crimea-finland-geography-repair.json \
            data/scenarios/fractured-2027/world/regions.geo.json \
            data/scenarios/fractured-2027/world/regions.meta.json \
            data/scenarios/fractured-2027/world/resources.initial.json \
            data/scenarios/fractured-2027/world/region-navigation.json \
            data/scenarios/fractured-2027/world/terrain.initial.json \
            data/scenarios/fractured-2027/world/seaRegions.geo.json \
            data/scenarios/fractured-2027/world/seaRegions.meta.json \
            data/scenarios/fractured-2027/world/spatial.base.json \
            data/scenarios/fractured-2027/world/crimea-finland-geography-repair.json
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate Crimea and Finland map geography'
            git push origin HEAD:fix/crimea-finland-borders
          fi
