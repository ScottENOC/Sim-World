name: Multi-party war validation

on:
  push:
    branches: [multi-party-war-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply multi-party war integration
        run: python tools/apply-multi-party-war.py
      - name: Syntax checks
        run: |
          python -m py_compile tools/apply-multi-party-war.py
          node --check js/military/warTheatres.js
          node --check js/military/campaigns.js
          node --check js/core/saveGame.js
          node --check js/main.js
      - name: Multi-party war regressions
        run: node tools/test-multi-party-war.mjs
      - name: Existing strategic and military regressions
        run: |
          node tools/test-strategic-military-planning.mjs
          node tools/test-battlefield-terrain.mjs
          node tools/test-military-professionalisation.mjs
          node tools/test-persistent-fleets.mjs
      - name: Headless current-world smoke test
        run: node tools/calibrate.mjs --years 1 --seeds 1 --snapshot-years 1 --days-per-tick 30 --scale 1 --output /tmp/multi-war-smoke.json
      - name: Diff sanity
        run: git diff --check
      - name: Commit integrated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/military/campaigns.js js/core/saveGame.js js/main.js
          if git diff --cached --quiet; then
            echo 'Multi-party war integration already materialised'
          else
            git commit -m 'Integrate multi-party war theatres'
            git pull --rebase
            git push
          fi
