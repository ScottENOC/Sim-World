name: Temporary advisors cache-bust repair

on:
  push:
    branches: [fix/advisors-cache-bust]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/advisors-cache-bust
      - name: Refresh module cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/main.js')
          s = p.read_text()
          old = "./ui/advisors.js?v=20260905-projects1"
          new = "./ui/advisors.js?v=20260922-advisors-syntax2"
          if old not in s and new not in s:
              raise SystemExit('advisors import cache key not found')
          p.write_text(s.replace(old, new))

          p = Path('index.html')
          s = p.read_text()
          old = "js/main.js?v=20260913-religious-politics2-medieval2"
          new = "js/main.js?v=20260922-advisors-cache1"
          if old not in s and new not in s:
              raise SystemExit('main module cache key not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Verify modules
        run: |
          node --check js/ui/advisors.js
          node --check js/main.js
      - name: Commit repair
        run: |
          if git diff --quiet -- js/main.js index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/main.js index.html
          git commit -m 'Bust cached advisors module after syntax repair'
          git push origin HEAD:fix/advisors-cache-bust
