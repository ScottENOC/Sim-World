name: Military assistance and proxy wars

on:
  push:
    branches: [feature/military-assistance-proxy-wars]
    paths:
      - 'js/diplomacy/militaryAssistance.js'
      - 'js/main.js'
      - 'tools/apply-military-assistance-proxy-wars.py'
      - 'tools/test-military-assistance-proxy-wars.mjs'
      - '.github/workflows/military-assistance-proxy-wars.yml'
  pull_request:
    paths:
      - 'js/diplomacy/militaryAssistance.js'
      - 'js/main.js'
      - 'tools/test-military-assistance-proxy-wars.mjs'
      - '.github/workflows/military-assistance-proxy-wars.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'feature/military-assistance-proxy-wars' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply military assistance integration on feature branch
        if: github.event_name == 'push'
        run: python tools/apply-military-assistance-proxy-wars.py
      - name: Syntax checks
        run: |
          node --check js/diplomacy/militaryAssistance.js
          node --check js/main.js
      - name: Military assistance and compatibility regressions
        run: |
          node tools/test-military-assistance-proxy-wars.mjs
          node tools/test-foreign-political-intervention.mjs
          node tools/test-civil-war-factions-v2.mjs
          node tools/test-expeditionary-logistics.mjs
          node tools/test-predigital-equipment-generations.mjs
          node tools/test-nuclear-deterrence.mjs
      - name: Commit integrated source
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main.js
          if ! git diff --cached --quiet; then
            git commit -m "Integrate military assistance and proxy wars"
            git push origin HEAD:feature/military-assistance-proxy-wars
          fi
