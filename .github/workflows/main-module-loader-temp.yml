name: Main module loader diagnostics

on:
  push:
    branches: [fix/main-module-graph-diagnostics]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/main-module-graph-diagnostics
      - run: python tools/patch-main-module-loader-temp.py
      - run: git diff --check
      - name: Commit loader
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Defer main module graph until scenario selection'
          git push origin HEAD:fix/main-module-graph-diagnostics
