name: Apply demographic instrumentation
on:
  push:
    branches: [calibrate-418-trade-raiding]
    paths: ['.github/workflows/apply-demographic-instrumentation.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add cumulative famine and migration counters
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/society/demographics.js')
          s=p.read_text()
          anchor="function clamp01(v) { return Math.max(0, Math.min(1, v)); }\n"
          addition="""

function demographicHistory(region) {
  if (!region.demographicHistory || typeof region.demographicHistory !== 'object') {
    region.demographicHistory = {
      famineDeaths: 0,
      famineEmigrants: 0,
      famineBandits: 0,
      immigrantsReceived: 0,
      famineEvents: 0,
      maximumDeficitRatio: 0,
    };
  }
  return region.demographicHistory;
}
"""
          if addition.strip() not in s:
            if anchor not in s: raise SystemExit('clamp anchor missing')
            s=s.replace(anchor, anchor+addition, 1)
          old="""  const deaths = distressed * FAMINE_DEATH_SHARE;
  const emigrants = distressed * FAMINE_EMIGRATE_SHARE;
  const banditsNew = distressed * FAMINE_BANDIT_SHARE;
  const destinations = emigrants > 0 ? chooseEmigrationDestinations(region, regionsById, emigrants) : [];
  const emigrantsWhoFoundADestination = destinations.reduce((sum, route) => sum + route.count, 0);

  removeFromBands(region, deaths + emigrantsWhoFoundADestination + banditsNew);
  region.banditPopulation += banditsNew;
  for (const { dest, count } of destinations) {
    migrateReligion(region, dest, count, religiousWorld);
    addToBands(dest, count);"""
          new="""  const deaths = distressed * FAMINE_DEATH_SHARE;
  const emigrants = distressed * FAMINE_EMIGRATE_SHARE;
  const banditsNew = distressed * FAMINE_BANDIT_SHARE;
  const destinations = emigrants > 0 ? chooseEmigrationDestinations(region, regionsById, emigrants) : [];
  const emigrantsWhoFoundADestination = destinations.reduce((sum, route) => sum + route.count, 0);

  const history = demographicHistory(region);
  history.famineDeaths += deaths;
  history.famineEmigrants += emigrantsWhoFoundADestination;
  history.famineBandits += banditsNew;
  history.famineEvents += 1;
  history.maximumDeficitRatio = Math.max(history.maximumDeficitRatio, deficitRatio);

  removeFromBands(region, deaths + emigrantsWhoFoundADestination + banditsNew);
  region.banditPopulation += banditsNew;
  for (const { dest, count } of destinations) {
    migrateReligion(region, dest, count, religiousWorld);
    addToBands(dest, count);
    demographicHistory(dest).immigrantsReceived += count;"""
          if old not in s: raise SystemExit('famine block missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('tools/calibrate.mjs')
          s=p.read_text()
          old="""      foodImportDependence: +(r.foodImportDependence || 0).toFixed(4),
      bronzeOutput: +(r.report.smithing?.bronze || 0).toFixed(2),"""
          new="""      foodImportDependence: +(r.foodImportDependence || 0).toFixed(4),
      demographicHistory: {
        famineDeaths: Math.round(r.demographicHistory?.famineDeaths || 0),
        famineEmigrants: Math.round(r.demographicHistory?.famineEmigrants || 0),
        famineBandits: Math.round(r.demographicHistory?.famineBandits || 0),
        immigrantsReceived: Math.round(r.demographicHistory?.immigrantsReceived || 0),
        famineEvents: Math.round(r.demographicHistory?.famineEvents || 0),
        maximumDeficitRatio: +(r.demographicHistory?.maximumDeficitRatio || 0).toFixed(3),
      },
      bronzeOutput: +(r.report.smithing?.bronze || 0).toFixed(2),"""
          if old not in s: raise SystemExit('regional detail anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check js/society/demographics.js
          node --check tools/calibrate.mjs
      - name: Commit instrumentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/society/demographics.js tools/calibrate.mjs
          git commit -m 'Track famine and migration population flows'
          git push
