name: Apply occupation inertia follow-up

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-occupation-inertia-followup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch career accounting
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'js/economy/laborCore.js';
          let s = fs.readFileSync(path, 'utf8');
          function replaceOnce(needle, replacement, label) {
            const first = s.indexOf(needle);
            if (first < 0) throw new Error('Missing patch target: ' + label);
            if (s.indexOf(needle, first + 1) >= 0) throw new Error('Ambiguous patch target: ' + label);
            s = s.slice(0, first) + replacement + s.slice(first + needle.length);
          }
          replaceOnce("  lumberjack:    { enter: 0.035, exit: 0.025, deadband: 0.05 },\n  textileWorker:", "  lumberjack:    { enter: 0.035, exit: 0.025, deadband: 0.05 },\n  miner:         { enter: 0.025, exit: 0.018, deadband: 0.06 },\n  boatmaker:     { enter: 0.015, exit: 0.010, deadband: 0.08 },\n  textileWorker:", 'mobility policies');
          replaceOnce("  accumulateExperience(region, 'mining', minersUsed);\n  report.mining", "  const minerCareerCount = persistentWorkforce(region, 'miner', minersUsed, minerBudget,\n    { impossible: openResources.length === 0 });\n  accumulateExperience(region, 'mining', minersUsed);\n  report.mining", 'miner careers');
          replaceOnce("  const potteryLaborAvailable = Math.max(0, remainingSurplus - minersUsed - actualSmiths);", "  const potteryLaborAvailable = Math.max(0, remainingSurplus - minerCareerCount - desiredSmithsLabor);", 'pottery available labour');
          replaceOnce("  const leftover = Math.round(Math.max(0, surplus - lumberjacks - pitchWorkers - textileWorkers -\n    boatMakers - minersUsed - actualSmiths - potters));", "  const boatMakerCareerCount = persistentWorkforce(region, 'boatmaker', boatMakers,\n    Math.max(boatMakers, remainingSurplus + boatMakers));\n  const leftover = Math.round(Math.max(0, surplus - lumberjacks - pitchWorkers - textileWorkers -\n    boatMakerCareerCount - minerCareerCount - desiredSmithsLabor - potteryLaborReserve));", 'leftover career accounting');
          replaceOnce("    boatmaker: Math.round(boatMakers),\n    pitchMaker", "    boatmaker: Math.round(boatMakerCareerCount),\n    pitchMaker", 'boatmaker occupation');
          replaceOnce("    potter: Math.round(potters),\n    miner: Math.round(minersUsed),\n    smith: Math.round(actualSmiths),", "    potter: Math.round(potteryLaborReserve),\n    miner: Math.round(minerCareerCount),\n    smith: Math.round(desiredSmithsLabor),", 'career occupation reporting');
          fs.writeFileSync(path, s);
          NODE
          node --check js/economy/laborCore.js
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/economy/laborCore.js
          git commit -m 'Keep skilled workers in careers while underemployed'
          git push origin HEAD:main
