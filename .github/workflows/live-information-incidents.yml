name: Live information incidents

on:
  pull_request:
  workflow_dispatch:

jobs:
  live-information-incidents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check js/politics/electionInterference.js
          node --check js/diplomacy/covertIncidentBridge.js
      - name: Live incident regressions
        run: node tests/liveInformationIncidents.test.mjs
      - name: Existing information integrity regressions
        run: node tests/informationIntegrity.test.mjs
