name: Nuclear power foundations

on:
  push:
    branches: [feature/nuclear-power-foundations]
    paths:
      - 'js/economy/nuclearPower.js'
      - 'js/technology/nuclear.js'
      - 'tools/apply-nuclear-power-foundations.py'
      - 'tools/test-nuclear-power.mjs'
      - '.github/workflows/nuclear-power-foundations.yml'
  pull_request:
    paths:
      - 'js/economy/nuclearPower.js'
      - 'js/technology/nuclear.js'
      - 'js/economy/electricity.js'
      - 'js/economy/construction.js'
      - 'js/economy/tradeGoods.js'
      - 'js/technology/breakthroughs.js'
      - 'tools/test-nuclear-power.mjs'
      - '.github/workflows/nuclear-power-foundations.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'feature/nuclear-power-foundations' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integration on feature branch
        if: github.event_name == 'push'
        run: python tools/apply-nuclear-power-foundations.py
      - name: Syntax checks
        run: |
          node --check js/economy/nuclearPower.js
          node --check js/technology/nuclear.js
          node --check js/economy/electricity.js
          node --check js/economy/construction.js
          node --check js/economy/tradeGoods.js
          node --check js/technology/breakthroughs.js
      - name: Nuclear and electricity regressions
        run: |
          node tools/test-nuclear-power.mjs
          node tools/test-electricity.mjs
          node tools/test-industrial-production.mjs
          node tools/test-light-metals.mjs
      - name: Commit integrated source
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/economy/construction.js js/economy/tradeGoods.js js/economy/electricity.js js/technology/breakthroughs.js
          if ! git diff --cached --quiet; then
            git commit -m "Integrate civilian nuclear power foundations"
            git push origin HEAD:feature/nuclear-power-foundations
          fi
