name: Apply language cadence optimisation

on:
  push:
    branches:
      - optimize-language-performance
    paths:
      - tools/apply-language-cadence.py
      - .github/workflows/apply-language-cadence.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply cadence patch
        run: python tools/apply-language-cadence.py
      - name: Validate
        run: |
          node --check js/main.js
          node --check js/diplomacy/languageChange.js
          node --check js/diplomacy/languageCommunication.js
          node --check js/core/performanceProfiler.js
          node tools/test-ui-priority.mjs
          node tools/test-world-spatial-skeleton.mjs
          git diff --check
      - name: Commit generated source
        run: |
          rm tools/apply-language-cadence.py .github/workflows/apply-language-cadence.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Run slow language systems at slower cadences'
          git pull --rebase
          git push
