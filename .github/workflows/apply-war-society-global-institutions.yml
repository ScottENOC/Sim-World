name: Apply war society and global institutions
on:
  push:
    branches: [feature/war-society-global-institutions-v1]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[generated war-society]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/war-society-global-institutions-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply integration
        run: |
          python tools/apply-war-society-global-institutions.py
          python tools/apply-global-policy-effects.py
      - name: Validate focused behaviour
        run: |
          node --check js/society/warSociety.js
          node --check js/diplomacy/internationalOrganisations.js
          node --check js/ui/warSocietyUi.js
          node --check js/ui/internationalOrganisationsUi.js
          node --check js/main.js
          node tools/test-war-society-global-institutions.mjs
          node tools/test-postwar-society.mjs
          node tools/test-mass-politics.mjs
          node tools/test-climate-change.mjs
          git diff --check
      - name: Commit generated source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/main.js js/society/postWarSociety.js js/world/climateChange.js js/society/externalities.js
          git commit -m 'Integrate war society and global institutions [generated war-society]'
          git push origin HEAD:feature/war-society-global-institutions-v1
