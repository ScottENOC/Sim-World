name: Apply financial diplomacy integration
on:
  push:
    branches: [feature/international-reserve-currencies-v1]
    paths:
      - 'tools/apply-financial-diplomacy-v1.py'
      - 'js/economy/sovereignBonds.js'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/international-reserve-currencies-v1
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python tools/apply-financial-diplomacy-v1.py
      - run: |
          node --check js/economy/sovereignBonds.js
          node --check js/economy/internationalMoney.js
          node --check js/economy/monetaryModernisation.js
          node --check js/main.js
          node tools/test-international-reserve-currencies.mjs
          node tools/test-monetary-modernisation.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/economy/sovereignBonds.js js/economy/internationalMoney.js js/economy/monetaryModernisation.js js/main.js
          git commit -m 'Integrate sovereign bonds and financial diplomacy'
          git push origin HEAD:feature/international-reserve-currencies-v1
