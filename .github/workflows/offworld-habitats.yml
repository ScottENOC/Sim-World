name: Off-world habitats

on:
  pull_request:
  push:
    branches:
      - feature/offworld-habitats

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check space integration
        run: |
          node --check js/technology/offworldHabitats.js
          node --check js/technology/spaceRace.js
          node --check js/technology/modernEnergy.js
      - name: Run off-world habitat regression
        run: node tools/test-offworld-habitats.mjs
      - name: Re-run space race regression
        run: node tools/test-space-race.mjs
      - name: Re-run controlled-environment agriculture regression
        run: node tools/test-controlled-environment-agriculture.mjs
