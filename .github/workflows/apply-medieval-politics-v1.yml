name: Apply medieval politics integration
on:
  push:
    branches:
      - medieval-politics-v1
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: medieval-politics-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integration
        run: python tools/apply-medieval-politics-v1.py
      - name: Validate
        run: |
          node --check js/politics/medievalInstitutions.js
          node --check js/society/religiousInstitutions.js
          node --check js/main.js
          node tools/test-medieval-politics.mjs
          node tools/test-ui-priority.mjs
          node tools/test-world-spatial-skeleton.mjs
          git diff --check
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/main.js tools/test-medieval-politics.mjs js/politics/medievalInstitutions.js js/society/religiousInstitutions.js
          git commit -m 'Integrate medieval religious and political institutions' || true
          git rm tools/apply-medieval-politics-v1.py .github/workflows/apply-medieval-politics-v1.yml
          git commit -m 'Remove temporary medieval integration workflow'
          git push origin HEAD:medieval-politics-v1
