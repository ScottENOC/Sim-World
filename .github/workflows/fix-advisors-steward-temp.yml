name: Temporary advisors steward repair

on:
  push:
    branches:
      - fix/advisors-steward-parser

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/advisors-steward-parser
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair Steward rendering
        run: python tools/fix-advisors-steward-temp.py
      - name: Parse repaired modules
        run: |
          node --check js/ui/advisors.js
          node --check js/main.js
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/ui/advisors.js
          git commit -m 'Repair Steward advisor rendering'
          git push origin HEAD:fix/advisors-steward-parser
