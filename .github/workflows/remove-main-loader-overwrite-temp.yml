name: Preserve main startup stage

on:
  push:
    branches: [fix/main-loader-preserve-stage]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/main-loader-preserve-stage
      - run: python tools/remove-main-loader-overwrite-temp.py
      - run: git diff --check
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Preserve main startup progress after module import'
          git push origin HEAD:fix/main-loader-preserve-stage
