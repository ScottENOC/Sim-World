name: Medieval learning validation

on:
  push:
    branches: [medieval-learning-v1]
    paths:
      - '.github/workflows/medieval-learning-v1.yml'
      - 'js/technology/medievalTransition.js'
      - 'tools/apply-medieval-learning.py'
      - 'tools/test-medieval-learning.mjs'
  pull_request:
    paths:
      - 'js/technology/medievalTransition.js'
      - 'js/technology/breakthroughs.js'
      - 'js/military/formations.js'
      - 'js/military/campaigns.js'
      - 'js/military/raiding.js'
      - 'js/economy/horses.js'
      - 'js/economy/trade.js'
      - 'js/main.js'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration on feature branch if needed
        if: github.event_name == 'push'
        run: |
          if grep -q "tickMedievalBreakthroughs" js/technology/breakthroughs.js; then
            echo 'Medieval integration already applied'
          else
            python tools/apply-medieval-learning.py
          fi
      - name: Validate
        run: |
          python -m py_compile tools/apply-medieval-learning.py
          node --check js/technology/medievalTransition.js
          node --check js/technology/breakthroughs.js
          node --check js/military/formations.js
          node --check js/military/campaigns.js
          node --check js/military/raiding.js
          node --check js/economy/horses.js
          node --check js/economy/trade.js
          node --check js/main.js
          node tools/test-medieval-learning.mjs
          node tools/test-ui-priority.mjs
          node tools/test-world-spatial-skeleton.mjs
          git diff --check
      - name: Commit integration
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/technology/breakthroughs.js js/military/formations.js js/military/campaigns.js js/military/raiding.js js/economy/horses.js js/economy/trade.js js/main.js
          if git diff --cached --quiet; then
            echo 'Medieval integration already current'
          else
            git commit -m 'Integrate medieval military and ocean-sailing learning'
            git pull --rebase
            git push
          fi
