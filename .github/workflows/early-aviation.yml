name: Early aviation validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/military/aviation.js'
      - 'js/economy/construction.js'
      - 'js/technology/breakthroughs.js'
      - 'js/diplomacy/couriers.js'
      - 'js/diplomacy/messageRouting.js'
      - 'js/main.js'
      - 'tools/test-early-aviation.mjs'
      - '.github/workflows/early-aviation.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check js/military/aviation.js
          node --check js/economy/construction.js
          node --check js/technology/breakthroughs.js
          node --check js/diplomacy/couriers.js
          node --check js/diplomacy/messageRouting.js
          node --check js/main.js
          node tools/test-early-aviation.mjs
          node tools/test-telegraph-network.mjs
