name: Trade policy promulgation

on:
  pull_request:
    branches: [main]
    paths:
      - js/economy/tradePolicy.js
      - js/economy/trade.js
      - js/ui/advisors.js
      - tools/test-trade-policy-promulgation.mjs
      - tools/test-tariffs-and-labour.mjs
      - .github/workflows/trade-policy-promulgation.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/economy/tradePolicy.js
      - run: node --check js/economy/trade.js
      - run: node --check js/ui/advisors.js
      - run: node tools/test-trade-policy-promulgation.mjs
      - run: node tools/test-tariffs-and-labour.mjs
