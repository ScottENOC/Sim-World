name: Scenario Focused Victory

on:
  pull_request:
    paths:
      - 'js/core/scenarioState.js'
      - 'js/core/scenarioVictory.js'
      - 'js/core/scenarioRuntime.js'
      - 'js/core/scenarioSovereignty.js'
      - 'js/core/scenarioModernStart.js'
      - 'js/ui/scenarioRuntimeAuto.js'
      - 'data/scenarios/**'
      - 'tools/test-scenario-focused-victory.mjs'
      - 'tools/test-scenario-runtime.mjs'
      - 'tools/test-scenario-sovereignty.mjs'
      - 'tools/test-scenario-modern-start.mjs'
      - '.github/workflows/scenario-focused-victory.yml'
  push:
    branches:
      - main
    paths:
      - 'js/core/scenarioState.js'
      - 'js/core/scenarioVictory.js'
      - 'js/core/scenarioRuntime.js'
      - 'js/core/scenarioSovereignty.js'
      - 'js/core/scenarioModernStart.js'
      - 'js/ui/scenarioRuntimeAuto.js'
      - 'data/scenarios/**'
      - 'tools/test-scenario-focused-victory.mjs'
      - 'tools/test-scenario-runtime.mjs'
      - 'tools/test-scenario-sovereignty.mjs'
      - 'tools/test-scenario-modern-start.mjs'
      - '.github/workflows/scenario-focused-victory.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/core/scenarioRuntime.js
      - run: node --check js/core/scenarioSovereignty.js
      - run: node --check js/core/scenarioModernStart.js
      - run: node --check js/ui/scenarioRuntimeAuto.js
      - run: node tools/test-scenario-sovereignty.mjs
      - run: node tools/test-scenario-modern-start.mjs
      - run: node tools/test-scenario-focused-victory.mjs
      - run: node tools/test-scenario-runtime.mjs
