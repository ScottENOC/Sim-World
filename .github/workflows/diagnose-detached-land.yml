name: Diagnose detached land
on:
  push:
    branches: [repair-current-world-land-v1]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check shapely==2.1.1 pyproj==3.7.2
      - run: python tools/diagnose-detached-land.py
