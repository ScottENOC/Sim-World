name: Fix siege duration loop
on:
  push:
    paths:
      - '.github/workflows/fix-siege-duration.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fix and test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/military/siegeEquipment.js'); s=p.read_text()
          start=s.index('export function prepareSiegeWorkforce(regions) {')
          end=s.index('\nfunction chooseMetal(region, type) {', start)
          correct_prepare="""export function prepareSiegeWorkforce(regions) {
  for (const region of regions) {
    const state = ensureSiegeEquipment(region);
    const type = nextWantedType(region);
    if (!type) { state.workersReserved = 0; continue; }
    const available = Math.max(0, (region.demographics?.workingAge || 0) -
      (region.army?.personnel || 0) - (region.navy?.personnel || 0) -
      (region.emergencyMilitiaPersonnel || 0) - (region.construction?.workersReserved || 0));
    const afterMaintenance = Math.max(0, available - (region.construction?.maintenanceWorkersReserved || 0));
    const arsenalSpeed = 1 + Math.min(0.5, effectiveInfrastructureCount(region, 'royal_arsenal') * 0.5);
    state.workersReserved = Math.min(Math.ceil(type.workers / arsenalSpeed), Math.floor(afterMaintenance));
  }
}
"""
          s=s[:start]+correct_prepare+s[end:]
          old="""  for (const region of regions) {
    const state = ensureSiegeEquipment(region);
    const type = nextWantedType(region);
    state.lastWeek = null;"""
          new="""  for (const region of regions) {
    const state = ensureSiegeEquipment(region);
    state.lastWeek = null;
    let buildsRemaining = maxBuilds;
    while (buildsRemaining-- > 0) {
    const type = nextWantedType(region);"""
          if old not in s: raise SystemExit('tick siege anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node -e "import('./js/military/siegeEquipment.js')"
          node -e "import('./tools/calibrate.mjs').catch(e=>{ if (!String(e).includes('Invalid state')) throw e; })" || true
          find js tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/military/siegeEquipment.js
          git commit -m "Fix duration-scaled siege production loop"
          git push
