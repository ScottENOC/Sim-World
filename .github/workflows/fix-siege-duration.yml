name: Fix siege duration loop
on:
  push:
    paths:
      - '.github/workflows/fix-siege-duration.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fix and test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/military/siegeEquipment.js'); s=p.read_text()
          old="""  for (const region of regions) {\n    const state = ensureSiegeEquipment(region);\n    const type = nextWantedType(region);\n    state.lastWeek = null;"""
          new="""  for (const region of regions) {\n    const state = ensureSiegeEquipment(region);\n    state.lastWeek = null;\n    let buildsRemaining = maxBuilds;\n    while (buildsRemaining-- > 0) {\n    const type = nextWantedType(region);"""
          if old not in s: raise SystemExit('siege loop anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check js/military/siegeEquipment.js
          node -e "import('./js/military/siegeEquipment.js')"
          find js tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/military/siegeEquipment.js
          git commit -m "Fix duration-scaled siege production loop"
          git push
