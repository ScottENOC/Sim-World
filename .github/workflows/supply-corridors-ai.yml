name: Supply corridor AI validation

on:
  push:
    branches: [supply-corridors-ai-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integration
        run: python tools/apply-supply-corridors-ai.py
      - name: Syntax checks
        run: |
          python -m py_compile tools/apply-supply-corridors-ai.py
          node --check js/military/supplyCorridors.js
          node --check js/military/supplyAwareAi.js
          node --check js/military/expeditionaryLogistics.js
          node --check js/military/campaigns.js
          node --check js/ai/nationAi.js
      - name: Supply AI regressions
        run: node tools/test-supply-corridors-ai.mjs
      - name: Existing military regressions
        run: |
          node tools/test-expeditionary-logistics.mjs
          node tools/test-subregional-movement.mjs
          node tools/test-subregional-control.mjs
          node tools/test-multi-party-war.mjs
          node tools/test-strategic-military-planning.mjs
          node tools/test-battlefield-terrain.mjs
          node tools/test-military-professionalisation.mjs
          node tools/test-persistent-fleets.mjs
      - name: Headless world smoke test
        run: node tools/calibrate.mjs --years 1 --seeds 1 --snapshot-years 1 --days-per-tick 30 --scale 1 --output /tmp/supply-corridors-ai-smoke.json
      - name: Diff sanity
        run: git diff --check
      - name: Commit integrated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/military/expeditionaryLogistics.js js/military/campaigns.js js/ai/nationAi.js
          if git diff --cached --quiet; then
            echo 'Supply corridor integration already materialised'
          else
            git commit -m 'Integrate supply corridors and supply-aware AI'
            git pull --rebase
            git push
          fi
