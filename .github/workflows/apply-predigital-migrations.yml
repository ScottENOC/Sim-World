name: Apply pre-digital generated migrations
on:
  push:
    branches: [feature/industrial-firm-investment-v1]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[generated migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/industrial-firm-investment-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply migrations
        run: |
          python tools/apply-deliberate-naval-marks.py
          python tools/apply-predigital-navy-v2.py
      - name: Syntax and focused tests
        run: |
          node --check js/military/fleets.js
          node --check js/military/aviation.js
          node --check js/economy/industrialPlant.js
          node tools/test-aircraft-industry.mjs
          node tools/test-predigital-equipment-generations.mjs
      - name: Commit generated source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/military/fleets.js
          git commit -m 'Apply deliberate pre-digital naval design migration [generated migration]'
          git push origin HEAD:feature/industrial-firm-investment-v1
