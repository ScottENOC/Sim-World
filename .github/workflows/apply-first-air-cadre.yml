name: Apply first military aviation cadre
on:
  push:
    branches: [feature/qualified-air-naval-personnel-v1]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[generated cadre]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qualified-air-naval-personnel-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply cadre fix
        run: python tools/apply-first-air-cadre.py
      - name: Test aviation personnel compatibility
        run: |
          node --check js/military/aviation.js
          node tools/test-early-aviation.mjs
          node tools/test-qualified-military-personnel.mjs
          git diff --check
      - name: Commit generated source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/military/aviation.js
          git commit -m 'Seed first military aviation crew cadre [generated cadre]'
          git push origin HEAD:feature/qualified-air-naval-personnel-v1
