name: Apply cooperative UI scheduling patch

on:
  push:
    branches: [performance-ui-priority-v1]
    paths:
      - '.github/workflows/performance-ui-priority-patch-main.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main simulation scheduling
        run: |
          python3 tools/apply-ui-priority-patch.py
          node --check js/main.js
          node --check js/core/clock.js
          node tools/test-ui-priority.mjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prioritise UI during long simulation turns'
          git push
