name: Carrier air combat

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check carrier air combat
        run: |
          node --check js/military/carrierAirGroupCombat.js
          node --check js/military/lateIndustrialNavy.js
      - name: Run carrier air combat regressions
        run: node tools/test-carrier-air-combat.mjs
