name: Trigger ore and clothing patch
on:
  push:
    paths:
      - '.github/workflows/trigger-ore-clothing-patch.yml'
permissions:
  actions: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch patch workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ore-clothing-patch.yml --repo ${{ github.repository }} --ref main
