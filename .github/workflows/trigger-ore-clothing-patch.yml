name: Trigger ore and clothing patch
on:
  push:
    paths:
      - '.github/workflows/trigger-ore-clothing-patch.yml'
permissions:
  contents: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: |
          python3 tools/apply-ore-clothing-patch.py
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/economy/laborCore.js
          git commit -m "Add copper and tin ore smelting and clothing"
          git push
