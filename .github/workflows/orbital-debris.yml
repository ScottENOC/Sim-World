name: Orbital debris

on:
  pull_request:
    paths:
      - 'js/technology/orbitalDebris.js'
      - 'js/military/spaceWarfare.js'
      - 'tools/test-orbital-debris.mjs'
      - '.github/workflows/orbital-debris.yml'
  push:
    branches: [ main ]
    paths:
      - 'js/technology/orbitalDebris.js'
      - 'js/military/spaceWarfare.js'
      - 'tools/test-orbital-debris.mjs'
      - '.github/workflows/orbital-debris.yml'

jobs:
  orbital-debris:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check js/technology/orbitalDebris.js
          node --check js/military/spaceWarfare.js
      - name: Orbital debris regressions
        run: node tools/test-orbital-debris.mjs
