name: Nuclear diplomacy

on:
  push:
    branches: [feature/nuclear-diplomacy]
    paths:
      - 'js/diplomacy/nuclearDiplomacy.js'
      - 'js/diplomacy/nuclearArmsControl.js'
      - 'js/diplomacy/nuclearAlliedDeployments.js'
      - 'js/diplomacy/nuclearDeterrence.js'
      - 'tools/apply-nuclear-diplomacy.py'
      - 'tools/test-nuclear-diplomacy.mjs'
      - '.github/workflows/nuclear-diplomacy.yml'
  pull_request:
    paths:
      - 'js/diplomacy/nuclearDiplomacy.js'
      - 'js/diplomacy/nuclearArmsControl.js'
      - 'js/diplomacy/nuclearAlliedDeployments.js'
      - 'js/diplomacy/nuclearDeterrence.js'
      - 'tools/test-nuclear-diplomacy.mjs'
      - '.github/workflows/nuclear-diplomacy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'feature/nuclear-diplomacy' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply diplomacy integration on feature branch
        if: github.event_name == 'push'
        run: python tools/apply-nuclear-diplomacy.py
      - name: Syntax checks
        run: |
          node --check js/diplomacy/nuclearDiplomacy.js
          node --check js/diplomacy/nuclearArmsControl.js
          node --check js/diplomacy/nuclearAlliedDeployments.js
          node --check js/diplomacy/nuclearDeterrence.js
      - name: Nuclear diplomacy and compatibility regressions
        run: |
          node tools/test-nuclear-diplomacy.mjs
          node tools/test-nuclear-allied-deployments.mjs
          node tools/test-nuclear-arms-control.mjs
          node tools/test-nuclear-deterrence.mjs
          node tools/test-strategic-delivery-second-strike.mjs
          node tools/test-nuclear-weaponisation.mjs
      - name: Commit integrated source
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/diplomacy/nuclearArmsControl.js js/diplomacy/nuclearAlliedDeployments.js js/diplomacy/nuclearDeterrence.js
          if ! git diff --cached --quiet; then
            git commit -m "Integrate nuclear diplomacy"
            git push origin HEAD:feature/nuclear-diplomacy
          fi
