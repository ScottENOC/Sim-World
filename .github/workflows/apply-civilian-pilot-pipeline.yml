name: Apply civilian pilot pipeline
on:
  push:
    branches: [feature/qualified-air-naval-personnel-v1]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[generated civilian pilots]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qualified-air-naval-personnel-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply civilian pilot pipeline
        run: python tools/apply-civilian-pilot-pipeline.py
      - name: Validate personnel and aviation
        run: |
          node --check js/military/qualifiedPersonnel.js
          node --check js/military/aviation.js
          node tools/test-qualified-military-personnel.mjs
          node tools/test-early-aviation.mjs
          node tools/test-aircraft-industry.mjs
          git diff --check
      - name: Commit generated source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/military/qualifiedPersonnel.js
          git commit -m 'Use civilian aviation for basic pilot training [generated civilian pilots]'
          git push origin HEAD:feature/qualified-air-naval-personnel-v1
