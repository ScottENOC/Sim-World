name: Event renderer fallthrough validation

on:
  push:
    branches:
      - fix-event-renderer-fallthrough
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply event renderer repair
        run: python tools/fix-event-renderer-fallthrough.py

      - name: Syntax checks
        run: |
          python -m py_compile tools/fix-event-renderer-fallthrough.py
          node --check js/main.js
          node --check tools/test-event-renderer-fallthrough.mjs

      - name: Event renderer regression
        run: node tools/test-event-renderer-fallthrough.mjs

      - name: Existing UI and religious politics regressions
        run: |
          node tools/test-ui-priority.mjs
          node tools/test-medieval-religious-politics.mjs
          node tools/test-war-theatres.mjs
          node tools/test-persistent-fleets.mjs

      - name: Diff sanity
        run: git diff --check

      - name: Commit repaired runtime
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/main.js
          if ! git diff --cached --quiet; then
            git commit -m 'Fix event renderer fallthrough crash'
            git push
          fi
