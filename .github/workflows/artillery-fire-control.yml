name: Artillery fire-control learning
on:
  push:
    branches: [feature/artillery-fire-control-learning-v1]
  pull_request:
    branches: [main]
    paths:
      - 'js/military/artilleryFireControl.js'
      - 'js/military/modernTactics.js'
      - 'js/military/campaigns.js'
      - 'js/main.js'
      - 'tools/test-artillery-fire-control.mjs'
      - '.github/workflows/artillery-fire-control.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply integration on feature branch
        if: github.event_name == 'push'
        run: python tools/apply-artillery-fire-control-integration.py
      - name: Syntax checks
        run: |
          node --check js/military/artilleryFireControl.js
          node --check js/military/modernTactics.js
          node --check js/military/campaigns.js
          node --check js/main.js
      - name: Artillery and observational learning regression
        run: node tools/test-artillery-fire-control.mjs
      - name: Existing machine gun regression
        run: node tools/test-machine-gun-tactical-revolution.mjs
      - name: Existing modern land warfare regression
        run: node tools/test-modern-land-warfare.mjs
      - name: Commit integration on feature branch
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/military/modernTactics.js js/military/campaigns.js js/main.js
          if git diff --cached --quiet; then echo 'Integration already current'; else git commit -m 'Integrate artillery fire control into campaigns'; git pull --rebase; git push; fi
