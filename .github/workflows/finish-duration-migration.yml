name: Finish duration migration
on:
  push:
    paths:
      - '.github/workflows/finish-duration-migration.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/core/simTime.js')
          s=p.read_text()
          old="export function elapsedWeeks(elapsedDays) {\n  return Math.max(0, Number(elapsedDays) || 0) / DAYS_PER_WEEK;\n}"
          new="export function elapsedWeeks(days) {\n  return days / DAYS_PER_WEEK;\n}"
          if old not in s: raise SystemExit('simTime compatibility anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          python3 tools/finish-duration-migration.py
          find js tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js tools/calibrate.mjs
          git commit -m "Finish elapsed-time scaling for monthly ticks"
          git push
