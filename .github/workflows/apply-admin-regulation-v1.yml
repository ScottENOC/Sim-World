name: Apply admin-gated regulation v1
on:
  push:
    branches: [feature/admin-gated-economic-regulation-v1]
    paths:
      - 'tools/apply-admin-regulation-v1.py'
      - '.github/workflows/apply-admin-regulation-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: feature/admin-gated-economic-regulation-v1 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: python3 tools/apply-admin-regulation-v1.py
      - run: |
          node --check js/economy/economicRegulation.js
          node --check js/economy/enterpriseBehaviour.js
          node --check js/economy/corporateCapital.js
          node --check js/economy/corporateInfrastructure.js
          node --check js/economy/governmentEconomicPolicy.js
          node --check js/ui/economicRegulationUi.js
          node tools/test-economic-regulation.mjs
          node tools/test-enterprise-finance-externalities.mjs
          node tools/test-public-private-economy-integration.mjs
          git diff --check
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/economy/governmentEconomicPolicy.js js/economy/corporateCapital.js js/economy/corporateInfrastructure.js index.html
          git commit -m "Wire administration-gated economic regulation"
          git push origin HEAD:feature/admin-gated-economic-regulation-v1
