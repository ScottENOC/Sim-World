name: Precision strike

on:
  pull_request:
    paths:
      - 'js/military/precisionStrike.js'
      - 'js/military/lateIndustrialNavy.js'
      - 'js/technology/modernEnergy.js'
      - 'tools/test-precision-strike.mjs'
      - '.github/workflows/precision-strike.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check precision strike modules
        run: |
          node --check js/military/precisionStrike.js
          node --check js/military/lateIndustrialNavy.js
          node --check js/technology/modernEnergy.js
      - name: Run precision strike regressions
        run: node tools/test-precision-strike.mjs
