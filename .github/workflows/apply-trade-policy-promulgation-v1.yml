name: Apply trade policy promulgation v1

on:
  pull_request:
    branches: [main]
    paths:
      - tools/apply-trade-policy-promulgation-v1.py
      - .github/workflows/apply-trade-policy-promulgation-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply-trade-policy-promulgation-v1.py
      - name: Use civilian commodity in timing regression
        run: sed -i "s/'steel'/'food'/g" tools/test-trade-policy-promulgation.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/economy/tradePolicy.js
      - run: node --check js/economy/trade.js
      - run: node --check js/ui/advisors.js
      - run: node tools/test-trade-policy-promulgation.mjs
      - name: Exclude workflow files from bot push
        run: |
          rm .github/workflows/trade-policy-promulgation.yml
          git checkout -- .github/workflows/apply-trade-policy-promulgation-v1.yml
      - name: Commit applied implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/economy/tradePolicy.js js/economy/trade.js js/ui/advisors.js tools/test-trade-policy-promulgation.mjs
          git commit -m "Implement communicated trade policy enforcement"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
