name: Refresh culture module cache keys

on:
  push:
    branches: [fix-migration-fanout-diplomacy-cadence]
    paths:
      - 'tools/bump-culture-cache-keys.py'
      - '.github/workflows/bump-culture-cache-keys.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply cache key refresh
        run: python tools/bump-culture-cache-keys.py
      - name: Validate
        run: |
          node --check js/main.js
          node --check js/diplomacy/relations.js
          node --check js/society/demographics.js
          git diff --check
          grep -q 'culture-scale1' js/diplomacy/relations.js
          grep -q 'culture-scale1' js/society/demographics.js
      - name: Commit and clean helper
        run: |
          rm tools/bump-culture-cache-keys.py .github/workflows/bump-culture-cache-keys.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Refresh culture module cache keys'
          git pull --rebase
          git push
