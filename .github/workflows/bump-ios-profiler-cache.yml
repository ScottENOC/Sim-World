name: Refresh iOS profiler cache key

on:
  push:
    branches: [ios-profiler-cache-bust]
    paths: ['.github/workflows/bump-ios-profiler-cache.yml']

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump main module cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='js/main.js?v=20260910-spatial1'
          new='js/main.js?v=20260911-ios-profiler1'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit cache bust and remove temporary workflow
        run: |
          rm .github/workflows/bump-ios-profiler-cache.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Refresh iOS profiler cache key'
          git pull --rebase
          git push
