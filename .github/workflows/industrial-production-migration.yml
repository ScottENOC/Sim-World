name: Industrial production migration
on:
  push:
    branches: [feature/automobile-assembly-line-v1]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python tools/apply-industrial-production-integration.py
      - run: |
          node --check js/technology/industrialProduction.js
          node --check js/technology/breakthroughs.js
          node --check js/economy/industrialSupply.js
      - run: node tools/test-industrial-production.mjs
      - run: node tools/test-industrial-railways.mjs
      - run: node tools/test-oil-resource.mjs
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/technology/breakthroughs.js js/economy/industrialSupply.js
          if git diff --cached --quiet; then echo current; else git commit -m 'Integrate automobile and advanced factory production'; git pull --rebase; git push; fi
