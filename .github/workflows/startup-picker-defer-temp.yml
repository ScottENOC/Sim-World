name: Temporary startup picker defer validation

on:
  push:
    branches:
      - fix/startup-picker-defer-world-load

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/startup-picker-defer-world-load
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Defer world startup until start region is chosen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/ui/startupPicker.js')
          s = p.read_text()
          old_mark = """  const markPendingStart = (scenario, region, continent, country, countryFirst = false) => {\n    window.__pendingStartRegionId = region.id;"""
          new_mark = """  const markPendingStart = (scenario, region, continent, country, countryFirst = false) => {\n    // Keep the lightweight picker responsive. Only release the full world loader once\n    // the player has actually chosen a starting region/country.\n    selectScenario(scenario.id);\n    window.__pendingStartRegionId = region.id;"""
          old_choose = """  const chooseScenario = (scenario) => {\n    try {\n      selectScenario(scenario.id);\n      if (scenario.rulesProfile === 'modern-crisis') renderFocusedCountryPicker(scenario);\n      else renderRegionPicker(scenario);"""
          new_choose = """  const chooseScenario = (scenario) => {\n    try {\n      // Do not lock/release the scenario yet: main.js holds heavy map fetches until\n      // the player chooses a start. The picker can read its small metadata directly.\n      if (scenario.rulesProfile === 'modern-crisis') renderFocusedCountryPicker(scenario);\n      else renderRegionPicker(scenario);"""
          if old_mark not in s: raise SystemExit('markPendingStart anchor not found')
          if old_choose not in s: raise SystemExit('chooseScenario anchor not found')
          s = s.replace(old_mark, new_mark, 1).replace(old_choose, new_choose, 1)
          p.write_text(s)
          PY
      - name: Validate startup picker
        run: |
          node --check js/ui/startupPicker.js
          node --check js/core/scenarios.js
          python - <<'PY'
          from pathlib import Path
          s = Path('js/ui/startupPicker.js').read_text()
          choose = s[s.index('const chooseScenario'):s.index('pickerTitle.textContent', s.index('const chooseScenario'))]
          mark = s[s.index('const markPendingStart'):s.index('const renderFocusedCountryPicker')]
          assert 'selectScenario(scenario.id)' not in choose, 'scenario still releases during scenario-button click'
          assert 'selectScenario(scenario.id)' in mark, 'scenario is not locked when start is chosen'
          print('startup picker sequencing assertions passed')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/ui/startupPicker.js
          git commit -m 'Defer world loading until start region selection'
          git push origin HEAD:fix/startup-picker-defer-world-load
