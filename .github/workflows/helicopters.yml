name: Helicopter aviation

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check js/military/helicopters.js
      - run: node --check js/military/aviation.js
      - run: node --check js/military/airMobility.js
      - run: node --check js/military/specialOperations.js
      - run: node --check js/military/navalRotaryWing.js
      - run: node --check js/military/subregionalMovement.js
      - run: node tools/test-helicopters.mjs
      - run: node tools/test-rotary-special-ops.mjs
