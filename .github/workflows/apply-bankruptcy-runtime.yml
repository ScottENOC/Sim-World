name: Apply bankruptcy runtime patch
on:
  push:
    branches: [feature/bankruptcy-resolution-dilemmas-v1]
    paths:
      - 'tools/apply-bankruptcy-runtime.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bankruptcy-resolution-dilemmas-v1
      - run: python tools/apply-bankruptcy-runtime.py
      - run: node --check js/main.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main.js
          git commit -m "Wire bankruptcy dilemmas into live simulation"
          git push origin HEAD:feature/bankruptcy-resolution-dilemmas-v1
