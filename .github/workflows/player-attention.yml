name: Player attention and auto-pause

on:
  pull_request:
    paths:
      - 'js/core/clock.js'
      - 'js/core/saveGame.js'
      - 'js/history/nationalChronicle.js'
      - 'js/history/historicalEventChronicle.js'
      - 'js/ui/playerAttentionUi.js'
      - 'js/ui/technologyAttentionUi.js'
      - 'js/ui/nationalChronicleUi.js'
      - 'js/ui/diseasePolicyUi.js'
      - 'css/player-attention.css'
      - 'tools/test-player-attention.mjs'
      - 'tools/test-technology-attention.mjs'
      - 'tools/test-national-chronicle.mjs'
      - 'tools/test-historical-chronicle.mjs'
      - '.github/workflows/player-attention.yml'
  workflow_dispatch:

jobs:
  player-attention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check js/core/clock.js
          node --check js/history/nationalChronicle.js
          node --check js/history/historicalEventChronicle.js
          node --check js/ui/playerAttentionUi.js
          node --check js/ui/technologyAttentionUi.js
          node --check js/ui/nationalChronicleUi.js
          node --check js/ui/diseasePolicyUi.js
          node --check tools/test-player-attention.mjs
          node --check tools/test-technology-attention.mjs
          node --check tools/test-national-chronicle.mjs
          node --check tools/test-historical-chronicle.mjs
      - name: Player attention regressions
        run: |
          node tools/test-player-attention.mjs
          node tools/test-technology-attention.mjs
          node tools/test-national-chronicle.mjs
          node tools/test-historical-chronicle.mjs
