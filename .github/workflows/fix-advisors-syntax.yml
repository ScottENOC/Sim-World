name: Advisors syntax hotfix

on:
  push:
    branches: [fix-advisors-syntax]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hotfix
        run: python tools/fix-advisors-syntax.py
      - name: Syntax checks
        run: |
          python -m py_compile tools/fix-advisors-syntax.py tools/apply-diplomats-ui.py
          node --check js/ui/advisors.js
          node --check js/main.js
      - name: Relevant regressions
        run: |
          node tools/test-diplomats-counterintelligence.mjs
          node tools/test-player-joint-operation-advisor.mjs
          node tools/test-joint-operations-command.mjs
      - name: Headless smoke test
        run: node tools/calibrate.mjs --years 1 --seeds 1 --snapshot-years 1 --days-per-tick 30 --scale 1 --output /tmp/advisors-hotfix-smoke.json
      - name: Diff sanity
        run: git diff --check
      - name: Commit fixed source
        run: |
          git restore tools/__pycache__ 2>/dev/null || true
          rm -f tools/__pycache__/fix-advisors-syntax*.pyc tools/__pycache__/apply-diplomats-ui*.pyc
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/ui/advisors.js tools/apply-diplomats-ui.py
          if git diff --cached --quiet; then
            echo 'Advisor source and generator syntax already fixed'
          else
            git commit -m 'Fix advisor deception button syntax'
            git pull --rebase
            git push
          fi
