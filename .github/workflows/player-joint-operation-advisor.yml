name: Player joint-operation advisor validation

on:
  push:
    branches: [player-joint-operation-advisor-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integration
        run: python tools/apply-player-joint-operation-advisor.py
      - name: Syntax checks
        run: |
          python -m py_compile tools/apply-player-joint-operation-advisor.py
          node --check js/military/playerJointOperationAdvisor.js
          node --check js/diplomacy/couriers.js
          node --check js/ui/advisors.js
          node --check js/main.js
      - name: Player joint-operation regressions
        run: node tools/test-player-joint-operation-advisor.mjs
      - name: Existing joint-operation and military regressions
        run: |
          node tools/test-joint-operations-command.mjs
          node tools/test-allied-battle-coordination.mjs
          node tools/test-subregional-army-battles.mjs
          node tools/test-counter-logistics-relief.mjs
          node tools/test-supply-corridors-ai.mjs
          node tools/test-expeditionary-logistics.mjs
          node tools/test-subregional-movement.mjs
          node tools/test-subregional-control.mjs
          node tools/test-multi-party-war.mjs
          node tools/test-strategic-military-planning.mjs
      - name: Headless world smoke test
        run: node tools/calibrate.mjs --years 1 --seeds 1 --snapshot-years 1 --days-per-tick 30 --scale 1 --output /tmp/player-joint-operation-smoke.json
      - name: Diff sanity
        run: git diff --check
      - name: Commit integrated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/diplomacy/couriers.js js/main.js js/ui/advisors.js
          if git diff --cached --quiet; then
            echo 'Player joint-operation integration already materialised'
          else
            git commit -m 'Integrate player joint-operation advisor workflow'
            git pull --rebase
            git push
          fi
