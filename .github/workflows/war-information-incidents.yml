name: War information incidents

on:
  pull_request:
  workflow_dispatch:

jobs:
  war-information-incidents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check js/society/warSociety.js
      - name: Civilian war reporting regressions
        run: node tests/warInformationIncidents.test.mjs
      - name: Existing information integrity regressions
        run: node tests/informationIntegrity.test.mjs
