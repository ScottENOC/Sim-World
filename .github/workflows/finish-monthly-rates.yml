name: Finish monthly rate migration
on:
  push:
    paths:
      - '.github/workflows/finish-monthly-rates.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply and test
        run: |
          python3 tools/finish-monthly-rates.py
          find js tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node -e "Promise.all([import('./js/ai/nationAi.js'),import('./js/military/banditry.js'),import('./js/society/religion.js'),import('./js/economy/trade.js')])"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js tools/calibrate.mjs
          git commit -m "Scale remaining weekly rates across monthly ticks"
          git push
