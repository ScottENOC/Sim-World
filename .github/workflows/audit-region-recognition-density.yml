name: Audit region recognition and density
on:
  push:
    branches: [expand-germany-low-countries-fix-pinch]
    paths: ['.github/workflows/audit-region-recognition-density.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check shapely==2.1.1
      - name: Audit disputed-territory assignments
        run: |
          python - <<'PY'
          import json
          from shapely.geometry import shape, Point
          geo=json.load(open('data/world/regions.geo.json'))['features']
          tests={
            'Pristina/Kosovo':(21.166,42.663),
            'Sukhumi/Abkhazia':(41.006,43.001),
            'Tskhinvali/South Ossetia':(43.969,42.227),
            'Tiraspol/Transnistria':(29.643,46.840),
            'Nicosia north':(33.365,35.185),
            'Ramallah/West Bank':(35.204,31.903),
            'Gaza City':(34.466,31.501),
          }
          for label,(lon,lat) in tests.items():
              p=Point(lon,lat)
              hits=[]
              for f in geo:
                  if shape(f['geometry']).covers(p):
                      q=f.get('properties',{})
                      hits.append((q.get('sourceGroup'),q.get('name')))
              print(label, hits)
          PY
