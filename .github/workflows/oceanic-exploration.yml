name: Oceanic exploration validation

on:
  push:
    branches:
      - oceanic-exploration-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply runtime integration
        run: python tools/apply-oceanic-exploration.py

      - name: Syntax checks
        run: |
          python -m py_compile tools/apply-oceanic-exploration.py
          node --check js/economy/oceanicExploration.js
          node --check js/main.js
          node --check tools/test-oceanic-exploration.mjs
          node --check tools/benchmark-oceanic-exploration.mjs

      - name: Oceanic exploration regression
        run: node tools/test-oceanic-exploration.mjs

      - name: 2300-region performance guardrail
        run: node tools/benchmark-oceanic-exploration.mjs

      - name: Existing maritime, finance, information and map regressions
        run: |
          node tools/test-oceanic-provisioning-scurvy.mjs
          node tools/test-fleets.mjs
          node tools/test-finance-corporate-capital-v2.mjs
          node tools/test-renaissance-networks.mjs
          node tools/test-early-modern-reform.mjs
          node tools/test-world-spatial-real-map.mjs
          node tools/test-ui-priority.mjs

      - name: Diff sanity
        run: git diff --check

      - name: Commit runtime integration
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/main.js
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate oceanic exploration runtime'
            git push
          fi
