name: Fisheries and aquaculture

on:
  pull_request:
    paths:
      - 'js/economy/fisheriesAquaculture.js'
      - 'js/economy/foodDiversity.js'
      - 'js/economy/electricity.js'
      - 'js/world/waterResources.js'
      - 'tools/test-fisheries-aquaculture.mjs'
      - '.github/workflows/fisheries-aquaculture.yml'
  push:
    branches: [ main ]
    paths:
      - 'js/economy/fisheriesAquaculture.js'
      - 'js/economy/foodDiversity.js'
      - 'js/economy/electricity.js'
      - 'js/world/waterResources.js'
      - 'tools/test-fisheries-aquaculture.mjs'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check fisheries integration
        run: |
          node --check js/economy/fisheriesAquaculture.js
          node --check js/economy/foodDiversity.js
          node --check js/economy/electricity.js
          node --check js/world/waterResources.js
          node --check tools/test-fisheries-aquaculture.mjs
      - name: Run fisheries and aquaculture regression
        run: node tools/test-fisheries-aquaculture.mjs
      - name: Re-run food diversity regression
        run: node tools/test-food-diversity.mjs
      - name: Re-run electricity regression
        run: node tools/test-electricity.mjs
      - name: Re-run modern water quantity regression
        run: node tools/test-modern-water-quantity.mjs
