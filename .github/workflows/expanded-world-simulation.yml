name: Current world simulation
on:
  workflow_dispatch:

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Current checked-in world benchmark
        shell: bash
        run: |
          start=$(date +%s%N)
          node tools/calibrate.mjs --years 2 --seeds 1 --snapshot-years 1 --days-per-tick 7 --system-timing true --output real-world-performance.json
          end=$(date +%s%N)
          elapsed_ms=$(( (end - start) / 1000000 ))
          echo "REAL_WORLD_TOTAL_MS=$elapsed_ms"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('real-world-performance.json','utf8'));
          const c=r.configuration ?? {};
          const ticks=Math.max(1, Math.round((c.years ?? 2) * 365 / (c.daysPerTick ?? 7)));
          console.log('REAL_WORLD_REGIONS='+(c.actualRegions ?? 'unknown'));
          console.log('REAL_WORLD_MS_PER_TICK='+(Number.isFinite(r.elapsedSeconds) ? (r.elapsedSeconds*1000/ticks).toFixed(2) : 'unknown'));
          console.log('SYSTEM='+JSON.stringify(r.runs?.[0]?.systemTimingMsPerTick ?? {}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: current-world-performance
          path: real-world-performance.json
          retention-days: 14

  history:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: A
            seed: 305419896
          - label: B
            seed: 2959855665
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 160-year history seed ${{ matrix.label }} on checked-in world
        run: |
          node tools/calibrate.mjs --years 160 --seeds 1 --base-seed ${{ matrix.seed }} --snapshot-years 20 --days-per-tick 30 --regional-detail true --output history-${{ matrix.label }}.json
      - name: Print historical summary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = fs.readdirSync('.').find(f => f.startsWith('history-') && f.endsWith('.json'));
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log('ELAPSED_SECONDS='+report.elapsedSeconds);
          console.log('REGIONS='+(report.configuration?.actualRegions ?? 'unknown'));
          for (const s of report.runs[0].timeline) {
            console.log('SNAPSHOT '+JSON.stringify({elapsedYears:s.year, calendarYearBCE:Math.round(1300-s.year), populationPct:s.populationPct,
              trade:s.smoothedWeeklyTrade, foodImports:s.smoothedWeeklyFoodImports, tinPct:s.surfaceTinPct, copperPct:s.surfaceCopperPct,
              distressed:s.distressedRegions, bandits:s.bandits, bronzeOutput:s.weeklyBronzeOutput, ironRegions:s.ironRegions,
              kingdoms:s.politics.kingdoms, subjects:s.politics.subjectRegions, writing:s.politics.writingPolities}));
          }
          const final=report.runs[0].timeline.at(-1);
          const names=['Central Cyprus','Cappadocia','Northern Zagros','Sumer','Assyria','Babylon','Western Nile Delta','Upper Egypt','Crete','Attica','Peloponnese','Ugarit Coast','Cilicia','Thrace'];
          for (const name of names) {
            const r=final.regional.find(x=>x.name===name);
            if(r) console.log('REGION '+JSON.stringify(r));
          }
          console.log('SPECIALITIES '+JSON.stringify(final.specialities));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: current-world-history-${{ matrix.label }}
          path: history-${{ matrix.label }}.json
          retention-days: 7
