name: Circular economy

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  circular-economy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check js/economy/circularEconomy.js
          node --check js/economy/electricity.js
          node --check js/economy/tools.js
          node --check js/economy/labor.js
      - name: Circular economy regressions
        run: |
          node tests/circularEconomy.test.mjs
          node tests/closedLoopMaterialsIntegration.test.mjs
