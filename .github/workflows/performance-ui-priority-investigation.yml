name: Performance UI priority investigation

on:
  push:
    branches: [performance-ui-priority-v1]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check js/military/strategicPlanning.js
          node --check js/core/clock.js
          node --check tools/test-ui-priority.mjs
      - name: UI priority regression
        run: node tools/test-ui-priority.mjs
      - name: Current-world performance
        run: node tools/calibrate.mjs --years 1 --seeds 1 --snapshot-years 1 --days-per-tick 30 --scale 1 --system-timing true --output /tmp/current.json
      - name: Full-world proxy performance
        run: node tools/calibrate.mjs --years 1 --seeds 1 --snapshot-years 1 --days-per-tick 30 --target-regions 2830 --system-timing true --output /tmp/full.json
      - name: Report timings
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const [label,path] of [['CURRENT','/tmp/current.json'],['FULL','/tmp/full.json']]) {
            const r=JSON.parse(fs.readFileSync(path,'utf8'));
            console.log(`${label}_REGIONS=${r.configuration.actualRegions}`);
            console.log(`${label}_RUNNER_SECONDS=${r.elapsedSeconds}`);
            console.log(`${label}_SYSTEM_TIMING_MS_PER_TICK=${JSON.stringify(r.runs[0].systemTimingMsPerTick)}`);
          }
          NODE
