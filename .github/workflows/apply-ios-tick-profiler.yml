name: Apply iOS tick profiler

on:
  push:
    branches: [ios-tick-profiler]
    paths:
      - 'js/core/performanceProfiler.js'
      - 'tools/apply-ios-tick-profiler.py'
      - '.github/workflows/apply-ios-tick-profiler.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply profiler instrumentation
        run: python tools/apply-ios-tick-profiler.py
      - name: Validate profiler build
        run: |
          node --check js/main.js
          node --check js/core/performanceProfiler.js
          node tools/test-ui-priority.mjs
          node tools/test-world-spatial-skeleton.mjs
          git diff --check
          grep -q "createPerformanceProfiler" js/main.js
          grep -q "profiler.measure('Nation AI'" js/main.js
          grep -q "profiler.measure('Trade'" js/main.js
          grep -q "profiler.measure('UI world-map draw'" js/main.js
      - name: Commit instrumented build and remove temporary applicator
        run: |
          rm tools/apply-ios-tick-profiler.py .github/workflows/apply-ios-tick-profiler.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Instrument simulation ticks for iOS profiling'
          git pull --rebase
          git push
