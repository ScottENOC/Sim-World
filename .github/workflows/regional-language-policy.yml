name: Regional language policy validation

on:
  push:
    branches: [regional-language-policy-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integration
        run: python tools/apply-regional-language-policy.py
      - name: Syntax checks
        run: |
          python -m py_compile tools/apply-regional-language-policy.py
          node --check js/politics/languagePolicy.js
          node --check js/politics/polities.js
          node --check js/diplomacy/languageChange.js
          node --check js/main.js
      - name: Regional language policy regressions
        run: node tools/test-regional-language-policy.mjs
      - name: Language and diplomacy regressions
        run: |
          node tools/test-generational-language-change.mjs
          node tools/test-population-language-networks.mjs
          node tools/test-diplomats-counterintelligence.mjs
          node tools/test-player-joint-operation-advisor.mjs
          node tools/test-joint-operations-command.mjs
      - name: Military regressions
        run: |
          node tools/test-allied-battle-coordination.mjs
          node tools/test-subregional-army-battles.mjs
          node tools/test-counter-logistics-relief.mjs
          node tools/test-supply-corridors-ai.mjs
          node tools/test-expeditionary-logistics.mjs
          node tools/test-subregional-movement.mjs
          node tools/test-subregional-control.mjs
          node tools/test-multi-party-war.mjs
          node tools/test-strategic-military-planning.mjs
      - name: Headless world smoke test
        run: node tools/calibrate.mjs --years 1 --seeds 1 --snapshot-years 1 --days-per-tick 30 --scale 1 --output /tmp/language-policy-smoke.json
      - name: Diff sanity
        run: git diff --check
      - name: Commit integrated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Language policy integration already materialised'
          else
            git commit -m 'Integrate regional language policy'
            git pull --rebase --autostash
            git push
          fi
