name: Apply calendar-week bridge
on:
  push:
    paths:
      - '.github/workflows/calendar-week-bridge.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply and test
        run: |
          python3 tools/calendar-week-bridge.py
          find js tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node -e "Promise.all([import('./js/main.js').catch(()=>null),import('./js/society/religion.js'),import('./js/economy/laborCore.js')])"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js tools/calibrate.mjs
          git commit -m "Preserve calendar-week semantics under monthly ticks"
          git push
