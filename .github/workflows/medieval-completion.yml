name: Medieval completion validation

on:
  push:
    branches:
      - finish-medieval-layer-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply integration if needed
        run: python tools/apply-medieval-completion.py

      - name: Syntax checks
        run: |
          python -m py_compile tools/apply-medieval-completion.py
          node --check js/politics/medievalCompletion.js
          node --check js/main.js

      - name: Medieval completion regression
        run: node tools/test-medieval-completion.mjs

      - name: 2300-region performance and plausibility benchmark
        run: node tools/benchmark-medieval-completion.mjs

      - name: Existing medieval regressions
        run: |
          node tools/test-medieval-systems-v2.mjs
          node tools/test-medieval-politics.mjs
          node tools/test-state-administration-elite-politics-v2.mjs
          node tools/test-civil-war-factions-v2.mjs
          node tools/test-religious-authority-politics-v2.mjs
          node tools/test-medieval-learning.mjs
          node tools/test-disease.mjs
          node tools/test-currency.mjs
          node tools/test-forex.mjs
          node tools/test-finance-corporate-capital-v2.mjs

      - name: Recent cross-system regressions
        run: |
          node tools/test-oceanic-provisioning-scurvy.mjs
          node tools/test-early-modern-military-transition.mjs
          node tools/test-persistent-settlements-v2.mjs
          node tools/test-persistent-infrastructure-sites.mjs
          node tools/test-world-spatial-real-map.mjs
          node tools/test-ui-priority.mjs

      - name: Commit integration
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/politics/medievalCompletion.js js/main.js
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate medieval completion systems'
            git push
          fi
