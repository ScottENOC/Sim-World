name: Temporary Steward plain-string rewrite

on:
  push:
    branches:
      - fix/advisors-steward-plain-strings

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/advisors-steward-plain-strings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rewrite Steward renderer
        run: python tools/rewrite-steward-plain-temp.py
      - name: Validate parser and education regression
        run: |
          node --check js/ui/advisors.js
          node --check js/main.js
          node tools/test-mass-education.mjs
          if sed -n '/renderSteward(player)/,/renderEnvoy(player)/p' js/ui/advisors.js | grep -q '\`'; then
            echo 'renderSteward still contains a backtick' >&2
            exit 1
          fi
      - name: Commit rewrite
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/ui/advisors.js
          git commit -m 'Rewrite Steward rendering without template literals'
          git push origin HEAD:fix/advisors-steward-plain-strings
