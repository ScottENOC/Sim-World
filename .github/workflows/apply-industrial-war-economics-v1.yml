name: Apply industrial war economics integration
on:
  push:
    branches: [feature/industrial-war-economics-v1]
    paths:
      - 'tools/apply-industrial-war-economics-v1.py'
      - '.github/workflows/apply-industrial-war-economics-v1.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/industrial-war-economics-v1
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python tools/apply-industrial-war-economics-v1.py
      - run: |
          node --check js/economy/industrialWarEconomy.js
          node --check js/economy/stateFinance.js
          node --check js/economy/trade.js
          node --check js/military/modernLandWarfare.js
          node --check js/main.js
          node tools/test-industrial-war-economics.mjs
          node tools/test-modern-land-warfare.mjs
          node tools/test-early-modern-military-transition.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/economy/tradeGoods.js js/military/modernLandWarfare.js js/economy/trade.js js/economy/stateFinance.js js/main.js
          git commit -m 'Integrate industrial war economics' || exit 0
          git push origin HEAD:feature/industrial-war-economics-v1
