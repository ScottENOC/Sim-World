name: Equipment generation migration
on:
  push:
    branches: [feature/artillery-fire-control-learning-v1]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python tools/apply-equipment-generation-integration.py
      - run: |
          node --check js/military/equipmentGenerations.js
          node --check js/military/earlyModernWarfare.js
          node --check js/military/artilleryFireControl.js
          node --check js/military/campaigns.js
          node --check js/ui/advisors.js
      - run: node tools/test-artillery-fire-control.mjs
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/military/earlyModernWarfare.js js/military/artilleryFireControl.js js/military/campaigns.js js/ui/advisors.js
          if git diff --cached --quiet; then echo current; else git commit -m 'Integrate persistent equipment generations'; git pull --rebase; git push; fi
