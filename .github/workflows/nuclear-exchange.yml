name: Nuclear exchange aftermath

on:
  pull_request:
  push:
    branches:
      - feature/nuclear-winter-integration

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check nuclear aftermath integration
        run: |
          node --check js/military/nuclearExchange.js
          node --check js/world/nuclearWinter.js
          node --check js/world/weather.js
          node --check js/economy/livestockAgriculture.js
          node --check js/economy/controlledEnvironmentAgriculture.js
      - name: Run nuclear exchange regressions
        run: node tests/nuclearExchange.test.mjs
      - name: Run nuclear winter regressions
        run: node tests/nuclearWinter.test.mjs
