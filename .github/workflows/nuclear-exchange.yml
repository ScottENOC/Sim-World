name: Nuclear exchange aftermath

on:
  pull_request:
  push:
    branches:
      - feature/nuclear-exchange-aftermath

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check nuclear exchange model
        run: node --check js/military/nuclearExchange.js
      - name: Run nuclear exchange regressions
        run: node tests/nuclearExchange.test.mjs
