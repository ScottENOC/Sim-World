name: Resource depletion final boss

on:
  pull_request:
    paths:
      - 'js/core/resourceDepletionBoss.js'
      - 'tests/resourceDepletionBoss.test.mjs'
      - '.github/workflows/resource-depletion-boss.yml'
      - 'js/economy/circularEconomy.js'
      - 'js/economy/industrialMaterials.js'
  push:
    branches: [ main ]
    paths:
      - 'js/core/resourceDepletionBoss.js'
      - 'tests/resourceDepletionBoss.test.mjs'
      - '.github/workflows/resource-depletion-boss.yml'
      - 'js/economy/circularEconomy.js'
      - 'js/economy/industrialMaterials.js'

jobs:
  resource-depletion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check js/core/resourceDepletionBoss.js && node --check tests/resourceDepletionBoss.test.mjs
      - name: Resource depletion boss regression
        run: node tests/resourceDepletionBoss.test.mjs
      - name: Existing circular economy regressions
        run: node tests/circularEconomy.test.mjs && node tests/closedLoopMaterialsIntegration.test.mjs
      - name: Industrial material substitution regression
        run: node tools/test-industrial-material-substitution.mjs
      - name: Whitespace check
        run: git diff --check
