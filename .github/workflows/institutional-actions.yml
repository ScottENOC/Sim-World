name: Institutional actions
on:
  push:
    branches: [feature/institutional-action-constraints, feature/wire-institutional-actions, 'feature/institutional-player-ui-*']
  pull_request:
    branches: [main]
    paths:
      - 'js/politics/institutionalPowers.js'
      - 'js/politics/institutionalActions.js'
      - 'js/politics/governmentActionExecution.js'
      - 'js/politics/institutionalCrises.js'
      - 'js/politics/institutionalIntegration.js'
      - 'js/ui/institutionalCouncilUi.js'
      - 'index.html'
      - 'js/ai/nationAi.js'
      - 'tools/test-institutional-actions.mjs'
      - 'tools/test-institutional-crises.mjs'
      - 'tools/test-institutional-integration.mjs'
      - 'tools/test-institutional-council-ui.mjs'
      - 'tools/test-institutional-player-war.mjs'
      - '.github/workflows/institutional-actions.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check js/politics/institutionalActions.js
          node --check js/politics/governmentActionExecution.js
          node --check js/politics/institutionalCrises.js
          node --check js/politics/institutionalIntegration.js
          node --check js/ui/institutionalCouncilUi.js
          node --check js/ai/nationAi.js
          node tools/test-institutional-actions.mjs
          node tools/test-institutional-crises.mjs
          node tools/test-institutional-integration.mjs
          node tools/test-institutional-council-ui.mjs
          node tools/test-institutional-player-war.mjs
          node tools/test-institutional-powers.mjs
          node tools/test-popular-wellbeing.mjs
          node tools/test-ai-performance-optimisations.mjs
          git diff --check
