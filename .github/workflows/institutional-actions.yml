name: Institutional actions
on:
  push:
    branches: [feature/institutional-action-constraints, feature/wire-institutional-actions, 'feature/institutional-player-ui-*', 'feature/institutional-region-controls-*', 'feature/use-of-force-spectrum-*', 'feature/regime-change-*', 'feature/regime-civil-war-*']
  pull_request:
    branches: [main]
    paths:
      - 'js/politics/institutionalPowers.js'
      - 'js/politics/institutionalActions.js'
      - 'js/politics/governmentActionExecution.js'
      - 'js/politics/institutionalRuntimeAuthority.js'
      - 'js/politics/institutionalCrises.js'
      - 'js/politics/institutionalIntegration.js'
      - 'js/politics/useOfForce.js'
      - 'js/politics/regimeChange.js'
      - 'js/politics/regimeCivilWar.js'
      - 'js/politics/continuity.js'
      - 'js/politics/continuityCore.js'
      - 'js/military/raiding.js'
      - 'js/military/campaigns.js'
      - 'js/main.js'
      - 'js/diplomacy/relations.js'
      - 'js/diplomacy/couriers.js'
      - 'js/ui/diplomaticServicePanel.js'
      - 'js/ui/institutionalCouncilUi.js'
      - 'js/ui/institutionalCouncilSpendingUi.js'
      - 'js/ui/institutionalRegionControlsUi.js'
      - 'js/ui/useOfForceUi.js'
      - 'index.html'
      - 'js/ai/nationAi.js'
      - 'tools/test-institutional-actions.mjs'
      - 'tools/test-institutional-crises.mjs'
      - 'tools/test-institutional-integration.mjs'
      - 'tools/test-institutional-council-ui.mjs'
      - 'tools/test-institutional-region-controls.mjs'
      - 'tools/test-institutional-player-war.mjs'
      - 'tools/test-use-of-force.mjs'
      - 'tools/test-regime-change.mjs'
      - 'tools/test-regime-civil-war.mjs'
      - 'tools/test-joint-operations-command.mjs'
      - 'tools/test-diplomatic-service-ui.mjs'
      - '.github/workflows/institutional-actions.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check js/politics/institutionalActions.js
          node --check js/politics/governmentActionExecution.js
          node --check js/politics/institutionalRuntimeAuthority.js
          node --check js/politics/institutionalCrises.js
          node --check js/politics/institutionalIntegration.js
          node --check js/politics/useOfForce.js
          node --check js/politics/regimeChange.js
          node --check js/politics/regimeCivilWar.js
          node --check js/politics/continuity.js
          node --check js/politics/continuityCore.js
          node --check js/military/raiding.js
          node --check js/military/campaigns.js
          node --check js/main.js
          node --check js/diplomacy/relations.js
          node --check js/diplomacy/couriers.js
          node --check js/ui/diplomaticServicePanel.js
          node --check js/ui/institutionalCouncilUi.js
          node --check js/ui/institutionalCouncilSpendingUi.js
          node --check js/ui/institutionalRegionControlsUi.js
          node --check js/ui/useOfForceUi.js
          node --check js/ai/nationAi.js
          node tools/test-institutional-actions.mjs
          node tools/test-institutional-crises.mjs
          node tools/test-institutional-integration.mjs
          node tools/test-institutional-council-ui.mjs
          node tools/test-institutional-region-controls.mjs
          node tools/test-institutional-player-war.mjs
          node tools/test-use-of-force.mjs
          node tools/test-regime-change.mjs
          node tools/test-regime-civil-war.mjs
          node tools/test-joint-operations-command.mjs
          node tools/test-diplomatic-service-ui.mjs
          node tools/test-institutional-powers.mjs
          node tools/test-popular-wellbeing.mjs
          node tools/test-ai-performance-optimisations.mjs
          git diff --check
