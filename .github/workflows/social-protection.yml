name: Social protection and relief
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/society/socialProtection.js'
      - 'js/economy/employmentAndHardship.js'
      - 'js/ui/socialProtectionUi.js'
      - 'js/ui/socialOverlays.js'
      - 'tools/test-social-protection.mjs'
      - '.github/workflows/social-protection.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check js/society/socialProtection.js
          node --check js/economy/employmentAndHardship.js
          node --check js/ui/socialProtectionUi.js
          node --check js/ui/socialOverlays.js
          node tools/test-social-protection.mjs
