name: Modern urban water

on:
  pull_request:
    paths:
      - 'js/world/urbanWater.js'
      - 'js/world/waterResources.js'
      - 'js/world/hydrology.js'
      - 'js/economy/electricity.js'
      - 'tools/test-modern-urban-water.mjs'
      - 'tools/test-modern-water-quantity.mjs'
      - 'tools/test-human-river-engineering.mjs'
      - '.github/workflows/modern-urban-water.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check urban water integration
        run: |
          node --check js/world/urbanWater.js
          node --check js/world/waterResources.js
          node --check js/world/hydrology.js
          node --check js/economy/electricity.js
          node --check tools/test-modern-urban-water.mjs
      - name: Run modern urban water regression
        run: node tools/test-modern-urban-water.mjs
      - name: Re-run modern water quantity regression
        run: node tools/test-modern-water-quantity.mjs
      - name: Re-run human river engineering regression
        run: node tools/test-human-river-engineering.mjs
