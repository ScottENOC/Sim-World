name: Crimea and Finland map audit

on:
  pull_request:
    paths:
      - 'data/world/**'
      - 'data/scenarios/fractured-2027/world/**'
      - 'tools/**'
      - 'tests/crimeaFinlandMapAudit.mjs'
      - '.github/workflows/crimea-finland-map-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Crimea and Finland geography
        run: node tests/crimeaFinlandMapAudit.mjs
