name: Demographic sustainability

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  demographic-sustainability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check js/society/demographicSustainability.js && node --check js/society/demographics.js
      - name: Demographic sustainability regressions
        run: node tests/demographicSustainability.test.mjs
