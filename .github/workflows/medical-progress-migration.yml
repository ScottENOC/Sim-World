name: Medical progression migration
on:
  push:
    branches: [feature/medical-progress-military-medicine-v1]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integration
        run: python tools/apply-medical-progress.py
      - name: Syntax checks
        run: |
          node --check js/technology/medicalProgress.js
          node --check js/technology/breakthroughs.js
          node --check js/society/publicHealth.js
          node --check js/society/disease.js
          node --check js/military/campaigns.js
      - name: Existing regressions
        run: |
          node tools/test-public-health-hospitals.mjs
          node tools/test-disease.mjs
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 4189822+github-actions[bot]@users.noreply.github.com
          git add js/technology/breakthroughs.js js/society/publicHealth.js js/society/disease.js js/military/campaigns.js
          if git diff --cached --quiet; then
            echo 'Integration already current'
          else
            git commit -m 'Integrate medical progress with disease and warfare'
            git pull --rebase
            git push
          fi
