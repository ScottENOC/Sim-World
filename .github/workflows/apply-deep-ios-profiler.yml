name: Apply deep iOS performance profiling

on:
  push:
    branches: [deep-ios-performance-profile]
    paths:
      - 'tools/apply-deep-ios-profiler.py'
      - '.github/workflows/apply-deep-ios-profiler.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply instrumentation
        run: python tools/apply-deep-ios-profiler.py
      - name: Validate
        run: |
          node --check js/core/performanceProfiler.js
          node --check js/economy/trade.js
          node --check js/diplomacy/relations.js
          node --check js/society/demographics.js
          node --check js/main.js
          node tools/test-ui-priority.mjs
          node tools/test-world-spatial-skeleton.mjs
          node tools/test-diplomacy-readonly.mjs
          git diff --check
      - name: Commit instrumented source and remove helper
        run: |
          rm tools/apply-deep-ios-profiler.py .github/workflows/apply-deep-ios-profiler.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Add deep iOS hotspot profiling'
          git pull --rebase
          git push
