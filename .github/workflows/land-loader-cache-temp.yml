name: Land loader cache bump
on:
  push:
    branches: [fix/land-loader-progress]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/land-loader-progress
      - run: python tools/bump-land-loader-cache-temp.py
      - run: node --check js/main.js
      - run: node --check js/world/region.js
      - run: git diff --check
      - name: Commit cache bump
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html js/main.js
          git commit -m 'Bump land loader startup cache keys'
          git push origin HEAD:fix/land-loader-progress
