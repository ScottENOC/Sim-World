name: Apply merchant recovery fix
on:
  push:
    branches: [calibrate-418-trade-raiding]
    paths: ['.github/workflows/apply-trade-recovery-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch merchant search and retirement
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/economy/trade.js')
          s = p.read_text()
          pairs = []
          pairs.append(('const BROAD_SEARCH_INTERVAL = 52;', 'const BROAD_SEARCH_INTERVAL = 26;'))
          old_resources = "    const resources = habitualResources.length\n      ? [...new Set(habitualResources)]\n      : stockedResources.slice(0, MAX_NEW_RESOURCES_PER_DESTINATION);"
          new_resources = "    // Familiar routes get first look, but never monopolise the product list.\n    // A merchant who knows a destination should still occasionally notice a\n    // different cargo becoming attractive there as relative prices change.\n    const exploratoryResources = stockedResources\n      .filter((resource) => !habitualResources.includes(resource))\n      .slice(0, 1);\n    const resources = habitualResources.length\n      ? [...new Set([...habitualResources, ...exploratoryResources])]\n      : stockedResources.slice(0, MAX_NEW_RESOURCES_PER_DESTINATION);"
          pairs.append((old_resources, new_resources))
          pairs.append(('  } else if (economy.merchantConfidence < -0.25 && idle > 0) {', '  } else if (economy.weeklyReturns > 0 && economy.merchantConfidence < -0.25 && idle > 0) {'))
          old_candidates = '  const candidateIds = new Set(habitDestinationIds(region).slice(0, MAX_CANDIDATE_MARKETS));'
          new_candidates = "  // Reserve candidate slots for genuinely new markets. Previously, once a\n  // region had MAX_CANDIDATE_MARKETS habitual destinations, appending broad-\n  // search leads and then slicing back to the cap discarded every new lead.\n  const habitualSlots = Math.max(4, MAX_CANDIDATE_MARKETS - MAX_EXPLORATION_MARKETS);\n  const candidateIds = new Set(habitDestinationIds(region).slice(0, habitualSlots));"
          pairs.append((old_candidates, new_candidates))
          for old, new in pairs:
              if old not in s:
                  raise SystemExit('target not found: ' + old[:80])
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check js/economy/trade.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/economy/trade.js
          git commit -m 'Let persistent merchant networks recover and explore'
          git push
