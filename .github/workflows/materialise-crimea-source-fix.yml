name: Materialise durable Crimea source fix
on:
  push:
    branches: [rebalance-france-germany]
    paths:
      - '.github/workflows/materialise-crimea-source-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply durable source fix
        run: |
          python tools/apply-crimea-geography-fix.py
          python -m py_compile tools/build-map-expansion-v2-fast.py tools/build-sea-expansion-v2.py
          git diff --check
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/build-map-expansion-v2-fast.py tools/build-sea-expansion-v2.py tools/map-region-plan-v2.json
          git commit -m 'Make Crimea geography classification durable'
          git pull --rebase
          git push
