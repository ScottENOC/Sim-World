name: Apply private military integration
on:
  push:
    branches: [mercenaries-pmcs-v1]
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mercenaries-pmcs-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate
        run: python tools/apply-private-military-v1.py
      - name: Validate
        run: |
          node tools/test-private-military-actors.mjs
          node tools/test-non-state-interactions.mjs
          node tools/test-medieval-politics.mjs
          node tools/test-ui-priority.mjs
          node tools/test-world-spatial-skeleton.mjs
          node --check js/politics/privateMilitaryActors.js
          node --check js/politics/nonStateOrganisations.js
          node --check js/military/campaigns.js
          node --check js/main.js
          node --check js/ui/nonStateOrganisationsUi.js
          git diff --check
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js index.html tools
          git commit -m 'Integrate mercenary contingents and sponsored PMCs' || true
          git push origin HEAD:mercenaries-pmcs-v1
      - name: Remove temporary workflow and applicator
        run: |
          git rm .github/workflows/apply-private-military-v1.yml tools/apply-private-military-v1.py
          git commit -m 'Remove temporary private military integration helpers'
          git push origin HEAD:mercenaries-pmcs-v1
