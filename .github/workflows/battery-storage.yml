name: Battery storage

on:
  pull_request:
  push:
    branches:
      - feature/grid-and-mobile-batteries

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check battery integration
        run: |
          node --check js/economy/batteryStorage.js
          node --check js/economy/electricity.js
          node --check js/technology/modernEnergy.js
      - name: Run battery regressions
        run: node tools/test-battery-storage.mjs
