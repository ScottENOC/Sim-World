name: Battery storage

on:
  pull_request:
  push:
    branches:
      - feature/grid-and-mobile-batteries
      - feature/battery-grid-interconnectors
      - fix/interconnector-household-service
      - feature/grid-interconnector-player-ui

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check battery and grid integration
        run: |
          node --check js/economy/batteryStorage.js
          node --check js/economy/batterySupplyChain.js
          node --check js/economy/electricity.js
          node --check js/economy/electricityInterconnectors.js
          node --check js/economy/localCommunications.js
          node --check js/military/drones.js
          node --check js/technology/electrification.js
          node --check js/technology/modernEnergy.js
          node --check js/ui/electricGridUi.js
          node --check js/ui/electricGridAutoUi.js
      - name: Run battery regressions
        run: |
          node tools/test-battery-storage.mjs
          node tools/test-battery-grid-interconnectors.mjs
