name: Political continuity validation
on:
  push:
    branches: [political-continuity-v1]
    paths: ['tools/apply-political-continuity-exile-diplomacy.py', '.github/workflows/apply-political-continuity-v1.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/apply-political-continuity-exile-diplomacy.py
      - run: find js tools -name '*.js' -o -name '*.mjs' | while read f; do node --check "$f"; done
      - run: node tools/test-political-continuity.mjs
      - run: node tools/test-culture.mjs
      - run: node tools/calibrate.mjs --years 2 --seeds 1 --base-seed 305419896 --snapshot-years 2 --days-per-tick 30 --regional-detail false --output continuity-smoke.json
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/politics/continuity.js js/main.js tools/test-political-continuity.mjs
          git commit -m 'Add exile diplomacy and restoration backing'
          git push