name: Apply medieval forex v1
on:
  push:
    branches: [medieval-forex-v1]
    paths:
      - 'tools/apply-forex-v1.py'
      - '.github/workflows/apply-forex-v1.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: python tools/apply-forex-v1.py
      - run: |
          node tools/test-forex.mjs
          node tools/test-currency.mjs
          node tools/test-ui-priority.mjs
          node tools/test-world-spatial-skeleton.mjs
          node tools/test-diplomacy-readonly.mjs
          node --check js/economy/forex.js
          node --check js/economy/currency.js
          node --check js/ui/currencyUi.js
          git diff --check
      - run: |
          rm tools/apply-forex-v1.py .github/workflows/apply-forex-v1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Integrate medieval foreign exchange'
          git pull --rebase
          git push
