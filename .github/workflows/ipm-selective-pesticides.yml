name: Integrated pest management and selective pesticides
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/economy/agriculturalPesticides.js'
      - 'js/technology/industrialProduction.js'
      - 'tools/test-ipm-selective-pesticides.mjs'
      - '.github/workflows/ipm-selective-pesticides.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax check pesticide integration
        run: |
          node --check js/economy/agriculturalPesticides.js
          node --check js/technology/industrialProduction.js
      - name: Run IPM and selective pesticide regression
        run: node tools/test-ipm-selective-pesticides.mjs
      - name: Re-run pesticide and pollinator regressions
        run: |
          node tools/test-agricultural-pesticides.mjs
          node tools/test-synthetic-pesticides.mjs
          node tools/test-agricultural-pollinators.mjs
