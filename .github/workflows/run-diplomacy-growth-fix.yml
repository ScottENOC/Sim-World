name: Run diplomacy growth fix
on:
  push:
    branches:
      - fix-diplomacy-relationship-growth
    paths:
      - tools/apply-diplomacy-growth-fix.py
      - .github/workflows/run-diplomacy-growth-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/apply-diplomacy-growth-fix.py
      - run: |
          node --check js/diplomacy/relations.js
          node tools/test-diplomacy-readonly.mjs
          node tools/test-ui-priority.mjs
          node tools/test-world-spatial-skeleton.mjs
          git diff --check
      - run: |
          rm tools/apply-diplomacy-growth-fix.py .github/workflows/run-diplomacy-growth-fix.yml .github/workflows/apply-diplomacy-growth-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Stop read-only diplomacy checks growing relationship graph'
          git pull --rebase
          git push
