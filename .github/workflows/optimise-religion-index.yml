name: Optimise religion indexing
on:
  push:
    paths:
      - '.github/workflows/optimise-religion-index.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and test
        run: |
          python3 tools/optimise-religion-index.py
          node --check js/society/religion.js
          node -e "import('./js/society/religion.js')"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/society/religion.js
          git commit -m "Avoid repeated full religion migration scans"
          git push
