name: Apply naval light-metal designs

on:
  push:
    branches: [ feature/naval-light-metal-designs ]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/naval-light-metal-designs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply naval material integration
        run: python tools/apply-naval-light-metal-designs.py
      - name: Syntax checks
        run: |
          node --check js/military/fleets.js
          node --check js/economy/laborCore.js
          node --check js/main.js
          node --check js/ui/navalDesignUi.js
      - name: Naval material regressions
        run: |
          node tools/test-naval-light-metal-designs.mjs
          node tools/test-late-industrial-navy.mjs
          node tools/test-naval-procurement.mjs
          node tools/test-fleet-ship-progression.mjs
          node tools/test-persistent-fleets.mjs
          node tools/test-industrial-marine.mjs
          node tools/test-naval-damage-salvage.mjs
          node tools/test-light-metals.mjs
          git diff --check
      - name: Commit integrated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/military/fleets.js js/economy/laborCore.js js/main.js index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate light metals into naval designs'
            git pull --rebase
            git push
          fi
