name: Temporary full advisors template audit

on:
  push:
    branches:
      - fix/advisors-full-template-audit

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/advisors-full-template-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse each class method independently with Babel
        run: |
          npm install --no-save --no-package-lock @babel/parser
          node - <<'JS'
          const fs=require('fs');
          const parser=require('@babel/parser');
          const src=fs.readFileSync('js/ui/advisors.js','utf8');
          const classStart=src.indexOf('export class AdvisorCouncil {');
          const body=src.slice(classStart + 'export class AdvisorCouncil {'.length);
          const re=/^  ([A-Za-z_$][\w$]*)\s*\([^\n]*\)\s*\{/gm;
          const matches=[...body.matchAll(re)];
          console.log('methods:', matches.map(m=>m[1]).join(', '));
          let failures=0;
          for(let i=0;i<matches.length;i++){
            const name=matches[i][1];
            const start=matches[i].index;
            const end=i+1<matches.length ? matches[i+1].index : body.lastIndexOf('\n}');
            const method=body.slice(start,end);
            try {
              parser.parse('class X {\n'+method+'\n}',{sourceType:'module'});
              console.log('PASS',name);
            } catch(e){
              failures++;
              console.log('FAIL',name,e.message,'local',e.loc);
            }
          }
          try { parser.parse(src,{sourceType:'module'}); console.log('FULL PASS'); }
          catch(e){ console.log('FULL FAIL',e.message,e.loc); }
          if(failures) process.exit(1);
          JS
