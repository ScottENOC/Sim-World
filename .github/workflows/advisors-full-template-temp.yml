name: Temporary full advisors template audit

on:
  push:
    branches:
      - fix/advisors-full-template-audit

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/advisors-full-template-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Transform all template literals in advisors
        run: |
          npx --yes -p @babel/core -p @babel/cli -p @babel/plugin-transform-template-literals babel js/ui/advisors.js --plugins @babel/plugin-transform-template-literals --out-file /tmp/advisors.js
          mv /tmp/advisors.js js/ui/advisors.js
      - name: Validate transformed advisors
        run: |
          node --check js/ui/advisors.js
          node --check js/main.js
          node tools/test-mass-education.mjs
          if grep -q '\`' js/ui/advisors.js; then
            echo 'Template literal remains in advisors.js' >&2
            exit 1
          fi
      - name: Commit transformed advisors
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/ui/advisors.js
          git commit -m 'Eliminate template literals from advisors rendering'
          git push origin HEAD:fix/advisors-full-template-audit
