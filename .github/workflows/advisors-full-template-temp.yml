name: Temporary full advisors template audit

on:
  push:
    branches:
      - fix/advisors-full-template-audit

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/advisors-full-template-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect bytes and parser state
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/ui/advisors.js')
          lines=p.read_text().splitlines()
          for n in range(374,383):
              s=lines[n-1]
              print(n, repr(s))
              if n == 380:
                  print('line380 codepoints:', ' '.join(f'U+{ord(c):04X}' for c in s[:24]))
                  print('line380 bytes:', s.encode('utf-8').hex())
          PY
          node --check js/ui/advisors.js
      - name: Compare Babel parser
        run: |
          npm install --no-save --no-package-lock @babel/core @babel/parser
          node - <<'JS'
          const fs=require('fs');
          const parser=require('@babel/parser');
          const src=fs.readFileSync('js/ui/advisors.js','utf8');
          try { parser.parse(src,{sourceType:'module'}); console.log('Babel parser accepted full file'); }
          catch(e) { console.error(e.message); console.error(e.loc); process.exit(1); }
          JS
