name: Apply collapse trade patch

on:
  push:
    branches: [collapse-trade-raiding-language-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collapse-trade-raiding-language-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply simulation patch
        run: python tools/apply-collapse-patch.py
      - name: Syntax check
        run: find js tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Commit patch and remove one-shot helpers
        run: |
          git config user.name "sim-world-bot"
          git config user.email "sim-world-bot@users.noreply.github.com"
          git add js/economy/trade.js js/ai/nationAi.js tools/calibrate.mjs
          git rm .github/workflows/apply-collapse-trade-patch.yml tools/apply-collapse-patch.py
          git commit -m "Apply collapse trade and raiding mechanics"
          git push origin HEAD:collapse-trade-raiding-language-v1
