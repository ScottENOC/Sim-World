name: Apply migration fan-out and diplomacy cadence fix

on:
  push:
    branches: [fix-migration-fanout-diplomacy-cadence]
    paths:
      - 'tools/apply-migration-diplomacy-fix.py'
      - '.github/workflows/apply-migration-diplomacy-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source changes
        run: python tools/apply-migration-diplomacy-fix.py
      - name: Validate
        run: |
          node --check js/society/migration.js
          node --check js/diplomacy/relations.js
          node --check js/main.js
          node tools/test-diplomacy-readonly.mjs
          node tools/test-ui-priority.mjs
          node tools/test-world-spatial-skeleton.mjs
          git diff --check
          grep -q 'MAX_MIGRATION_DESTINATIONS = 4' js/society/migration.js
          grep -q 'maintainRelationships' js/diplomacy/relations.js
          grep -q 'diplomacyRelationshipAccumulatedDays' js/main.js
      - name: Commit cleaned source change
        run: |
          rm tools/apply-migration-diplomacy-fix.py .github/workflows/apply-migration-diplomacy-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Limit famine migration fan-out and stagger diplomacy maintenance'
          git pull --rebase
          git push
