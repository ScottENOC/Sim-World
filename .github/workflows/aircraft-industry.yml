name: Aircraft industry

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check js/military/equipmentGenerations.js
      - run: node --check js/economy/industrialPlant.js
      - run: node --check js/military/aviation.js
      - run: node tools/test-aircraft-industry.mjs
