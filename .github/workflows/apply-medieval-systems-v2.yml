name: Apply medieval systems v2
on:
  push:
    branches: [medieval-systems-v2]
permissions:
  contents: write
jobs:
  apply-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: medieval-systems-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight fixes
        run: python tools/fix-medieval-systems-v2.py
      - name: Apply integration
        run: python tools/apply-medieval-systems-v2.py
      - name: Validate
        run: |
          node tools/test-medieval-systems-v2.mjs
          node tools/test-medieval-politics.mjs
          node tools/test-medieval-learning.mjs
          node tools/test-gunpowder-firearms.mjs
          node tools/test-private-military-actors.mjs
          node tools/test-disease.mjs
          node tools/test-currency.mjs
          node tools/test-forex.mjs
          node tools/test-ui-priority.mjs
          node tools/test-world-spatial-skeleton.mjs
          node --check js/politics/medievalStateSystems.js
          node --check js/economy/medievalCommercialInstitutions.js
          node --check js/military/medievalDoctrine.js
          node --check js/society/medievalReligiousPolitics.js
          node --check js/ui/medievalSystemsUi.js
          node --check js/main.js
          node --check js/military/campaigns.js
          node --check js/economy/trade.js
          git diff --check
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js index.html tools
          git commit -m 'Integrate plural medieval institutions' || true
          git push origin HEAD:medieval-systems-v2
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/apply-medieval-systems-v2.yml
          git commit -m 'Remove temporary medieval systems workflow'
          git push origin HEAD:medieval-systems-v2