name: Advisors syntax regression

on:
  pull_request:
    paths:
      - 'js/ui/advisors.js'
      - '.github/workflows/advisors-syntax.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse advisors module
        run: node --check js/ui/advisors.js
