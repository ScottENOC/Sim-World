name: Apply scouting fixes
on:
  push:
    paths:
      - '.github/workflows/apply-scouting-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch scouting and knowledge
        run: python tools/apply-scouting-fixes.py
      - name: Syntax checks
        run: |
          node --check js/core/scouting.js
          node --check js/core/knowledge.js
          node --check js/ai/nationAi.js
          node --check js/world/region.js
          node --check js/main.js
      - name: Commit patched files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/core/knowledge.js js/core/scouting.js js/ai/nationAi.js js/world/region.js js/main.js
          git diff --cached --check
          git commit -m "Add initial geographic knowledge and government scouting" || exit 0
          git push
