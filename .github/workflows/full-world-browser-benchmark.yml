name: Full-world browser benchmark

on:
  push:
    branches: [benchmark-world-2024-v1]
    paths:
      - '.github/workflows/full-world-browser-benchmark.yml'
      - 'tools/benchmark-world-browser.mjs'
      - 'tools/optimise-military-target-churn.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Avoid target-only military force replans
        run: python tools/optimise-military-target-churn.py
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          test -x "$(command -v google-chrome)"
      - name: Start Sim-World
        run: |
          python -m http.server 8000 > /tmp/sim-world-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/sim-world-http.log
          exit 1
      - name: Benchmark real full-world ticks
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SIM_WORLD_BENCHMARK_SAMPLES: '12'
          SIM_WORLD_BENCHMARK_OUTPUT: benchmarks/world-2024-after-ai-target-stability.json
        run: |
          mkdir -p benchmarks
          set +e
          node tools/benchmark-world-browser.mjs > benchmarks/world-2024-after-ai-target-stability.log 2>&1
          status=$?
          cat benchmarks/world-2024-after-ai-target-stability.log
          exit $status
      - name: Commit optimisation and benchmark evidence
        if: always() && github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/military/strategicPlanning.js benchmarks/world-2024-after-ai-target-stability.json benchmarks/world-2024-after-ai-target-stability.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Avoid target-only NPC force replans and record benchmark'
            git pull --rebase
            git push
          fi
