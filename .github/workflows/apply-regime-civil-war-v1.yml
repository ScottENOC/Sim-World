name: Apply regime civil war v1 patch
on:
  push:
    branches: [feature/regime-civil-war-v1]
    paths:
      - 'tools/apply-regime-civil-war-v1.mjs'
      - '.github/workflows/apply-regime-civil-war-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/regime-civil-war-v1
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply civil-war integration
        run: node tools/apply-regime-civil-war-v1.mjs
      - name: Commit resulting source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply-regime-civil-war-v1.mjs .github/workflows/apply-regime-civil-war-v1.yml
          git add js/main.js js/military/campaigns.js
          git diff --cached --check
          git commit -m "Fight revolutionary civil wars through campaign system"
          git push origin HEAD:feature/regime-civil-war-v1
