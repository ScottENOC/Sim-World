name: Finalise Western Europe map

on:
  push:
    branches: [expand-germany-low-countries-fix-pinch]
    paths:
      - 'tools/finalise-western-europe-map.py'
      - '.github/workflows/finalise-western-europe-map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check shapely==2.1.1
      - name: Apply durable cleanup
        run: |
          python tools/finalise-western-europe-map.py
          python tools/cleanup-region-display-names.py
      - name: Verify Crimea points and new names
        run: |
          python - <<'PY'
          import json
          from shapely.geometry import shape, Point
          from shapely.ops import unary_union
          geo=json.load(open('data/world/regions.geo.json'))
          seas=json.load(open('data/world/seaRegions.geo.json'))
          land=unary_union([shape(f['geometry']) for f in geo['features']])
          sb={f['properties']['id']:shape(f['geometry']) for f in seas['features']}
          water=unary_union([sb['sea_black'],sb['sea_azov']])
          points=[(34.10,44.95),(33.75,45.20),(34.40,45.35),(35.05,45.05),(35.65,45.30)]
          for lon,lat in points:
              p=Point(lon,lat)
              print(f'CRIMEA_POINT {lon},{lat} land={land.covers(p)} sea={water.covers(p)}')
              assert land.covers(p), f'Crimea sample {lon},{lat} is not simulated land'
              assert not water.covers(p), f'Crimea sample {lon},{lat} is painted as sea'
          names={iso:sorted(f['properties']['name'] for f in geo['features'] if f['properties'].get('sourceGroup')==iso) for iso in ('DEU','NLD','BEL','LUX')}
          for iso,rows in names.items(): print(iso+'_REGIONS='+json.dumps(rows,ensure_ascii=False))
          assert not any('hinterland' in n.lower() for rows in names.values() for n in rows), 'generic hinterland label remains in new Western Europe regions'
          PY
          node --check js/ui/mapRenderer.js
          node tools/test-ui-priority.mjs
          git diff --check
      - name: Commit final materialised cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/cleanup-region-display-names.py .github/workflows/build-broad-map-expansion.yml data/world/regions.geo.json data/world/regions.meta.json
          git commit -m 'Polish Western Europe names and map rebuild checks'
          git pull --rebase
          git push
