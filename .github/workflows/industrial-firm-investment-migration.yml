name: Industrial firm investment migration
on:
  push:
    branches: [feature/industrial-firm-investment-v1]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python tools/apply-industrial-firm-investment-v2.py
      - name: Relax private-factory warmup regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/test-industrial-investment.mjs')
          t=p.read_text().replace("tickIndustrialInvestment(privateFactory,90);\nassert((privateFactory.industrialInvestment.last.factoryCapacity||0)>0", "for(let i=0;i<4;i++)tickIndustrialInvestment(privateFactory,90);\nassert((privateFactory.industrialInvestment.last.factoryCapacity||0)>0",1)
          p.write_text(t)
          PY
      - run: python tools/apply-predigital-equipment-generations.py
      - run: |
          node --check js/economy/industrialPlant.js
          node --check js/economy/industrialInvestment.js
          node --check js/economy/corporateInfrastructureAi.js
          node --check js/military/equipmentGenerations.js
          node --check js/military/fleets.js
      - run: node tools/test-industrial-investment.mjs
      - run: node tools/test-component-industrial-base.mjs
      - run: node tools/test-industrial-production.mjs
      - run: node tools/test-artillery-fire-control.mjs
      - run: node tools/test-fleet-ship-progression.mjs
      - run: node tools/test-predigital-equipment-generations.mjs
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/economy/industrialPlant.js js/economy/industrialInvestment.js js/economy/corporateInfrastructureAi.js js/military/equipmentGenerations.js js/military/fleets.js tools/test-industrial-investment.mjs
          if git diff --cached --quiet; then echo current; else git commit -m 'Connect industrial investment and pre-digital equipment generations'; git pull --rebase; git push; fi
