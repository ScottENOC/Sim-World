name: Apply productive acreage fix
on:
  push:
    branches: [calibrate-418-trade-raiding]
    paths: ['.github/workflows/apply-productive-acreage-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scale farm labour saturation by productive acreage
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('js/economy/laborCore.js')
          text = path.read_text()
          old = "  const kLabor = region.areaSqKm * FARM_LABOR_SATURATION_PER_KM2;"
          new = """  // landQuality is an area-weighted productive-land index. On marginal or\n  // partly desert regions the productive acreage is only a fraction of the\n  // polygon, so farmers should saturate that usable acreage rather than being\n  // diluted across every square kilometre of desert/mountain. Fertile quality\n  // above 1 remains a yield advantage, not more than 100% usable land.\n  const productiveAcreageFactor = Math.min(1, Math.max(0.03, region.landQuality));\n  const kLabor = region.areaSqKm * productiveAcreageFactor * FARM_LABOR_SATURATION_PER_KM2;"""
          if old not in text:
              raise SystemExit('target line not found')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check js/economy/laborCore.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/economy/laborCore.js
          git commit -m 'Scale farming labour saturation by productive acreage'
          git push
