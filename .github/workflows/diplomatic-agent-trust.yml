name: Diplomatic agent trust validation

on:
  push:
    branches: [diplomatic-agent-trust-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integration
        run: python tools/apply-diplomatic-agent-trust.py
      - name: Syntax checks
        run: |
          python -m py_compile tools/apply-diplomatic-agent-trust.py
          node --check js/diplomacy/diplomatPersonalities.js
          node --check js/diplomacy/diplomats.js
          node --check js/diplomacy/couriers.js
          node --check js/main.js
      - name: Diplomatic agent trust regressions
        run: node tools/test-diplomatic-agent-trust.mjs
      - name: Diplomacy regressions
        run: |
          node tools/test-diplomats-counterintelligence.mjs
          node tools/test-player-joint-operation-advisor.mjs
          node tools/test-joint-operations-command.mjs
          node tools/test-population-language-networks.mjs
          node tools/test-generational-language-change.mjs
      - name: Military regressions
        run: |
          node tools/test-campaign-command-advisor.mjs
          node tools/test-allied-battle-coordination.mjs
          node tools/test-subregional-army-battles.mjs
          node tools/test-counter-logistics-relief.mjs
          node tools/test-supply-corridors-ai.mjs
          node tools/test-expeditionary-logistics.mjs
          node tools/test-multi-party-war.mjs
      - name: Headless world smoke
        run: node tools/calibrate.mjs --years 1 --seeds 1 --snapshot-years 1 --days-per-tick 30 --scale 1 --output /tmp/diplomatic-agent-smoke.json
      - name: Diff sanity
        run: git diff --check
      - name: Commit integrated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Diplomatic agent trust integration already materialised'
          else
            git commit -m 'Integrate diplomatic agent trust'
            git pull --rebase --autostash
            git push
          fi
