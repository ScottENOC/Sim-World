name: Apply maritime skills
on:
  push:
    paths:
      - '.github/workflows/apply-maritime-skills.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/apply-maritime-skills.py
      - run: |
          node --check js/technology/seamanship.js
          node --check js/technology/learningByDoing.js
          node --check js/economy/laborCore.js
          node --check js/economy/trade.js
          node --check js/core/scouting.js
          node --check js/military/raiding.js
          node --check js/main.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/economy/laborCore.js js/economy/trade.js js/core/scouting.js js/military/raiding.js js/main.js
          git diff --cached --check
          git commit -m "Integrate maritime subskills and spillover" || exit 0
          git push
