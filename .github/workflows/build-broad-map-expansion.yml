name: Build broad Europe Middle East expansion

on:
  push:
    branches: [broad-europe-middle-east-expansion]
    paths:
      - '.github/workflows/build-broad-map-expansion.yml'
      - 'tools/build-map-expansion-v2.py'
      - 'tools/build-map-expansion-v2-natural-earth.py'
      - 'tools/build-map-expansion-v2-fast.py'
      - 'tools/map-region-plan-v2.json'
      - 'tools/map-resource-plan-v2.json'
      - 'tools/build-sea-expansion-v2.py'
      - 'tools/sea-region-expansion-plan-v2.json'
      - 'js/world/chokepoints.js'
      - 'js/economy/trade.js'
      - 'js/economy/transitTolls.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install map dependencies
        run: python -m pip install --disable-pip-version-check shapely==2.1.1 pyproj==3.7.2
      - name: Validate scripts, plans and current trade integration
        run: |
          python -m py_compile tools/build-map-expansion-v2.py tools/build-map-expansion-v2-natural-earth.py tools/build-map-expansion-v2-fast.py tools/build-sea-expansion-v2.py
          python -m json.tool tools/map-region-plan-v2.json >/dev/null
          python -m json.tool tools/map-resource-plan-v2.json >/dev/null
          python -m json.tool tools/sea-region-expansion-plan-v2.json >/dev/null
          node --check js/world/chokepoints.js
          node --check js/economy/transitTolls.js
          node --check js/economy/trade.js
      - name: Build uncovered land
        run: |
          rm -rf /tmp/simworld-v2-land /tmp/simworld-v2-sea
          time python tools/build-map-expansion-v2-fast.py --output-dir /tmp/simworld-v2-land | tee /tmp/v2-land.log
          cp /tmp/simworld-v2-land/regions.geo.json data/world/regions.geo.json
          cp /tmp/simworld-v2-land/regions.meta.json data/world/regions.meta.json
          cp /tmp/simworld-v2-land/resources.initial.json data/world/resources.initial.json
      - name: Build seas and refresh all coastal adjacency
        run: |
          time python tools/build-sea-expansion-v2.py --land-geo data/world/regions.geo.json --output-dir /tmp/simworld-v2-sea | tee /tmp/v2-sea.log
          cp /tmp/simworld-v2-sea/seaRegions.geo.json data/world/seaRegions.geo.json
          cp /tmp/simworld-v2-sea/seaRegions.meta.json data/world/seaRegions.meta.json
      - name: Sanity check generated world
        run: |
          python - <<'PY'
          import json
          geo=json.load(open('data/world/regions.geo.json'))
          meta=json.load(open('data/world/regions.meta.json'))['regions']
          res=json.load(open('data/world/resources.initial.json'))
          sea=json.load(open('data/world/seaRegions.meta.json'))['seaRegions']
          ids=[f['properties']['id'] for f in geo['features']]
          mids=[m['id'] for m in meta]
          sea_ids={m['id'] for m in sea}
          assert len(ids)==len(set(ids)), 'duplicate land ids'
          assert set(ids)==set(mids)==set(res), 'land/meta/resource ids differ'
          assert len(ids)>598, 'expansion added no land beyond the live 598-region map'
          assert all(m.get('adjacentLand') for m in sea), 'sea without simulated coast'
          assert 'sea_azov' in sea_ids, 'Sea of Azov was not generated'
          print('LAND_REGIONS='+str(len(ids)))
          print('SEA_REGIONS='+str(len(sea)))
          print('NEW_LAND_REGIONS='+str(len(ids)-598))
          azov=next(m for m in sea if m['id']=='sea_azov')
          black=next(m for m in sea if m['id']=='sea_black')
          print('AZOV_AREA_SQKM='+str(round(azov['areaSqKm'])))
          print('AZOV_COASTALS='+str(len(azov['adjacentLand'])))
          print('BLACK_SEA_AREA_SQKM='+str(round(black['areaSqKm'])))
          PY
          git diff --check
      - name: Commit generated map on expansion branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/world/regions.geo.json data/world/regions.meta.json data/world/resources.initial.json data/world/seaRegions.geo.json data/world/seaRegions.meta.json
          if git diff --cached --quiet; then
            echo 'Generated map already current'
          else
            git commit -m 'Generate broad Europe Middle East and northwest Africa map'
            git pull --rebase
            git push
          fi
