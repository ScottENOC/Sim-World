name: Build broad Europe Middle East expansion

on:
  push:
    branches: [broad-europe-middle-east-expansion, cleanup-alpine-swiss-geography, cleanup-map-slivers-v1, fix-north-atlantic-seas-region-names]
    paths:
      - '.github/workflows/build-broad-map-expansion.yml'
      - 'tools/build-map-expansion-v2.py'
      - 'tools/build-map-expansion-v2-fast.py'
      - 'tools/build-map-expansion-v2-final.py'
      - 'tools/map-region-plan-v2.json'
      - 'tools/map-resource-plan-v2.json'
      - 'tools/build-sea-expansion-v2.py'
      - 'tools/sea-region-expansion-plan-v2.json'
      - 'tools/cleanup-region-display-names.py'
      - 'js/world/chokepoints.js'
      - 'js/economy/trade.js'
      - 'js/economy/transitTolls.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install map dependencies
        run: python -m pip install --disable-pip-version-check shapely==2.1.1 pyproj==3.7.2
      - name: Validate scripts, plans and current trade integration
        run: |
          python -m py_compile tools/build-map-expansion-v2.py tools/build-map-expansion-v2-fast.py tools/build-map-expansion-v2-final.py tools/build-sea-expansion-v2.py tools/cleanup-region-display-names.py
          python -m json.tool tools/map-region-plan-v2.json >/dev/null
          python -m json.tool tools/map-resource-plan-v2.json >/dev/null
          python -m json.tool tools/sea-region-expansion-plan-v2.json >/dev/null
          node --check js/world/chokepoints.js
          node --check js/economy/transitTolls.js
          node --check js/economy/trade.js
      - name: Build uncovered land
        run: |
          rm -rf /tmp/simworld-v2-land /tmp/simworld-v2-sea
          time python tools/build-map-expansion-v2-final.py --output-dir /tmp/simworld-v2-land | tee /tmp/v2-land.log
          cp /tmp/simworld-v2-land/regions.geo.json data/world/regions.geo.json
          cp /tmp/simworld-v2-land/regions.meta.json data/world/regions.meta.json
          cp /tmp/simworld-v2-land/resources.initial.json data/world/resources.initial.json
      - name: Apply unambiguous gameplay region names
        run: python tools/cleanup-region-display-names.py
      - name: Build seas and refresh all coastal adjacency
        run: |
          time python tools/build-sea-expansion-v2.py --land-geo data/world/regions.geo.json --output-dir /tmp/simworld-v2-sea | tee /tmp/v2-sea.log
          cp /tmp/simworld-v2-sea/seaRegions.geo.json data/world/seaRegions.geo.json
          cp /tmp/simworld-v2-sea/seaRegions.meta.json data/world/seaRegions.meta.json
      - name: Sanity check generated world
        run: |
          python - <<'PY'
          import json
          geo=json.load(open('data/world/regions.geo.json'))
          meta=json.load(open('data/world/regions.meta.json'))['regions']
          res=json.load(open('data/world/resources.initial.json'))
          sea=json.load(open('data/world/seaRegions.meta.json'))['seaRegions']
          ids=[f['properties']['id'] for f in geo['features']]
          idset=set(ids)
          mids=[m['id'] for m in meta]
          by_id={m['id']:m for m in meta}
          sea_ids={m['id'] for m in sea}
          assert len(ids)==627, f'expected polished 627-region map, got {len(ids)}'
          assert len(ids)==len(idset), 'duplicate land ids'
          assert idset==set(mids)==set(res), 'land/meta/resource ids differ'
          for m in meta:
              for n in m.get('neighbors',[]):
                  assert n in idset, f'dead neighbour id {n} from {m["name"]}'
                  assert m['id'] in by_id[n].get('neighbors',[]), f'non-reciprocal edge {m["name"]} -> {by_id[n]["name"]}'
          assert all(m.get('adjacentLand') for m in sea), 'sea without simulated coast'
          assert all(set(m.get('adjacentLand',[])) <= idset for m in sea), 'sea references removed land region'
          for required_sea in ('sea_azov','sea_hebrides','sea_faroe_shetland','sea_icelandic'):
              assert required_sea in sea_ids, f'{required_sea} was not generated'
          swiss=[f for f in geo['features'] if f.get('properties',{}).get('sourceGroup')=='CHE']
          assert len(swiss)==6, f'expected 6 Swiss gameplay regions, got {len(swiss)}'
          names={m['name'] for m in meta}
          for keep in ('Oslo','Bahrain','Hiiu maakond','Saare maakond','Svalbard','Northeast Iceland','Northwest Iceland','East Iceland','South Iceland','Eastern Arabia','Northern Arabia'):
              assert keep in names, f'expected gameplay name missing: {keep}'
          for gone in ('Poland','Belarus','Ukraine','Finland','Nord-Trøndelag','Sør-Trøndelag','Al Ahmadi','Al Jahrah','West Azarbaijan','Chukchi Autonomous Okrug','Northeastern Region','Northwestern Region hinterland','Southern Region','Northern Borders Region'):
              assert gone not in names, f'duplicate or generic label survived: {gone}'
          haut=next(m for m in meta if m['name']=='Haut-Rhin')
          assert all(by_id[n]['name']!='Tirol hinterland' for n in haut['neighbors']), 'Haut-Rhin still falsely neighbours Tirol'
          azov=next(m for m in sea if m['id']=='sea_azov')
          black=next(m for m in sea if m['id']=='sea_black')
          iceland=next(m for m in sea if m['id']=='sea_icelandic')
          hebrides=next(m for m in sea if m['id']=='sea_hebrides')
          assert any(by_id[rid]['name'].endswith('Iceland') for rid in iceland['adjacentLand']), 'Icelandic Waters does not touch Iceland'
          assert any(by_id[rid]['name'] in {'Highlands','Argyll','Western Isles'} for rid in hebrides['adjacentLand']), 'Hebrides & Minch does not touch western Scotland'
          assert len(azov['adjacentLand'])==5, f'unexpected Azov coastal count {len(azov["adjacentLand"])}'
          print('LAND_REGIONS='+str(len(ids)))
          print('SEA_REGIONS='+str(len(sea)))
          print('SWISS_REGIONS='+str(len(swiss)))
          print('AZOV_AREA_SQKM='+str(round(azov['areaSqKm'])))
          print('AZOV_COASTALS='+str(len(azov['adjacentLand'])))
          print('BLACK_SEA_AREA_SQKM='+str(round(black['areaSqKm'])))
          print('ICELANDIC_WATERS_COASTALS='+str(len(iceland['adjacentLand'])))
          print('HEBRIDES_COASTALS='+str(len(hebrides['adjacentLand'])))
          small=[m for m in meta if str(m['id']).startswith('r2_') and m.get('areaSqKm',0)<2500]
          print('SMALL_EXPANSION_REGIONS_AFTER='+str(len(small)))
          for m in sorted(small,key=lambda x:x['areaSqKm']):
              print(f'REMAINING_SMALL area={m["areaSqKm"]:.1f} name={m["name"]}')
          PY
          grep -q 'SLIVER_COMPACTION removedRegions=0' /tmp/v2-land.log
          git diff --check
      - name: Commit generated map on expansion branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/world/regions.geo.json data/world/regions.meta.json data/world/resources.initial.json data/world/seaRegions.geo.json data/world/seaRegions.meta.json
          if git diff --cached --quiet; then
            echo 'Generated map already current'
          else
            git commit -m 'Fill North Atlantic sea gaps and clarify region names'
            git pull --rebase
            git push
          fi
